<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="98" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">Pipeline vs Tensor Parallel</text>
  <text x="88" y="130" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">Both expand the model itself, but they repay the gain through different costs: bubble for stages, synchronization for split operators.</text>

  <rect x="104" y="194" width="500" height="370" rx="24" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <text x="132" y="234" fill="#92400E" font-size="24" font-family="Arial, sans-serif" font-weight="700">Pipeline parallel</text>
  <text x="132" y="270" fill="#92400E" font-size="18" font-family="Arial, sans-serif">split layers into stages</text>
  <rect x="132" y="314" width="90" height="50" rx="10" fill="#FFF7D6" stroke="#D97706" stroke-width="1.5"/>
  <rect x="236" y="314" width="90" height="50" rx="10" fill="#FFF7D6" stroke="#D97706" stroke-width="1.5"/>
  <rect x="340" y="314" width="90" height="50" rx="10" fill="#FFF7D6" stroke="#D97706" stroke-width="1.5"/>
  <rect x="444" y="314" width="90" height="50" rx="10" fill="#FFF7D6" stroke="#D97706" stroke-width="1.5"/>
  <text x="162" y="346" fill="#92400E" font-size="18" font-family="Arial, sans-serif">S1</text>
  <text x="266" y="346" fill="#92400E" font-size="18" font-family="Arial, sans-serif">S2</text>
  <text x="370" y="346" fill="#92400E" font-size="18" font-family="Arial, sans-serif">S3</text>
  <text x="474" y="346" fill="#92400E" font-size="18" font-family="Arial, sans-serif">S4</text>
  <text x="132" y="420" fill="#92400E" font-size="16" font-family="Arial, sans-serif">Main cost:</text>
  <text x="132" y="446" fill="#92400E" font-size="16" font-family="Arial, sans-serif">• bubble from fill / drain</text>
  <text x="132" y="470" fill="#92400E" font-size="16" font-family="Arial, sans-serif">• stage imbalance</text>
  <text x="132" y="494" fill="#92400E" font-size="16" font-family="Arial, sans-serif">• micro-batch scheduling pressure</text>

  <rect x="676" y="194" width="500" height="370" rx="24" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="704" y="234" fill="#1E3A8A" font-size="24" font-family="Arial, sans-serif" font-weight="700">Tensor parallel</text>
  <text x="704" y="270" fill="#1E3A8A" font-size="18" font-family="Arial, sans-serif">split one operator across cards</text>
  <rect x="734" y="314" width="104" height="60" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="852" y="314" width="104" height="60" rx="10" fill="#BFDBFE" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="970" y="314" width="104" height="60" rx="10" fill="#93C5FD" stroke="#2563EB" stroke-width="1.5"/>
  <text x="770" y="350" fill="#1E3A8A" font-size="18" font-family="Arial, sans-serif">W1</text>
  <text x="888" y="350" fill="#1E3A8A" font-size="18" font-family="Arial, sans-serif">W2</text>
  <text x="1006" y="350" fill="#1E3A8A" font-size="18" font-family="Arial, sans-serif">W3</text>
  <text x="704" y="420" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">Main cost:</text>
  <text x="704" y="446" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">• frequent synchronization</text>
  <text x="704" y="470" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">• small-batch communication overhead</text>
  <text x="704" y="494" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">• operator-level collectives</text>

  <rect x="104" y="596" width="1072" height="28" rx="10" fill="#ECFCCB" stroke="#65A30D" stroke-width="1.5"/>
  <text x="132" y="615" fill="#365314" font-size="16" font-family="Arial, sans-serif">Rule of thumb: pipeline pays mostly with bubble and stage balance; tensor parallel pays mostly with high-frequency synchronization.</text>
</svg>

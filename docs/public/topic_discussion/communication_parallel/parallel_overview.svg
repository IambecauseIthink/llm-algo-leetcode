<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="98" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">Why Systems Move to Parallelism</text>
  <text x="88" y="130" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">Single-card limits push the system to split states, layers or operators. The price comes back as communication, waiting and scheduling cost.</text>

  <rect x="96" y="192" width="232" height="112" rx="20" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <text x="122" y="234" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">Single-card limit</text>
  <text x="122" y="266" fill="#92400E" font-size="16" font-family="Arial, sans-serif">model / batch / activation</text>
  <text x="122" y="288" fill="#92400E" font-size="16" font-family="Arial, sans-serif">do not fit or train too slowly</text>

  <rect x="376" y="192" width="236" height="112" rx="20" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="406" y="234" fill="#1E3A8A" font-size="22" font-family="Arial, sans-serif" font-weight="700">Choose split axis</text>
  <text x="406" y="266" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">states / layers / operators</text>
  <text x="406" y="288" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">or experts</text>

  <rect x="660" y="192" width="236" height="112" rx="20" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="692" y="234" fill="#166534" font-size="22" font-family="Arial, sans-serif" font-weight="700">Cross-card execution</text>
  <text x="692" y="266" fill="#166534" font-size="16" font-family="Arial, sans-serif">computation is distributed,</text>
  <text x="692" y="288" fill="#166534" font-size="16" font-family="Arial, sans-serif">states are no longer local</text>

  <rect x="944" y="192" width="240" height="112" rx="20" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <text x="978" y="234" fill="#9D174D" font-size="22" font-family="Arial, sans-serif" font-weight="700">New bottlenecks</text>
  <text x="978" y="266" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">sync / wait / bubble /</text>
  <text x="978" y="288" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">load imbalance</text>

  <path d="M328 248H376" stroke="#374151" stroke-width="3"/>
  <path d="M612 248H660" stroke="#374151" stroke-width="3"/>
  <path d="M896 248H944" stroke="#374151" stroke-width="3"/>
  <path d="M361 240L376 248L361 256" fill="#374151"/>
  <path d="M645 240L660 248L645 256" fill="#374151"/>
  <path d="M929 240L944 248L929 256" fill="#374151"/>

  <rect x="96" y="380" width="340" height="214" rx="24" fill="#FFF7D6" stroke="#D97706" stroke-width="1.5"/>
  <text x="122" y="418" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">First question</text>
  <text x="122" y="452" fill="#92400E" font-size="17" font-family="Arial, sans-serif">Is the single-card problem mainly</text>
  <text x="122" y="476" fill="#92400E" font-size="17" font-family="Arial, sans-serif">memory, throughput, or model shape?</text>
  <text x="122" y="520" fill="#92400E" font-size="17" font-family="Arial, sans-serif">That answer decides whether you</text>
  <text x="122" y="544" fill="#92400E" font-size="17" font-family="Arial, sans-serif">start with data parallelism, state</text>
  <text x="122" y="568" fill="#92400E" font-size="17" font-family="Arial, sans-serif">sharding, pipeline, tensor split or MoE.</text>

  <rect x="470" y="380" width="336" height="214" rx="24" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="496" y="418" fill="#1E3A8A" font-size="22" font-family="Arial, sans-serif" font-weight="700">What this topic organizes</text>
  <text x="496" y="452" fill="#1E3A8A" font-size="17" font-family="Arial, sans-serif">01 why parallelism appears</text>
  <text x="496" y="478" fill="#1E3A8A" font-size="17" font-family="Arial, sans-serif">02 data parallel + sync</text>
  <text x="496" y="504" fill="#1E3A8A" font-size="17" font-family="Arial, sans-serif">03 state sharding / ZeRO</text>
  <text x="496" y="530" fill="#1E3A8A" font-size="17" font-family="Arial, sans-serif">04 pipeline + tensor parallel</text>
  <text x="496" y="556" fill="#1E3A8A" font-size="17" font-family="Arial, sans-serif">05 expert parallel + hotspots</text>

  <rect x="840" y="380" width="344" height="214" rx="24" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="866" y="418" fill="#166534" font-size="22" font-family="Arial, sans-serif" font-weight="700">Rule of thumb</text>
  <text x="866" y="452" fill="#166534" font-size="17" font-family="Arial, sans-serif">Parallelism solves a local limit by</text>
  <text x="866" y="476" fill="#166534" font-size="17" font-family="Arial, sans-serif">creating a distributed cost. The job</text>
  <text x="866" y="500" fill="#166534" font-size="17" font-family="Arial, sans-serif">of this topic is to identify which cost</text>
  <text x="866" y="524" fill="#166534" font-size="17" font-family="Arial, sans-serif">comes back after each kind of split.</text>
</svg>

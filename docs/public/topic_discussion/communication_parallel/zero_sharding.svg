<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="98" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">State Sharding and ZeRO</text>
  <text x="88" y="130" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">ZeRO reduces replicated resident states. The gain is memory budget. The return cost is extra access, collection and synchronization.</text>

  <rect x="104" y="196" width="470" height="350" rx="24" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <text x="132" y="236" fill="#92400E" font-size="24" font-family="Arial, sans-serif" font-weight="700">Before sharding</text>
  <text x="132" y="272" fill="#92400E" font-size="18" font-family="Arial, sans-serif">each card keeps the full resident states</text>
  <rect x="132" y="320" width="160" height="56" rx="12" fill="#FFF7D6" stroke="#D97706" stroke-width="1.5"/>
  <text x="170" y="354" fill="#92400E" font-size="18" font-family="Arial, sans-serif">params</text>
  <rect x="312" y="320" width="160" height="56" rx="12" fill="#FFF7D6" stroke="#D97706" stroke-width="1.5"/>
  <text x="350" y="354" fill="#92400E" font-size="18" font-family="Arial, sans-serif">grads</text>
  <rect x="222" y="406" width="160" height="56" rx="12" fill="#FFF7D6" stroke="#D97706" stroke-width="1.5"/>
  <text x="238" y="440" fill="#92400E" font-size="18" font-family="Arial, sans-serif">optimizer state</text>
  <text x="132" y="510" fill="#92400E" font-size="16" font-family="Arial, sans-serif">Main problem: memory is wasted by full replication.</text>

  <rect x="706" y="196" width="470" height="350" rx="24" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="734" y="236" fill="#1E3A8A" font-size="24" font-family="Arial, sans-serif" font-weight="700">After ZeRO-style sharding</text>
  <text x="734" y="272" fill="#1E3A8A" font-size="18" font-family="Arial, sans-serif">resident states are partitioned across cards</text>
  <rect x="734" y="320" width="88" height="56" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="836" y="320" width="88" height="56" rx="12" fill="#BFDBFE" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="938" y="320" width="88" height="56" rx="12" fill="#93C5FD" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="1040" y="320" width="88" height="56" rx="12" fill="#60A5FA" stroke="#2563EB" stroke-width="1.5"/>
  <text x="768" y="354" fill="#1E3A8A" font-size="18" font-family="Arial, sans-serif">P</text>
  <text x="870" y="354" fill="#1E3A8A" font-size="18" font-family="Arial, sans-serif">G</text>
  <text x="972" y="354" fill="#1E3A8A" font-size="18" font-family="Arial, sans-serif">O</text>
  <text x="1066" y="354" fill="#1E3A8A" font-size="18" font-family="Arial, sans-serif">...</text>
  <text x="734" y="430" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">Gain: each card stores less state</text>
  <text x="734" y="456" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">Cost: states must be gathered or synchronized</text>
  <text x="734" y="482" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">when computation reaches them</text>

  <rect x="104" y="592" width="1072" height="28" rx="10" fill="#ECFCCB" stroke="#65A30D" stroke-width="1.5"/>
  <text x="132" y="611" fill="#365314" font-size="16" font-family="Arial, sans-serif">Rule of thumb: ZeRO solves redundant resident states first. It does not remove communication; it moves communication to state access and synchronization.</text>
</svg>

<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="98" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">Data Parallelism and Gradient Synchronization</text>
  <text x="88" y="130" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">Computation replicates easily across cards. Parameter update does not. AllReduce is the first communication tax that appears.</text>

  <rect x="116" y="196" width="206" height="138" rx="20" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="156" y="236" fill="#1E3A8A" font-size="22" font-family="Arial, sans-serif" font-weight="700">GPU 0</text>
  <text x="146" y="270" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">forward / backward</text>
  <text x="146" y="294" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">local gradients</text>

  <rect x="388" y="196" width="206" height="138" rx="20" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="428" y="236" fill="#1E3A8A" font-size="22" font-family="Arial, sans-serif" font-weight="700">GPU 1</text>
  <text x="418" y="270" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">forward / backward</text>
  <text x="418" y="294" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">local gradients</text>

  <rect x="660" y="196" width="206" height="138" rx="20" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="700" y="236" fill="#1E3A8A" font-size="22" font-family="Arial, sans-serif" font-weight="700">GPU 2</text>
  <text x="690" y="270" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">forward / backward</text>
  <text x="690" y="294" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">local gradients</text>

  <rect x="932" y="196" width="206" height="138" rx="20" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="972" y="236" fill="#1E3A8A" font-size="22" font-family="Arial, sans-serif" font-weight="700">GPU 3</text>
  <text x="962" y="270" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">forward / backward</text>
  <text x="962" y="294" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">local gradients</text>

  <path d="M220 372C220 432 1010 432 1010 372" stroke="#D97706" stroke-width="4"/>
  <text x="504" y="408" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">AllReduce / synchronization</text>

  <rect x="116" y="468" width="1022" height="126" rx="24" fill="#FFF7D6" stroke="#D97706" stroke-width="1.5"/>
  <text x="146" y="506" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">What changes after you add cards</text>
  <text x="146" y="538" fill="#92400E" font-size="17" font-family="Arial, sans-serif">• per-GPU batch may become smaller, but global effective batch grows</text>
  <text x="146" y="564" fill="#92400E" font-size="17" font-family="Arial, sans-serif">• local compute replicates, gradient update must still agree globally</text>
  <text x="146" y="590" fill="#92400E" font-size="17" font-family="Arial, sans-serif">• if synchronization dominates, extra GPUs stop translating into throughput</text>

  <rect x="116" y="620" width="1022" height="20" rx="8" fill="#ECFCCB"/>
  <text x="142" y="635" fill="#365314" font-size="14" font-family="Arial, sans-serif">Read this figure when you ask: why didn’t extra GPUs produce proportional speedup?</text>
</svg>

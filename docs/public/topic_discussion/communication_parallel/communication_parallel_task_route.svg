<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#486581"/></marker>
    <style>
      .title{font:700 28px sans-serif;fill:#17324d}.task{font:700 18px sans-serif;fill:#17324d}.text{font:16px sans-serif;fill:#334e68}.small{font:14px sans-serif;fill:#486581}.box{stroke:#829ab1;stroke-width:2;rx:14}.line{stroke:#486581;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="650" fill="#f7fafc"/>
  <text x="600" y="44" text-anchor="middle" class="title">通信与并行学习路线：从切分目标到多卡决策</text>
  <rect x="45" y="95" width="250" height="150" fill="#e6f6f5" class="box"/><text x="70" y="130" class="task">Task 1 · 通信基础</text><text x="70" y="170" class="text">拓扑、AllReduce</text><text x="70" y="202" class="text">建立通信口径</text>
  <path d="M295 170 H330" class="line"/>
  <rect x="330" y="95" width="250" height="150" fill="#e6f6f5" class="box"/><text x="355" y="130" class="task">Task 2 · 状态分摊</text><text x="355" y="170" class="text">DDP、FSDP、ZeRO</text><text x="355" y="202" class="text">参数与优化器切分</text>
  <path d="M580 170 H615" class="line"/>
  <rect x="615" y="95" width="250" height="150" fill="#fff4e6" class="box"/><text x="640" y="130" class="task">Task 3 · 流水线并行</text><text x="640" y="170" class="text">微批次与执行时序</text><text x="640" y="202" class="text">观察 bubble</text>
  <path d="M865 170 H900" class="line"/>
  <rect x="900" y="95" width="255" height="150" fill="#fff4e6" class="box"/><text x="925" y="130" class="task">Task 4 · 张量并行</text><text x="925" y="170" class="text">切分维度与同步点</text><text x="925" y="202" class="text">计算 / 通信代价</text>
  <path d="M1027 245 V300 H900" class="line"/>
  <rect x="615" y="300" width="250" height="150" fill="#eef2ff" class="box"/><text x="640" y="335" class="task">Task 5 · 热点分析</text><text x="640" y="375" class="text">NCCL、专家通信</text><text x="640" y="407" class="text">定位等待与不均衡</text>
  <path d="M615 375 H580" class="line"/>
  <rect x="330" y="300" width="250" height="150" fill="#eef2ff" class="box"/><text x="355" y="335" class="task">Task 6 · 并行决策</text><text x="355" y="375" class="text">多卡 benchmark</text><text x="355" y="407" class="text">选择可解释的方案</text>
  <path d="M330 375 H295" class="line"/>
  <rect x="45" y="300" width="250" height="150" fill="#f0f4f8" class="box"/><text x="70" y="335" class="task">项目出口</text><text x="70" y="375" class="text">79 → 80 → 81</text><text x="70" y="407" class="text">扩展效率与服务结论</text>
  <path d="M170 450 V510 H1030 V450" class="line"/>
  <rect x="300" y="510" width="600" height="75" fill="#ffffff" class="box"/><text x="600" y="542" text-anchor="middle" class="task">验证出口</text><text x="600" y="570" text-anchor="middle" class="small">切分收益 → 通信时间 → 同步等待 → 吞吐、显存与扩展效率</text>

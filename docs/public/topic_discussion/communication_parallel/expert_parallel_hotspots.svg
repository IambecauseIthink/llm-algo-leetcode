<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="98" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">Expert Parallel and Communication Hotspots</text>
  <text x="88" y="130" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">Sparse experts save dense compute, but routing and imbalance push communication into a more dynamic and harder-to-diagnose regime.</text>

  <rect x="100" y="194" width="330" height="354" rx="24" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="128" y="234" fill="#166534" font-size="24" font-family="Arial, sans-serif" font-weight="700">1. Routing</text>
  <text x="128" y="270" fill="#166534" font-size="18" font-family="Arial, sans-serif">tokens are sent to experts dynamically</text>
  <rect x="128" y="314" width="80" height="44" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <rect x="224" y="314" width="80" height="44" rx="10" fill="#BBF7D0" stroke="#16A34A" stroke-width="1.5"/>
  <rect x="320" y="314" width="80" height="44" rx="10" fill="#86EFAC" stroke="#16A34A" stroke-width="1.5"/>
  <text x="154" y="342" fill="#166534" font-size="16" font-family="Arial, sans-serif">T1</text>
  <text x="250" y="342" fill="#166534" font-size="16" font-family="Arial, sans-serif">T2</text>
  <text x="346" y="342" fill="#166534" font-size="16" font-family="Arial, sans-serif">T3</text>
  <text x="128" y="420" fill="#166534" font-size="16" font-family="Arial, sans-serif">Main issue:</text>
  <text x="128" y="446" fill="#166534" font-size="16" font-family="Arial, sans-serif">routing pattern changes each batch</text>
  <text x="128" y="472" fill="#166534" font-size="16" font-family="Arial, sans-serif">so communication cost is less stable</text>

  <rect x="474" y="194" width="330" height="354" rx="24" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <text x="502" y="234" fill="#92400E" font-size="24" font-family="Arial, sans-serif" font-weight="700">2. Load imbalance</text>
  <text x="502" y="270" fill="#92400E" font-size="18" font-family="Arial, sans-serif">some experts receive more tokens</text>
  <rect x="502" y="322" width="48" height="148" rx="10" fill="#FFF7D6" stroke="#D97706" stroke-width="1.5"/>
  <rect x="566" y="360" width="48" height="110" rx="10" fill="#FFF7D6" stroke="#D97706" stroke-width="1.5"/>
  <rect x="630" y="286" width="48" height="184" rx="10" fill="#FCD34D" stroke="#D97706" stroke-width="1.5"/>
  <rect x="694" y="392" width="48" height="78" rx="10" fill="#FFF7D6" stroke="#D97706" stroke-width="1.5"/>
  <text x="510" y="494" fill="#92400E" font-size="16" font-family="Arial, sans-serif">E1</text>
  <text x="574" y="494" fill="#92400E" font-size="16" font-family="Arial, sans-serif">E2</text>
  <text x="638" y="494" fill="#92400E" font-size="16" font-family="Arial, sans-serif">E3</text>
  <text x="702" y="494" fill="#92400E" font-size="16" font-family="Arial, sans-serif">E4</text>
  <text x="502" y="526" fill="#92400E" font-size="16" font-family="Arial, sans-serif">Main issue: one hot expert can turn</text>
  <text x="502" y="550" fill="#92400E" font-size="16" font-family="Arial, sans-serif">sparse compute into waiting and congestion</text>

  <rect x="848" y="194" width="332" height="354" rx="24" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="876" y="234" fill="#1E3A8A" font-size="24" font-family="Arial, sans-serif" font-weight="700">3. Profiling hotspot</text>
  <text x="876" y="270" fill="#1E3A8A" font-size="18" font-family="Arial, sans-serif">waiting is now dynamic, not uniform</text>
  <rect x="876" y="320" width="260" height="148" rx="18" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="902" y="356" fill="#1E3A8A" font-size="18" font-family="Arial, sans-serif">Observe</text>
  <text x="902" y="388" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">• NCCL wait time</text>
  <text x="902" y="412" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">• imbalance across experts</text>
  <text x="902" y="436" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">• overlap and idle time</text>
  <text x="876" y="516" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">Main issue: without profiling, you only know</text>
  <text x="876" y="540" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">that it slowed down, not why it slowed down</text>

  <rect x="100" y="596" width="1080" height="28" rx="10" fill="#ECFCCB" stroke="#65A30D" stroke-width="1.5"/>
  <text x="128" y="614" fill="#365314" font-size="16" font-family="Arial, sans-serif">Rule of thumb: in expert parallel, communication is not only more frequent, but also more uneven and routing-dependent.</text>
</svg>

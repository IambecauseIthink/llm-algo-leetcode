<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="98" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">Parallel Benchmark Decision Flow</text>
  <text x="88" y="130" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">A parallel strategy is only worth keeping if the extra cards buy a meaningful system envelope after communication and scheduling costs are counted.</text>

  <rect x="104" y="204" width="196" height="92" rx="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="134" y="242" fill="#1E3A8A" font-size="22" font-family="Arial, sans-serif" font-weight="700">1. Fix workload</text>
  <text x="126" y="272" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">model, batch, seq,</text>
  <text x="126" y="294" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">GPU count, topology</text>

  <rect x="350" y="204" width="206" height="92" rx="18" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <text x="382" y="242" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">2. Measure split</text>
  <text x="382" y="272" fill="#92400E" font-size="16" font-family="Arial, sans-serif">memory, step time,</text>
  <text x="382" y="294" fill="#92400E" font-size="16" font-family="Arial, sans-serif">throughput, wait / bubble</text>

  <rect x="604" y="204" width="206" height="92" rx="18" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="632" y="242" fill="#166534" font-size="22" font-family="Arial, sans-serif" font-weight="700">3. Explain cost</text>
  <text x="642" y="272" fill="#166534" font-size="16" font-family="Arial, sans-serif">sync / bubble /</text>
  <text x="642" y="294" fill="#166534" font-size="16" font-family="Arial, sans-serif">imbalance / overlap</text>

  <rect x="858" y="204" width="230" height="92" rx="18" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <text x="888" y="242" fill="#9D174D" font-size="22" font-family="Arial, sans-serif" font-weight="700">4. Compare outcome</text>
  <text x="886" y="272" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">did the extra cards buy</text>
  <text x="886" y="294" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">real speed or scale?</text>

  <path d="M300 250H350" stroke="#374151" stroke-width="3"/>
  <path d="M556 250H604" stroke="#374151" stroke-width="3"/>
  <path d="M810 250H858" stroke="#374151" stroke-width="3"/>
  <path d="M335 242L350 250L335 258" fill="#374151"/>
  <path d="M589 242L604 250L589 258" fill="#374151"/>
  <path d="M843 242L858 250L843 258" fill="#374151"/>

  <rect x="160" y="390" width="248" height="154" rx="22" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="192" y="428" fill="#111827" font-size="22" font-family="Arial, sans-serif" font-weight="700">KEEP</text>
  <text x="192" y="464" fill="#374151" font-size="16" font-family="Arial, sans-serif">Parallel complexity rose,</text>
  <text x="192" y="488" fill="#374151" font-size="16" font-family="Arial, sans-serif">but scale or speed barely improved.</text>
  <text x="192" y="524" fill="#374151" font-size="16" font-family="Arial, sans-serif">Communication ate the expected gain.</text>

  <rect x="516" y="390" width="248" height="154" rx="22" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="548" y="428" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">TUNE</text>
  <text x="548" y="464" fill="#92400E" font-size="16" font-family="Arial, sans-serif">The split axis is plausible,</text>
  <text x="548" y="488" fill="#92400E" font-size="16" font-family="Arial, sans-serif">but micro-batch, overlap or routing</text>
  <text x="548" y="512" fill="#92400E" font-size="16" font-family="Arial, sans-serif">still leaves recoverable waste.</text>

  <rect x="872" y="390" width="248" height="154" rx="22" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="904" y="428" fill="#166534" font-size="22" font-family="Arial, sans-serif" font-weight="700">SWITCH</text>
  <text x="904" y="464" fill="#166534" font-size="16" font-family="Arial, sans-serif">The strategy creates stable</text>
  <text x="904" y="488" fill="#166534" font-size="16" font-family="Arial, sans-serif">memory or throughput gains that</text>
  <text x="904" y="512" fill="#166534" font-size="16" font-family="Arial, sans-serif">survive profiling and benchmark checks.</text>

  <path d="M973 296V360" stroke="#374151" stroke-width="3"/>
  <path d="M284 360H996" stroke="#374151" stroke-width="3"/>
  <path d="M284 360V390" stroke="#374151" stroke-width="3"/>
  <path d="M640 360V390" stroke="#374151" stroke-width="3"/>
  <path d="M996 360V390" stroke="#374151" stroke-width="3"/>

  <rect x="104" y="602" width="1008" height="30" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="128" y="621" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">A parallel method is justified only when benchmark gains remain after sync, bubble and hotspot costs are accounted for.</text>
</svg>

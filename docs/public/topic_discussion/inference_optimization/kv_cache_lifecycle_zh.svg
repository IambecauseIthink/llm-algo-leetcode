<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#52606d"/></marker></defs>
<rect width="1400" height="650" fill="#f7fafc"/>
<style>
.title{font:700 29px sans-serif;fill:#172b4d}.sub{font:15px sans-serif;fill:#52606d}.group{font:700 19px sans-serif;fill:#172b4d}.head{font:700 18px sans-serif;fill:#172b4d}.text{font:16px sans-serif;fill:#243b53}.small{font:14px sans-serif;fill:#52606d}.box{stroke-width:2;rx:14}.flow{stroke:#52606d;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.link{stroke:#829ab1;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}
</style>
<text x="700" y="42" text-anchor="middle" class="title">KV Cache：保存、分配、复用与容量治理</text>
<text x="700" y="70" text-anchor="middle" class="sub">先把 KV Cache 看成请求级状态，再按状态生命周期拆开四个管理问题。</text>

<rect x="445" y="102" width="510" height="102" fill="#e8f7ef" stroke="#45a36b" class="box"/>
<text x="700" y="139" text-anchor="middle" class="group">KV Cache 请求状态</text>
<text x="700" y="171" text-anchor="middle" class="text">Decode 保存历史 K / V；状态随长度、层数和并发增长</text>

<rect x="24" y="250" width="315" height="135" fill="#e8f1fb" stroke="#4c8eda" class="box"/>
<text x="181" y="288" text-anchor="middle" class="head">保存什么</text><text x="181" y="323" text-anchor="middle" class="text">请求级 K / V 状态</text><text x="181" y="355" text-anchor="middle" class="small">增长曲线 · 读取代价 · 峰值显存</text>
<rect x="369" y="250" width="315" height="135" fill="#eef6ff" stroke="#8ab4df" class="box"/>
<text x="526" y="288" text-anchor="middle" class="head">如何分配</text><text x="526" y="323" text-anchor="middle" class="text">PagedAttention / Block Table</text><text x="526" y="355" text-anchor="middle" class="small">碎片 · 尾块利用率 · 并发容量</text>
<rect x="714" y="250" width="315" height="135" fill="#e8f7ef" stroke="#45a36b" class="box"/>
<text x="871" y="288" text-anchor="middle" class="head">如何复用</text><text x="871" y="323" text-anchor="middle" class="text">Prefix Cache / Radix Cache</text><text x="871" y="355" text-anchor="middle" class="small">命中长度 · reused tokens · TTFT</text>
<rect x="1059" y="250" width="315" height="135" fill="#f0eefb" stroke="#8069b5" class="box"/>
<text x="1216" y="288" text-anchor="middle" class="head">如何治理</text><text x="1216" y="323" text-anchor="middle" class="text">驱逐 · 压缩 · KV Cache 量化</text><text x="1216" y="355" text-anchor="middle" class="small">预算 · OOM · 速度与质量</text>

<path d="M700 204 V224 H181 V250" class="flow"/><path d="M700 224 H526 V250" class="flow"/><path d="M700 224 H871 V250" class="flow"/><path d="M700 224 H1216 V250" class="flow"/>

<rect x="24" y="455" width="315" height="108" fill="#ffffff" stroke="#4c8eda" class="box"/>
<text x="181" y="493" text-anchor="middle" class="head">观察：容量</text><text x="181" y="526" text-anchor="middle" class="small">上下文长度 · batch · 峰值显存</text>
<rect x="369" y="455" width="315" height="108" fill="#ffffff" stroke="#8ab4df" class="box"/>
<text x="526" y="493" text-anchor="middle" class="head">观察：空间</text><text x="526" y="526" text-anchor="middle" class="small">Block 利用率 · 碎片 · 并发</text>
<rect x="714" y="455" width="315" height="108" fill="#ffffff" stroke="#45a36b" class="box"/>
<text x="871" y="493" text-anchor="middle" class="head">观察：复用</text><text x="871" y="526" text-anchor="middle" class="small">命中率 · 重复 Prefill · TTFT</text>
<rect x="1059" y="455" width="315" height="108" fill="#ffffff" stroke="#8069b5" class="box"/>
<text x="1216" y="493" text-anchor="middle" class="head">观察：边界</text><text x="1216" y="526" text-anchor="middle" class="small">OOM · TPOT · 质量回归</text>
<path d="M181 385 V455" class="link"/><path d="M526 385 V455" class="link"/><path d="M871 385 V455" class="link"/><path d="M1216 385 V455" class="link"/>
</svg>

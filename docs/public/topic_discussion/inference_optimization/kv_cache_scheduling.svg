<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="98" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">KV Cache Lifecycle and Scheduling</text>
  <text x="88" y="130" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">Cache is both a speed mechanism and a memory boundary. Growth, reuse and scheduling must be judged together.</text>

  <rect x="88" y="184" width="322" height="406" rx="24" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="118" y="224" fill="#166534" font-size="24" font-family="Arial, sans-serif" font-weight="700">1. Growth</text>
  <text x="118" y="262" fill="#166534" font-size="18" font-family="Arial, sans-serif">cache size grows with</text>
  <text x="118" y="290" fill="#166534" font-size="18" font-family="Arial, sans-serif">layers × KV heads × seq len × batch</text>
  <rect x="118" y="324" width="258" height="200" rx="18" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="142" y="362" fill="#166534" font-size="18" font-family="Arial, sans-serif">Signals</text>
  <text x="142" y="396" fill="#166534" font-size="16" font-family="Arial, sans-serif">• peak memory nears budget</text>
  <text x="142" y="422" fill="#166534" font-size="16" font-family="Arial, sans-serif">• batch can no longer increase</text>
  <text x="142" y="448" fill="#166534" font-size="16" font-family="Arial, sans-serif">• long context amplifies TPOT</text>
  <text x="142" y="486" fill="#166534" font-size="18" font-family="Arial, sans-serif">Question</text>
  <text x="142" y="516" fill="#166534" font-size="16" font-family="Arial, sans-serif">Is the problem natural growth,</text>
  <text x="142" y="538" fill="#166534" font-size="16" font-family="Arial, sans-serif">poor reuse, fragmentation,</text>
  <text x="142" y="560" fill="#166534" font-size="16" font-family="Arial, sans-serif">or wrong scheduling?</text>

  <rect x="478" y="184" width="322" height="406" rx="24" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="508" y="224" fill="#1E3A8A" font-size="24" font-family="Arial, sans-serif" font-weight="700">2. Reuse / Paging</text>
  <text x="508" y="262" fill="#1E3A8A" font-size="18" font-family="Arial, sans-serif">prefix caching, paged blocks,</text>
  <text x="508" y="290" fill="#1E3A8A" font-size="18" font-family="Arial, sans-serif">radix reuse</text>
  <rect x="508" y="324" width="230" height="54" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="548" y="358" fill="#1E3A8A" font-size="18" font-family="Arial, sans-serif" font-weight="700">shared prefix</text>
  <rect x="508" y="400" width="72" height="72" rx="12" fill="#BFDBFE" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="592" y="400" width="72" height="72" rx="12" fill="#93C5FD" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="676" y="400" width="72" height="72" rx="12" fill="#60A5FA" stroke="#2563EB" stroke-width="1.5"/>
  <text x="535" y="444" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">B1</text>
  <text x="618" y="444" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">B2</text>
  <text x="701" y="444" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">B3</text>
  <text x="508" y="512" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">• paging fights fragmentation</text>
  <text x="508" y="536" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">• reuse cuts repeated prefill</text>
  <text x="508" y="560" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">• radix reuse helps shared-history workloads</text>

  <rect x="868" y="184" width="312" height="406" rx="24" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <text x="898" y="224" fill="#9D174D" font-size="24" font-family="Arial, sans-serif" font-weight="700">3. Scheduling / Compression</text>
  <text x="898" y="262" fill="#9D174D" font-size="18" font-family="Arial, sans-serif">decode order and cache budget</text>
  <rect x="898" y="310" width="216" height="40" rx="10" fill="#FBCFE8" stroke="#DB2777" stroke-width="1.5"/>
  <text x="920" y="336" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">prefill queue</text>
  <rect x="898" y="370" width="248" height="40" rx="10" fill="#F9A8D4" stroke="#DB2777" stroke-width="1.5"/>
  <text x="920" y="396" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">decode micro-batch</text>
  <rect x="898" y="430" width="190" height="40" rx="10" fill="#F472B6" stroke="#DB2777" stroke-width="1.5"/>
  <text x="920" y="456" fill="#831843" font-size="16" font-family="Arial, sans-serif">evict / quantize</text>
  <text x="898" y="512" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">• scheduling changes real TPOT</text>
  <text x="898" y="536" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">• quantization is last, not first</text>
  <text x="898" y="560" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">• first fix reuse and paging</text>

  <path d="M410 388H478" stroke="#374151" stroke-width="3"/>
  <path d="M800 388H868" stroke="#374151" stroke-width="3"/>
  <path d="M463 380L478 388L463 396" fill="#374151"/>
  <path d="M853 380L868 388L853 396" fill="#374151"/>

  <rect x="88" y="622" width="1092" height="24" rx="10" fill="#FEF3C7"/>
  <text x="112" y="639" fill="#92400E" font-size="15" font-family="Arial, sans-serif">Routing rule: if cache is already near budget, read this page before deciding that decode strategy or quantization is the primary fix.</text>
</svg>

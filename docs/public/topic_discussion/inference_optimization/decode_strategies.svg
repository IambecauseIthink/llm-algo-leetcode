<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="98" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">Decode Strategies: How Do We Reduce Token-Loop Cost?</text>
  <text x="88" y="130" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">Decode is slow because it is small work repeated many times. The main options change loop count, verification cost, or scheduling efficiency.</text>

  <rect x="88" y="184" width="260" height="380" rx="24" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <text x="114" y="224" fill="#92400E" font-size="24" font-family="Arial, sans-serif" font-weight="700">Baseline decode</text>
  <text x="114" y="262" fill="#92400E" font-size="17" font-family="Arial, sans-serif">one token per loop</text>
  <rect x="114" y="304" width="200" height="42" rx="10" fill="#FFF7D6" stroke="#D97706" stroke-width="1.5"/>
  <text x="142" y="331" fill="#92400E" font-size="16" font-family="Arial, sans-serif">step 1 → token 1</text>
  <rect x="114" y="364" width="200" height="42" rx="10" fill="#FFF7D6" stroke="#D97706" stroke-width="1.5"/>
  <text x="142" y="391" fill="#92400E" font-size="16" font-family="Arial, sans-serif">step 2 → token 2</text>
  <rect x="114" y="424" width="200" height="42" rx="10" fill="#FFF7D6" stroke="#D97706" stroke-width="1.5"/>
  <text x="142" y="451" fill="#92400E" font-size="16" font-family="Arial, sans-serif">step 3 → token 3</text>
  <text x="114" y="510" fill="#92400E" font-size="16" font-family="Arial, sans-serif">Pros: simple, stable</text>
  <text x="114" y="536" fill="#92400E" font-size="16" font-family="Arial, sans-serif">Risk: TPOT stays high when</text>
  <text x="114" y="558" fill="#92400E" font-size="16" font-family="Arial, sans-serif">loop overhead dominates</text>

  <rect x="382" y="184" width="260" height="380" rx="24" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="408" y="224" fill="#1E3A8A" font-size="24" font-family="Arial, sans-serif" font-weight="700">Speculative decode</text>
  <text x="408" y="262" fill="#1E3A8A" font-size="17" font-family="Arial, sans-serif">draft first, verify later</text>
  <rect x="408" y="310" width="208" height="42" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="432" y="337" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">draft model proposes</text>
  <rect x="408" y="374" width="208" height="42" rx="10" fill="#BFDBFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="442" y="401" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">target model verifies</text>
  <rect x="408" y="438" width="208" height="42" rx="10" fill="#93C5FD" stroke="#2563EB" stroke-width="1.5"/>
  <text x="446" y="465" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">accept / reject</text>
  <text x="408" y="510" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">Pros: reduce effective loops</text>
  <text x="408" y="536" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">Risk: low acceptance gives</text>
  <text x="408" y="558" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">verification cost without speedup</text>

  <rect x="676" y="184" width="260" height="380" rx="24" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="702" y="224" fill="#166534" font-size="24" font-family="Arial, sans-serif" font-weight="700">Multi-token decode</text>
  <text x="702" y="262" fill="#166534" font-size="17" font-family="Arial, sans-serif">try to emit more per round</text>
  <rect x="702" y="324" width="208" height="52" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="740" y="356" fill="#166534" font-size="16" font-family="Arial, sans-serif">round 1 → t1, t2</text>
  <rect x="702" y="396" width="208" height="52" rx="10" fill="#BBF7D0" stroke="#16A34A" stroke-width="1.5"/>
  <text x="740" y="428" fill="#166534" font-size="16" font-family="Arial, sans-serif">round 2 → t3, t4</text>
  <text x="702" y="510" fill="#166534" font-size="16" font-family="Arial, sans-serif">Pros: lower loop count</text>
  <text x="702" y="536" fill="#166534" font-size="16" font-family="Arial, sans-serif">Risk: acceptance / rollback</text>
  <text x="702" y="558" fill="#166534" font-size="16" font-family="Arial, sans-serif">logic becomes more complex</text>

  <rect x="970" y="184" width="210" height="380" rx="24" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <text x="996" y="224" fill="#9D174D" font-size="24" font-family="Arial, sans-serif" font-weight="700">Scheduling</text>
  <text x="996" y="262" fill="#9D174D" font-size="17" font-family="Arial, sans-serif">system-level ordering</text>
  <rect x="996" y="320" width="158" height="38" rx="10" fill="#FBCFE8" stroke="#DB2777" stroke-width="1.5"/>
  <text x="1022" y="344" fill="#9D174D" font-size="15" font-family="Arial, sans-serif">decode batch</text>
  <rect x="996" y="374" width="178" height="38" rx="10" fill="#F9A8D4" stroke="#DB2777" stroke-width="1.5"/>
  <text x="1022" y="398" fill="#9D174D" font-size="15" font-family="Arial, sans-serif">priority reorder</text>
  <rect x="996" y="428" width="148" height="38" rx="10" fill="#F472B6" stroke="#DB2777" stroke-width="1.5"/>
  <text x="1022" y="452" fill="#831843" font-size="15" font-family="Arial, sans-serif">queue split</text>
  <text x="996" y="510" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">Pros: better real throughput</text>
  <text x="996" y="536" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">Risk: helps system shape,</text>
  <text x="996" y="558" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">not token math directly</text>

  <rect x="88" y="600" width="1092" height="42" rx="14" fill="#ECFCCB" stroke="#65A30D" stroke-width="1.5"/>
  <text x="112" y="627" fill="#365314" font-size="17" font-family="Arial, sans-serif">Rule of thumb: if TPOT is high, first ask whether the problem is too many loops, poor acceptance, or poor request ordering.</text>
</svg>

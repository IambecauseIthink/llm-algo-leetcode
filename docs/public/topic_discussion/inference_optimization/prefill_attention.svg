<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="98" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">Prefill: Why Long Prompts Increase TTFT</text>
  <text x="88" y="130" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">The key issue is not only FLOPs. It is repeated HBM traffic from score matrices and intermediate writes.</text>

  <rect x="88" y="186" width="470" height="372" rx="24" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <text x="116" y="224" fill="#92400E" font-size="24" font-family="Arial, sans-serif" font-weight="700">Naive Attention Path</text>
  <rect x="124" y="262" width="122" height="66" rx="14" fill="#FFF7D6" stroke="#D97706" stroke-width="1.5"/>
  <text x="160" y="303" fill="#92400E" font-size="20" font-family="Arial, sans-serif" font-weight="700">Q / K / V</text>
  <rect x="278" y="262" width="132" height="66" rx="14" fill="#FFF7D6" stroke="#D97706" stroke-width="1.5"/>
  <text x="309" y="302" fill="#92400E" font-size="20" font-family="Arial, sans-serif" font-weight="700">QK score</text>
  <rect x="442" y="262" width="84" height="66" rx="14" fill="#FFF7D6" stroke="#D97706" stroke-width="1.5"/>
  <text x="459" y="302" fill="#92400E" font-size="20" font-family="Arial, sans-serif" font-weight="700">P·V</text>
  <path d="M246 295H278" stroke="#92400E" stroke-width="3"/>
  <path d="M410 295H442" stroke="#92400E" stroke-width="3"/>
  <path d="M263 287L278 295L263 303" fill="#92400E"/>
  <path d="M427 287L442 295L427 303" fill="#92400E"/>
  <rect x="124" y="362" width="402" height="142" rx="18" fill="#FFF7D6" stroke="#D97706" stroke-width="1.5"/>
  <text x="148" y="398" fill="#92400E" font-size="20" font-family="Arial, sans-serif" font-weight="700">Cost signature</text>
  <text x="148" y="430" fill="#92400E" font-size="17" font-family="Arial, sans-serif">1. materialize large score / softmax intermediates</text>
  <text x="148" y="456" fill="#92400E" font-size="17" font-family="Arial, sans-serif">2. repeated read/write to HBM</text>
  <text x="148" y="482" fill="#92400E" font-size="17" font-family="Arial, sans-serif">3. TTFT increases quickly as prompt length grows</text>

  <rect x="614" y="186" width="566" height="372" rx="24" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="644" y="224" fill="#1E3A8A" font-size="24" font-family="Arial, sans-serif" font-weight="700">FlashAttention / Chunked Prefill Path</text>
  <rect x="650" y="262" width="128" height="66" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="688" y="303" fill="#1E3A8A" font-size="20" font-family="Arial, sans-serif" font-weight="700">Tile 1</text>
  <rect x="808" y="262" width="128" height="66" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="846" y="303" fill="#1E3A8A" font-size="20" font-family="Arial, sans-serif" font-weight="700">Tile 2</text>
  <rect x="966" y="262" width="128" height="66" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="1004" y="303" fill="#1E3A8A" font-size="20" font-family="Arial, sans-serif" font-weight="700">Tile n</text>
  <path d="M778 295H808" stroke="#1E3A8A" stroke-width="3"/>
  <path d="M936 295H966" stroke="#1E3A8A" stroke-width="3"/>
  <path d="M793 287L808 295L793 303" fill="#1E3A8A"/>
  <path d="M951 287L966 295L951 303" fill="#1E3A8A"/>
  <rect x="650" y="362" width="444" height="142" rx="18" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="676" y="398" fill="#1E3A8A" font-size="20" font-family="Arial, sans-serif" font-weight="700">What changes</text>
  <text x="676" y="430" fill="#1E3A8A" font-size="17" font-family="Arial, sans-serif">1. keep tiles in SRAM longer</text>
  <text x="676" y="456" fill="#1E3A8A" font-size="17" font-family="Arial, sans-serif">2. online softmax reduces full-matrix writeback</text>
  <text x="676" y="482" fill="#1E3A8A" font-size="17" font-family="Arial, sans-serif">3. chunked prefill makes very long prompts schedulable</text>

  <rect x="88" y="590" width="1092" height="50" rx="16" fill="#ECFCCB" stroke="#65A30D" stroke-width="1.5"/>
  <text x="114" y="622" fill="#365314" font-size="18" font-family="Arial, sans-serif">Read this figure when TTFT is high and prompt length is the first variable that makes latency explode.</text>
</svg>

<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="98" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">Benchmark Decision Flow</text>
  <text x="88" y="130" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">The point of the report is not to repeat the mechanism. It is to decide whether a candidate should be kept, tuned, or switched.</text>

  <rect x="104" y="204" width="198" height="92" rx="18" fill="#DCEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="136" y="242" fill="#1E3A8A" font-size="22" font-family="Arial, sans-serif" font-weight="700">1. Fix workload</text>
  <text x="128" y="272" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">model, backend, batch,</text>
  <text x="128" y="294" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">prompt/gen tokens, dtype</text>

  <rect x="350" y="204" width="206" height="92" rx="18" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <text x="382" y="242" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">2. Measure split</text>
  <text x="384" y="272" fill="#92400E" font-size="16" font-family="Arial, sans-serif">TTFT, TPOT, throughput,</text>
  <text x="384" y="294" fill="#92400E" font-size="16" font-family="Arial, sans-serif">peak memory</text>

  <rect x="604" y="204" width="206" height="92" rx="18" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="630" y="242" fill="#166534" font-size="22" font-family="Arial, sans-serif" font-weight="700">3. Diagnose</text>
  <text x="640" y="272" fill="#166534" font-size="16" font-family="Arial, sans-serif">prefill-bound /</text>
  <text x="640" y="294" fill="#166534" font-size="16" font-family="Arial, sans-serif">decode-bound / memory-bound</text>

  <rect x="858" y="204" width="214" height="92" rx="18" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <text x="888" y="242" fill="#9D174D" font-size="22" font-family="Arial, sans-serif" font-weight="700">4. Compare</text>
  <text x="892" y="272" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">baseline vs candidate</text>
  <text x="892" y="294" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">one variable at a time</text>

  <path d="M302 250H350" stroke="#374151" stroke-width="3"/>
  <path d="M556 250H604" stroke="#374151" stroke-width="3"/>
  <path d="M810 250H858" stroke="#374151" stroke-width="3"/>
  <path d="M335 242L350 250L335 258" fill="#374151"/>
  <path d="M589 242L604 250L589 258" fill="#374151"/>
  <path d="M843 242L858 250L843 258" fill="#374151"/>

  <rect x="168" y="390" width="246" height="156" rx="22" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="200" y="428" fill="#111827" font-size="22" font-family="Arial, sans-serif" font-weight="700">KEEP</text>
  <text x="200" y="464" fill="#374151" font-size="16" font-family="Arial, sans-serif">gain is too small,</text>
  <text x="200" y="488" fill="#374151" font-size="16" font-family="Arial, sans-serif">or regression is too costly</text>
  <text x="200" y="524" fill="#374151" font-size="16" font-family="Arial, sans-serif">Example: TTFT worsens in an</text>
  <text x="200" y="546" fill="#374151" font-size="16" font-family="Arial, sans-serif">interactive workload</text>

  <rect x="516" y="390" width="246" height="156" rx="22" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="548" y="428" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">TUNE</text>
  <text x="548" y="464" fill="#92400E" font-size="16" font-family="Arial, sans-serif">direction is correct,</text>
  <text x="548" y="488" fill="#92400E" font-size="16" font-family="Arial, sans-serif">but scheduling / params /</text>
  <text x="548" y="510" fill="#92400E" font-size="16" font-family="Arial, sans-serif">backend still need work</text>
  <text x="548" y="546" fill="#92400E" font-size="16" font-family="Arial, sans-serif">Example: throughput rises but</text>
  <text x="548" y="568" fill="#92400E" font-size="16" font-family="Arial, sans-serif">acceptance is unstable</text>

  <rect x="864" y="390" width="246" height="156" rx="22" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="896" y="428" fill="#166534" font-size="22" font-family="Arial, sans-serif" font-weight="700">SWITCH</text>
  <text x="896" y="464" fill="#166534" font-size="16" font-family="Arial, sans-serif">gain is stable and aligned</text>
  <text x="896" y="488" fill="#166534" font-size="16" font-family="Arial, sans-serif">with the service goal</text>
  <text x="896" y="524" fill="#166534" font-size="16" font-family="Arial, sans-serif">Example: TPOT and throughput</text>
  <text x="896" y="546" fill="#166534" font-size="16" font-family="Arial, sans-serif">improve without budget regression</text>

  <path d="M965 296V360" stroke="#374151" stroke-width="3"/>
  <path d="M292 360H988" stroke="#374151" stroke-width="3"/>
  <path d="M292 360V390" stroke="#374151" stroke-width="3"/>
  <path d="M639 360V390" stroke="#374151" stroke-width="3"/>
  <path d="M988 360V390" stroke="#374151" stroke-width="3"/>

  <rect x="104" y="600" width="1006" height="32" rx="12" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="130" y="621" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">Never decide from a single metric. The report is valid only when workload, split metrics, bottleneck diagnosis and trade-offs stay in the same frame.</text>
</svg>

<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="98" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">Weight-Only Compression</text>
  <text x="88" y="130" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">GPTQ and AWQ both compress post-training weights, but they protect accuracy through different assumptions about where the sensitivity lives.</text>

  <rect x="108" y="196" width="266" height="352" rx="24" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <text x="136" y="236" fill="#92400E" font-size="24" font-family="Arial, sans-serif" font-weight="700">W8A16 baseline</text>
  <text x="136" y="272" fill="#92400E" font-size="16" font-family="Arial, sans-serif">Easiest weight-only entry point</text>
  <text x="136" y="302" fill="#92400E" font-size="16" font-family="Arial, sans-serif">• quick memory reduction</text>
  <text x="136" y="326" fill="#92400E" font-size="16" font-family="Arial, sans-serif">• limited sophistication</text>
  <text x="136" y="350" fill="#92400E" font-size="16" font-family="Arial, sans-serif">• first deployment ledger</text>

  <rect x="418" y="196" width="336" height="352" rx="24" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="446" y="236" fill="#5B21B6" font-size="24" font-family="Arial, sans-serif" font-weight="700">GPTQ</text>
  <text x="446" y="272" fill="#5B21B6" font-size="16" font-family="Arial, sans-serif">Post-training error compensation</text>
  <rect x="446" y="314" width="278" height="146" rx="18" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="472" y="350" fill="#5B21B6" font-size="18" font-family="Arial, sans-serif">Bias</text>
  <text x="472" y="382" fill="#5B21B6" font-size="16" font-family="Arial, sans-serif">Treat weight quantization as an optimization</text>
  <text x="472" y="406" fill="#5B21B6" font-size="16" font-family="Arial, sans-serif">problem and compensate downstream error.</text>
  <text x="446" y="502" fill="#5B21B6" font-size="16" font-family="Arial, sans-serif">Best when you need aggressive post-training compression.</text>

  <rect x="798" y="196" width="374" height="352" rx="24" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="826" y="236" fill="#1E3A8A" font-size="24" font-family="Arial, sans-serif" font-weight="700">AWQ</text>
  <text x="826" y="272" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">Activation-aware protection</text>
  <rect x="826" y="314" width="316" height="146" rx="18" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="852" y="350" fill="#1E3A8A" font-size="18" font-family="Arial, sans-serif">Bias</text>
  <text x="852" y="382" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">Protect channels / weights that activations</text>
  <text x="852" y="406" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">make especially sensitive to quantization error.</text>
  <text x="826" y="502" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">Best when preserving accuracy is the main post-training concern.</text>

  <rect x="108" y="606" width="1064" height="28" rx="10" fill="#ECFCCB" stroke="#65A30D" stroke-width="1.5"/>
  <text x="136" y="624" fill="#365314" font-size="16" font-family="Arial, sans-serif">Rule of thumb: start with simple weight-only compression, then move to GPTQ / AWQ when memory gain must be preserved with tighter accuracy control.</text>
</svg>

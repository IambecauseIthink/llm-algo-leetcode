<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="98" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">PTQ vs QAT: When Does Quantization Enter the Pipeline?</text>
  <text x="88" y="130" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">The first major choice is timing: compress after training for speed, or bring the quantization error back into training for robustness.</text>

  <rect x="110" y="198" width="458" height="362" rx="24" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <text x="140" y="238" fill="#92400E" font-size="24" font-family="Arial, sans-serif" font-weight="700">PTQ</text>
  <text x="140" y="274" fill="#92400E" font-size="18" font-family="Arial, sans-serif">Train full-precision model first</text>
  <path d="M160 320H514" stroke="#92400E" stroke-width="3"/>
  <circle cx="188" cy="320" r="10" fill="#92400E"/>
  <circle cx="338" cy="320" r="10" fill="#92400E"/>
  <circle cx="488" cy="320" r="10" fill="#92400E"/>
  <text x="160" y="356" fill="#92400E" font-size="16" font-family="Arial, sans-serif">train FP model</text>
  <text x="302" y="356" fill="#92400E" font-size="16" font-family="Arial, sans-serif">calibrate</text>
  <text x="448" y="356" fill="#92400E" font-size="16" font-family="Arial, sans-serif">deploy</text>
  <rect x="140" y="404" width="384" height="110" rx="18" fill="#FFF7D6" stroke="#D97706" stroke-width="1.5"/>
  <text x="166" y="438" fill="#92400E" font-size="18" font-family="Arial, sans-serif">Best when</text>
  <text x="166" y="468" fill="#92400E" font-size="16" font-family="Arial, sans-serif">• you need the fastest validation loop</text>
  <text x="166" y="492" fill="#92400E" font-size="16" font-family="Arial, sans-serif">• post-training accuracy is still acceptable</text>

  <rect x="712" y="198" width="458" height="362" rx="24" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="742" y="238" fill="#1E3A8A" font-size="24" font-family="Arial, sans-serif" font-weight="700">QAT</text>
  <text x="742" y="274" fill="#1E3A8A" font-size="18" font-family="Arial, sans-serif">Inject quantization error during training</text>
  <path d="M762 320H1116" stroke="#1E3A8A" stroke-width="3"/>
  <circle cx="790" cy="320" r="10" fill="#1E3A8A"/>
  <circle cx="940" cy="320" r="10" fill="#1E3A8A"/>
  <circle cx="1090" cy="320" r="10" fill="#1E3A8A"/>
  <text x="762" y="356" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">fake quant / train</text>
  <text x="910" y="356" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">adapt</text>
  <text x="1050" y="356" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">deploy</text>
  <rect x="742" y="404" width="384" height="110" rx="18" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="768" y="438" fill="#1E3A8A" font-size="18" font-family="Arial, sans-serif">Best when</text>
  <text x="768" y="468" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">• PTQ accuracy loss is too large</text>
  <text x="768" y="492" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">• you still have training budget</text>

  <rect x="110" y="606" width="1060" height="28" rx="10" fill="#ECFCCB" stroke="#65A30D" stroke-width="1.5"/>
  <text x="136" y="624" fill="#365314" font-size="16" font-family="Arial, sans-serif">Rule of thumb: first use PTQ to establish a gain ledger; move to QAT only when post-training error becomes the dominant problem.</text>
</svg>

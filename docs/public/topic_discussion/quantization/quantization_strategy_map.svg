<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#486581"/></marker></defs>
<style>.title{font:700 29px sans-serif;fill:#17324d}.sub{font:15px sans-serif;fill:#526581}.label{font:700 18px sans-serif;fill:#17324d}.txt{font:15px sans-serif;fill:#334e68}.small{font:14px sans-serif;fill:#486581}.card{stroke-width:2;rx:18}.flow{stroke:#486581;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.guide{stroke:#9fb3c8;stroke-width:2;fill:none;stroke-dasharray:7 6}</style>
<rect width="1280" height="700" fill="#fbfcfe"/>
<text x="640" y="48" text-anchor="middle" class="title">量化路线：对象、时机与部署证据</text>
<text x="640" y="78" text-anchor="middle" class="sub">量化不是单一压缩比例，而是对不同对象改变表示、计算路径和质量约束。</text>

<rect x="470" y="120" width="340" height="110" rx="30" fill="#e6f0ff" stroke="#8fb3d8" stroke-width="2"/>
<text x="640" y="162" text-anchor="middle" class="label">量化决策</text><text x="640" y="195" text-anchor="middle" class="txt">压缩什么？何时处理？谁来执行？</text>

<rect x="90" y="300" width="300" height="155" class="card" fill="#e8f5ee" stroke="#76b893"/><text x="240" y="340" text-anchor="middle" class="label">权重表示</text><text x="240" y="375" text-anchor="middle" class="txt">W8A16 · GPTQ · AWQ</text><text x="240" y="408" text-anchor="middle" class="small">部署前转换，影响装载与带宽</text>
<rect x="490" y="300" width="300" height="155" class="card" fill="#fff4d6" stroke="#e0b34f"/><text x="640" y="340" text-anchor="middle" class="label">运行时计算</text><text x="640" y="375" text-anchor="middle" class="txt">FP8 · 激活低精度</text><text x="640" y="408" text-anchor="middle" class="small">依赖硬件与 kernel 路径</text>
<rect x="890" y="300" width="300" height="155" class="card" fill="#fce8e6" stroke="#d98b87"/><text x="1040" y="340" text-anchor="middle" class="label">KV Cache</text><text x="1040" y="375" text-anchor="middle" class="txt">请求期间改变缓存表示</text><text x="1040" y="408" text-anchor="middle" class="small">影响长上下文与并发容量</text>
<path d="M640 230 V265 H240 V300" class="flow"/><path d="M640 230 V300" class="flow"/><path d="M640 265 H1040 V300" class="flow"/>

<rect x="220" y="540" width="260" height="85" rx="22" fill="#fff" stroke="#829ab1" stroke-width="2"/><text x="350" y="576" text-anchor="middle" class="label">部署兑现</text><text x="350" y="603" text-anchor="middle" class="small">格式 · loader · backend · kernel</text>
<rect x="510" y="540" width="260" height="85" rx="22" fill="#fff" stroke="#829ab1" stroke-width="2"/><text x="640" y="576" text-anchor="middle" class="label">系统指标</text><text x="640" y="603" text-anchor="middle" class="small">显存 · 延迟 · 吞吐 · 并发</text>
<rect x="800" y="540" width="260" height="85" rx="22" fill="#fff" stroke="#829ab1" stroke-width="2"/><text x="930" y="576" text-anchor="middle" class="label">质量约束</text><text x="930" y="603" text-anchor="middle" class="small">误差 · 任务质量 · 稳定性</text>
<path d="M240 455 V495 H350 V540" class="flow"/><path d="M640 455 V540" class="flow"/><path d="M1040 455 V495 H930 V540" class="flow"/>
<text x="640" y="665" text-anchor="middle" class="small">只有目标 backend 成功加载并走到对应 kernel，容量收益才是部署证据。</text>
</svg>

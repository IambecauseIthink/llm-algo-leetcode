<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="98" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">FP8 and KV Cache Quantization</text>
  <text x="88" y="130" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">Both are low-precision routes, but one is mainly an execution-stack path and the other is mainly a service-side cache-budget path.</text>

  <rect x="104" y="196" width="500" height="360" rx="24" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="134" y="236" fill="#1E3A8A" font-size="24" font-family="Arial, sans-serif" font-weight="700">FP8</text>
  <text x="134" y="274" fill="#1E3A8A" font-size="18" font-family="Arial, sans-serif">Execution-path low precision</text>
  <rect x="134" y="320" width="410" height="148" rx="18" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="160" y="356" fill="#1E3A8A" font-size="18" font-family="Arial, sans-serif">Key dependencies</text>
  <text x="160" y="388" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">• hardware support</text>
  <text x="160" y="412" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">• backend and kernel maturity</text>
  <text x="160" y="436" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">• accumulation / stability handling</text>
  <text x="134" y="516" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">Main question: can the stack exploit FP8 safely and efficiently?</text>

  <rect x="676" y="196" width="500" height="360" rx="24" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="706" y="236" fill="#166534" font-size="24" font-family="Arial, sans-serif" font-weight="700">KV Cache Quantization</text>
  <text x="706" y="274" fill="#166534" font-size="18" font-family="Arial, sans-serif">Service-side cache compression</text>
  <rect x="706" y="320" width="410" height="148" rx="18" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="732" y="356" fill="#166534" font-size="18" font-family="Arial, sans-serif">Key dependencies</text>
  <text x="732" y="388" fill="#166534" font-size="16" font-family="Arial, sans-serif">• long-context workload</text>
  <text x="732" y="412" fill="#166534" font-size="16" font-family="Arial, sans-serif">• concurrency / cache budget pressure</text>
  <text x="732" y="436" fill="#166534" font-size="16" font-family="Arial, sans-serif">• quality tolerance for cache error</text>
  <text x="706" y="516" fill="#166534" font-size="16" font-family="Arial, sans-serif">Main question: does cache compression expand usable context or concurrency?</text>

  <rect x="104" y="606" width="1072" height="28" rx="10" fill="#ECFCCB" stroke="#65A30D" stroke-width="1.5"/>
  <text x="132" y="624" fill="#365314" font-size="16" font-family="Arial, sans-serif">Routing rule: if the constraint is backend capability, read FP8 first; if the constraint is service cache budget, read KV cache quantization first.</text>
</svg>

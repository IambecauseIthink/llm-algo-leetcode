<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="98" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">What Are You Quantizing?</text>
  <text x="88" y="130" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">Quantization is not one action. Different objects create different error paths and different deployment gains.</text>

  <rect x="98" y="186" width="320" height="384" rx="24" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="126" y="224" fill="#5B21B6" font-size="24" font-family="Arial, sans-serif" font-weight="700">Weights</text>
  <text x="126" y="260" fill="#5B21B6" font-size="18" font-family="Arial, sans-serif">Primary effect</text>
  <text x="126" y="288" fill="#5B21B6" font-size="16" font-family="Arial, sans-serif">• reduce model resident size</text>
  <text x="126" y="312" fill="#5B21B6" font-size="16" font-family="Arial, sans-serif">• lower weight bandwidth</text>
  <rect x="126" y="352" width="260" height="142" rx="18" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="152" y="388" fill="#5B21B6" font-size="18" font-family="Arial, sans-serif">Typical sensitivity</text>
  <text x="152" y="420" fill="#5B21B6" font-size="16" font-family="Arial, sans-serif">Error concentrates in important</text>
  <text x="152" y="444" fill="#5B21B6" font-size="16" font-family="Arial, sans-serif">layers / channels / matrices</text>
  <text x="126" y="534" fill="#5B21B6" font-size="16" font-family="Arial, sans-serif">Most common question:</text>
  <text x="126" y="558" fill="#5B21B6" font-size="16" font-family="Arial, sans-serif">Can the model fit on the target card?</text>

  <rect x="480" y="186" width="320" height="384" rx="24" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="508" y="224" fill="#1E3A8A" font-size="24" font-family="Arial, sans-serif" font-weight="700">Activations</text>
  <text x="508" y="260" fill="#1E3A8A" font-size="18" font-family="Arial, sans-serif">Primary effect</text>
  <text x="508" y="288" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">• lower live-path bandwidth</text>
  <text x="508" y="312" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">• change compute precision path</text>
  <rect x="508" y="352" width="260" height="142" rx="18" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="534" y="388" fill="#1E3A8A" font-size="18" font-family="Arial, sans-serif">Typical sensitivity</text>
  <text x="534" y="420" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">Runtime stability, accumulation,</text>
  <text x="534" y="444" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">backend and kernel support</text>
  <text x="508" y="534" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">Most common question:</text>
  <text x="508" y="558" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">Does the stack support low precision end-to-end?</text>

  <rect x="862" y="186" width="320" height="384" rx="24" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="890" y="224" fill="#166534" font-size="24" font-family="Arial, sans-serif" font-weight="700">KV Cache</text>
  <text x="890" y="260" fill="#166534" font-size="18" font-family="Arial, sans-serif">Primary effect</text>
  <text x="890" y="288" fill="#166534" font-size="16" font-family="Arial, sans-serif">• reduce cache storage</text>
  <text x="890" y="312" fill="#166534" font-size="16" font-family="Arial, sans-serif">• expand context / concurrency budget</text>
  <rect x="890" y="352" width="260" height="142" rx="18" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="916" y="388" fill="#166534" font-size="18" font-family="Arial, sans-serif">Typical sensitivity</text>
  <text x="916" y="420" fill="#166534" font-size="16" font-family="Arial, sans-serif">Long-context quality and</text>
  <text x="916" y="444" fill="#166534" font-size="16" font-family="Arial, sans-serif">service-side cache behavior</text>
  <text x="890" y="534" fill="#166534" font-size="16" font-family="Arial, sans-serif">Most common question:</text>
  <text x="890" y="558" fill="#166534" font-size="16" font-family="Arial, sans-serif">Can context length or concurrency fit the budget?</text>

  <rect x="98" y="606" width="1084" height="28" rx="10" fill="#ECFCCB" stroke="#65A30D" stroke-width="1.5"/>
  <text x="126" y="624" fill="#365314" font-size="16" font-family="Arial, sans-serif">Routing rule: first identify the object, then choose the quantization family. Object confusion is the main source of bad method selection.</text>
</svg>

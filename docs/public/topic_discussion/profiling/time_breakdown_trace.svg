<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="100" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">Time Breakdown and Trace Reading</text>
  <text x="88" y="132" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">A step can be slow for very different reasons. Trace reading starts by separating operator cost, launch cost, waits and phase boundaries.</text>

  <rect x="108" y="214" width="1020" height="84" rx="18" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <rect x="138" y="236" width="180" height="40" rx="10" fill="#DBEAFE"/>
  <rect x="330" y="236" width="120" height="40" rx="10" fill="#FDE68A"/>
  <rect x="462" y="236" width="210" height="40" rx="10" fill="#DCFCE7"/>
  <rect x="684" y="236" width="96" height="40" rx="10" fill="#FBCFE8"/>
  <rect x="792" y="236" width="222" height="40" rx="10" fill="#E9D5FF"/>
  <text x="176" y="261" fill="#1E3A8A" font-size="18" font-family="Arial, sans-serif" font-weight="700">embedding</text>
  <text x="356" y="261" fill="#92400E" font-size="18" font-family="Arial, sans-serif" font-weight="700">launch</text>
  <text x="526" y="261" fill="#166534" font-size="18" font-family="Arial, sans-serif" font-weight="700">attention kernel</text>
  <text x="710" y="261" fill="#9D174D" font-size="18" font-family="Arial, sans-serif" font-weight="700">wait</text>
  <text x="848" y="261" fill="#5B21B6" font-size="18" font-family="Arial, sans-serif" font-weight="700">ffn / reduction</text>

  <rect x="108" y="352" width="320" height="208" rx="22" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="136" y="392" fill="#1E3A8A" font-size="22" font-family="Arial, sans-serif" font-weight="700">What to read first</text>
  <text x="136" y="426" fill="#1E3A8A" font-size="17" font-family="Arial, sans-serif">1. Which block dominates step time?</text>
  <text x="136" y="454" fill="#1E3A8A" font-size="17" font-family="Arial, sans-serif">2. Is it real compute or launch / wait?</text>
  <text x="136" y="482" fill="#1E3A8A" font-size="17" font-family="Arial, sans-serif">3. Is the same shape repeated every step?</text>
  <text x="136" y="510" fill="#1E3A8A" font-size="17" font-family="Arial, sans-serif">4. Does the hotspot move with workload?</text>

  <rect x="470" y="352" width="320" height="208" rx="22" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="498" y="392" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">Common misread</text>
  <text x="498" y="426" fill="#92400E" font-size="17" font-family="Arial, sans-serif">A long bar is not always the true bottleneck.</text>
  <text x="498" y="454" fill="#92400E" font-size="17" font-family="Arial, sans-serif">Sometimes the real issue is launch fragmentation,</text>
  <text x="498" y="482" fill="#92400E" font-size="17" font-family="Arial, sans-serif">synchronization, or an input-dependent phase.</text>

  <rect x="832" y="352" width="320" height="208" rx="22" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="860" y="392" fill="#166534" font-size="22" font-family="Arial, sans-serif" font-weight="700">Used by page 02</text>
  <text x="860" y="426" fill="#166534" font-size="17" font-family="Arial, sans-serif">This page turns “slow” into classes:</text>
  <text x="860" y="454" fill="#166534" font-size="17" font-family="Arial, sans-serif">operator-heavy, launch-heavy,</text>
  <text x="860" y="482" fill="#166534" font-size="17" font-family="Arial, sans-serif">wait-heavy, or phase-misaligned.</text>

  <rect x="108" y="602" width="1044" height="24" rx="10" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="132" y="619" fill="#374151" font-size="15" font-family="Arial, sans-serif">Trace reading starts with separation: first isolate time classes, then decide whether the next step belongs to compute, memory or communication analysis.</text>
</svg>

<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="100" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">Profiling Evidence Chain</text>
  <text x="88" y="132" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">Profiling is useful only when a performance suspicion turns into a stable evidence chain and then into an action decision.</text>

  <rect x="92" y="210" width="180" height="96" rx="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="128" y="247" fill="#1E3A8A" font-size="22" font-family="Arial, sans-serif" font-weight="700">Symptom</text>
  <text x="118" y="278" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">slower step, higher TTFT,</text>
  <text x="118" y="300" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">unstable scaling</text>

  <rect x="320" y="210" width="180" height="96" rx="18" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <text x="360" y="247" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">Collect</text>
  <text x="346" y="278" fill="#92400E" font-size="16" font-family="Arial, sans-serif">trace, table, timeline,</text>
  <text x="346" y="300" fill="#92400E" font-size="16" font-family="Arial, sans-serif">benchmark context</text>

  <rect x="548" y="210" width="180" height="96" rx="18" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="590" y="247" fill="#166534" font-size="22" font-family="Arial, sans-serif" font-weight="700">Explain</text>
  <text x="576" y="278" fill="#166534" font-size="16" font-family="Arial, sans-serif">compute, memory,</text>
  <text x="576" y="300" fill="#166534" font-size="16" font-family="Arial, sans-serif">communication, setup</text>

  <rect x="776" y="210" width="180" height="96" rx="18" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <text x="820" y="247" fill="#9D174D" font-size="22" font-family="Arial, sans-serif" font-weight="700">Verify</text>
  <text x="796" y="278" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">before / after, repeat,</text>
  <text x="796" y="300" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">workload match</text>

  <rect x="1004" y="210" width="180" height="96" rx="18" fill="#E9D5FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="1046" y="247" fill="#5B21B6" font-size="22" font-family="Arial, sans-serif" font-weight="700">Act</text>
  <text x="1028" y="278" fill="#5B21B6" font-size="16" font-family="Arial, sans-serif">inspect, optimize,</text>
  <text x="1028" y="300" fill="#5B21B6" font-size="16" font-family="Arial, sans-serif">keep, revert</text>

  <path d="M272 258H320" stroke="#374151" stroke-width="3"/>
  <path d="M500 258H548" stroke="#374151" stroke-width="3"/>
  <path d="M728 258H776" stroke="#374151" stroke-width="3"/>
  <path d="M956 258H1004" stroke="#374151" stroke-width="3"/>
  <path d="M305 250L320 258L305 266" fill="#374151"/>
  <path d="M533 250L548 258L533 266" fill="#374151"/>
  <path d="M761 250L776 258L761 266" fill="#374151"/>
  <path d="M989 250L1004 258L989 266" fill="#374151"/>

  <rect x="96" y="380" width="1088" height="118" rx="22" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="124" y="418" fill="#111827" font-size="22" font-family="Arial, sans-serif" font-weight="700">Why this matters</text>
  <text x="124" y="452" fill="#374151" font-size="18" font-family="Arial, sans-serif">A hotspot alone is not a decision. Profiling becomes useful only when the collected evidence can survive repetition and explain the right bottleneck class.</text>
  <text x="124" y="482" fill="#374151" font-size="18" font-family="Arial, sans-serif">This is the boundary between “interesting chart” and “actionable system diagnosis”.</text>

  <rect x="96" y="538" width="320" height="98" rx="18" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="122" y="572" fill="#92400E" font-size="21" font-family="Arial, sans-serif" font-weight="700">Used by page 01</text>
  <text x="122" y="602" fill="#92400E" font-size="16" font-family="Arial, sans-serif">It explains profiling as a chain,</text>
  <text x="122" y="624" fill="#92400E" font-size="16" font-family="Arial, sans-serif">not as a screenshot collection.</text>

  <rect x="462" y="538" width="336" height="98" rx="18" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="488" y="572" fill="#1E3A8A" font-size="21" font-family="Arial, sans-serif" font-weight="700">Shared vocabulary</text>
  <text x="488" y="602" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">Symptom, evidence, explanation,</text>
  <text x="488" y="624" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">verification and action.</text>

  <rect x="844" y="538" width="340" height="98" rx="18" fill="#DCFCE7" stroke="#22C55E" stroke-width="2"/>
  <text x="870" y="572" fill="#166534" font-size="21" font-family="Arial, sans-serif" font-weight="700">Cross-topic role</text>
  <text x="870" y="602" fill="#166534" font-size="16" font-family="Arial, sans-serif">Memory topic decides budgets.</text>
  <text x="870" y="624" fill="#166534" font-size="16" font-family="Arial, sans-serif">Profiling proves where to look first.</text>
</svg>

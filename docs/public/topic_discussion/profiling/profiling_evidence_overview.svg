<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#486581"/></marker></defs>
<style>.title{font:700 29px sans-serif;fill:#17324d}.sub{font:15px sans-serif;fill:#526581}.label{font:700 18px sans-serif;fill:#17324d}.txt{font:15px sans-serif;fill:#334e68}.small{font:14px sans-serif;fill:#486581}.card{stroke-width:2;rx:18}.flow{stroke:#486581;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.guide{stroke:#9fb3c8;stroke-width:2;fill:none;stroke-dasharray:7 6}</style>
<rect width="1280" height="700" fill="#f7fafc"/>
<text x="640" y="48" text-anchor="middle" class="title">性能分析：把“感觉变慢”变成可复核证据</text>
<text x="640" y="78" text-anchor="middle" class="sub">先固定 workload，再从时间、显存和通信三个观察面收集证据，最后回到对照实验。</text>

<rect x="455" y="115" width="370" height="105" rx="28" fill="#e6f0ff" stroke="#8fb3d8" stroke-width="2"/>
<text x="640" y="157" text-anchor="middle" class="label">性能问题</text><text x="640" y="190" text-anchor="middle" class="txt">哪里慢？什么时候变慢？为什么变慢？</text>

<rect x="75" y="300" width="320" height="155" class="card" fill="#fff4d6" stroke="#e0b34f"/><text x="235" y="340" text-anchor="middle" class="label">时间观察</text><text x="235" y="375" text-anchor="middle" class="txt">step time · TTFT · TPOT</text><text x="235" y="408" text-anchor="middle" class="small">阶段、kernel、launch、等待</text>
<rect x="480" y="300" width="320" height="155" class="card" fill="#e8f5ee" stroke="#76b893"/><text x="640" y="340" text-anchor="middle" class="label">显存观察</text><text x="640" y="375" text-anchor="middle" class="txt">peak · reserved · timeline</text><text x="640" y="408" text-anchor="middle" class="small">驻留、峰值、碎片、OOM</text>
<rect x="885" y="300" width="320" height="155" class="card" fill="#fce8e6" stroke="#d98b87"/><text x="1045" y="340" text-anchor="middle" class="label">通信观察</text><text x="1045" y="375" text-anchor="middle" class="txt">NCCL · overlap · idle</text><text x="1045" y="408" text-anchor="middle" class="small">同步、拓扑、负载不均</text>
<path d="M640 220 V265 H235 V300" class="flow"/><path d="M640 220 V300" class="flow"/><path d="M640 265 H1045 V300" class="flow"/>

<rect x="235" y="535" width="260" height="85" rx="22" fill="#fff" stroke="#829ab1" stroke-width="2"/><text x="365" y="571" text-anchor="middle" class="label">解释瓶颈</text><text x="365" y="598" text-anchor="middle" class="small">计算 · 内存 · 通信 · 调度</text>
<rect x="510" y="535" width="260" height="85" rx="22" fill="#fff" stroke="#829ab1" stroke-width="2"/><text x="640" y="571" text-anchor="middle" class="label">验证结论</text><text x="640" y="598" text-anchor="middle" class="small">baseline · candidate · repeat</text>
<rect x="785" y="535" width="260" height="85" rx="22" fill="#fff" stroke="#829ab1" stroke-width="2"/><text x="915" y="571" text-anchor="middle" class="label">采取行动</text><text x="915" y="598" text-anchor="middle" class="small">inspect · optimize · rollback</text>
<path d="M235 455 V490 H365 V535" class="flow"/><path d="M640 455 V535" class="flow"/><path d="M1045 455 V490 H915 V535" class="flow"/>
<text x="640" y="665" text-anchor="middle" class="small">Profiler 提供证据，不自动产生结论；结论必须回到固定 workload 的可重复对照。</text>
</svg>

<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="100" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">Communication Wait and Overlap Map</text>
  <text x="88" y="132" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">Multi-GPU performance is often lost not because one kernel is slow, but because communication and compute fail to overlap in the right places.</text>

  <rect x="116" y="214" width="470" height="152" rx="22" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="144" y="252" fill="#1E3A8A" font-size="22" font-family="Arial, sans-serif" font-weight="700">Ideal overlap</text>
  <rect x="160" y="286" width="120" height="28" rx="8" fill="#93C5FD"/>
  <rect x="292" y="286" width="120" height="28" rx="8" fill="#86EFAC"/>
  <rect x="424" y="286" width="120" height="28" rx="8" fill="#93C5FD"/>
  <text x="186" y="305" fill="#1E3A8A" font-size="14" font-family="Arial, sans-serif">compute</text>
  <text x="318" y="305" fill="#166534" font-size="14" font-family="Arial, sans-serif">all-reduce</text>
  <text x="450" y="305" fill="#1E3A8A" font-size="14" font-family="Arial, sans-serif">compute</text>
  <text x="160" y="336" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">communication is partially hidden under useful work</text>

  <rect x="694" y="214" width="470" height="152" rx="22" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <text x="722" y="252" fill="#9D174D" font-size="22" font-family="Arial, sans-serif" font-weight="700">Poor overlap</text>
  <rect x="738" y="286" width="120" height="28" rx="8" fill="#93C5FD"/>
  <rect x="870" y="286" width="120" height="28" rx="8" fill="#F9A8D4"/>
  <rect x="1002" y="286" width="120" height="28" rx="8" fill="#86EFAC"/>
  <text x="764" y="305" fill="#1E3A8A" font-size="14" font-family="Arial, sans-serif">compute</text>
  <text x="904" y="305" fill="#9D174D" font-size="14" font-family="Arial, sans-serif">wait</text>
  <text x="1028" y="305" fill="#166534" font-size="14" font-family="Arial, sans-serif">all-reduce</text>
  <text x="738" y="336" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">communication becomes visible stall instead of hidden cost</text>

  <rect x="116" y="412" width="320" height="194" rx="22" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="144" y="450" fill="#111827" font-size="22" font-family="Arial, sans-serif" font-weight="700">What to ask</text>
  <text x="144" y="484" fill="#374151" font-size="17" font-family="Arial, sans-serif">1. Which stream is idle?</text>
  <text x="144" y="512" fill="#374151" font-size="17" font-family="Arial, sans-serif">2. Which collective blocks progress?</text>
  <text x="144" y="540" fill="#374151" font-size="17" font-family="Arial, sans-serif">3. Is the issue bubble, sync or imbalance?</text>
  <text x="144" y="568" fill="#374151" font-size="17" font-family="Arial, sans-serif">4. Does the benchmark expose this repeatedly?</text>

  <rect x="480" y="412" width="320" height="194" rx="22" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="508" y="450" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">Common misread</text>
  <text x="508" y="484" fill="#92400E" font-size="17" font-family="Arial, sans-serif">Low scaling is not always a bad split.</text>
  <text x="508" y="512" fill="#92400E" font-size="17" font-family="Arial, sans-serif">Sometimes the real issue is overlap failure,</text>
  <text x="508" y="540" fill="#92400E" font-size="17" font-family="Arial, sans-serif">extra synchronization, or skewed workload shape.</text>

  <rect x="844" y="412" width="320" height="194" rx="22" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="872" y="450" fill="#166534" font-size="22" font-family="Arial, sans-serif" font-weight="700">Used by page 04</text>
  <text x="872" y="484" fill="#166534" font-size="17" font-family="Arial, sans-serif">This page explains distributed</text>
  <text x="872" y="512" fill="#166534" font-size="17" font-family="Arial, sans-serif">slowdown as evidence of waiting,</text>
  <text x="872" y="540" fill="#166534" font-size="17" font-family="Arial, sans-serif">not just as “multi-GPU is inefficient”.</text>

  <rect x="116" y="628" width="1048" height="22" rx="10" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="140" y="644" fill="#374151" font-size="15" font-family="Arial, sans-serif">Communication profiling is about proving who waited, when overlap failed, and why a distributed benchmark did not convert theoretical parallelism into real throughput.</text>
</svg>

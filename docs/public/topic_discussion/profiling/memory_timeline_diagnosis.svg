<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="100" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">Memory Timeline Diagnosis</text>
  <text x="88" y="132" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">In profiling, a memory timeline is evidence first. The question is not only how much memory is used, but when it spikes and which stage it drags with it.</text>

  <rect x="108" y="208" width="1018" height="120" rx="18" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <path d="M140 288C210 270 250 188 320 200C390 212 430 300 500 290C570 280 620 146 700 160C780 174 820 308 900 302C980 296 1010 226 1094 210" stroke="#2563EB" stroke-width="4" fill="none"/>
  <line x1="140" y1="296" x2="1094" y2="296" stroke="#9CA3AF" stroke-width="2"/>
  <text x="146" y="196" fill="#111827" font-size="20" font-family="Arial, sans-serif" font-weight="700">Example timeline</text>
  <text x="150" y="318" fill="#4B5563" font-size="14" font-family="Arial, sans-serif">start</text>
  <text x="1070" y="318" fill="#4B5563" font-size="14" font-family="Arial, sans-serif">end</text>
  <text x="306" y="186" fill="#1E3A8A" font-size="15" font-family="Arial, sans-serif">temporary rise</text>
  <text x="682" y="148" fill="#1E3A8A" font-size="15" font-family="Arial, sans-serif">residency spike</text>
  <text x="926" y="286" fill="#1E3A8A" font-size="15" font-family="Arial, sans-serif">slow release</text>

  <rect x="108" y="376" width="320" height="206" rx="22" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="136" y="414" fill="#1E3A8A" font-size="22" font-family="Arial, sans-serif" font-weight="700">What to read</text>
  <text x="136" y="448" fill="#1E3A8A" font-size="17" font-family="Arial, sans-serif">1. Which phase triggers the rise?</text>
  <text x="136" y="476" fill="#1E3A8A" font-size="17" font-family="Arial, sans-serif">2. Does the rise align with step slowdown?</text>
  <text x="136" y="504" fill="#1E3A8A" font-size="17" font-family="Arial, sans-serif">3. Is memory released late or never?</text>
  <text x="136" y="532" fill="#1E3A8A" font-size="17" font-family="Arial, sans-serif">4. Is the issue activation, cache or buffer residency?</text>

  <rect x="478" y="376" width="320" height="206" rx="22" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="506" y="414" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">Not the same as budgeting</text>
  <text x="506" y="448" fill="#92400E" font-size="17" font-family="Arial, sans-serif">Memory profiling asks: which timeline event</text>
  <text x="506" y="476" fill="#92400E" font-size="17" font-family="Arial, sans-serif">explains the slowdown or instability?</text>
  <text x="506" y="510" fill="#92400E" font-size="17" font-family="Arial, sans-serif">Memory optimization asks: how do we shrink</text>
  <text x="506" y="538" fill="#92400E" font-size="17" font-family="Arial, sans-serif">peak usage and what trade-off is acceptable?</text>

  <rect x="848" y="376" width="304" height="206" rx="22" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="876" y="414" fill="#166534" font-size="22" font-family="Arial, sans-serif" font-weight="700">Used by page 03</text>
  <text x="876" y="448" fill="#166534" font-size="17" font-family="Arial, sans-serif">This page treats memory as evidence:</text>
  <text x="876" y="476" fill="#166534" font-size="17" font-family="Arial, sans-serif">when did the spike happen,</text>
  <text x="876" y="504" fill="#166534" font-size="17" font-family="Arial, sans-serif">what stayed resident, and</text>
  <text x="876" y="532" fill="#166534" font-size="17" font-family="Arial, sans-serif">did the step get slower at the same time?</text>

  <rect x="108" y="610" width="1044" height="22" rx="10" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="132" y="626" fill="#374151" font-size="15" font-family="Arial, sans-serif">A memory timeline is most useful when it is aligned with phase changes and timing evidence, not when it is read as a peak number alone.</text>
</svg>

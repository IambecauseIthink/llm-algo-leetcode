<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="100" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">Benchmark Validation Board</text>
  <text x="88" y="132" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">An optimization is not established by one better trace. It must survive workload matching, repetition and before/after comparison.</text>

  <rect x="108" y="206" width="198" height="92" rx="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="136" y="244" fill="#1E3A8A" font-size="22" font-family="Arial, sans-serif" font-weight="700">1. Fix workload</text>
  <text x="128" y="274" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">same model, batch, seq,</text>
  <text x="128" y="296" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">request mix, hardware</text>

  <rect x="352" y="206" width="210" height="92" rx="18" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <text x="382" y="244" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">2. Compare before/after</text>
  <text x="380" y="274" fill="#92400E" font-size="16" font-family="Arial, sans-serif">same metric window,</text>
  <text x="380" y="296" fill="#92400E" font-size="16" font-family="Arial, sans-serif">same measurement rule</text>

  <rect x="608" y="206" width="210" height="92" rx="18" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="638" y="244" fill="#166534" font-size="22" font-family="Arial, sans-serif" font-weight="700">3. Repeat</text>
  <text x="634" y="274" fill="#166534" font-size="16" font-family="Arial, sans-serif">variance, warmup,</text>
  <text x="634" y="296" fill="#166534" font-size="16" font-family="Arial, sans-serif">stability range</text>

  <rect x="864" y="206" width="210" height="92" rx="18" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <text x="892" y="244" fill="#9D174D" font-size="22" font-family="Arial, sans-serif" font-weight="700">4. Explain outcome</text>
  <text x="894" y="274" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">did the system improve,</text>
  <text x="894" y="296" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">or just one chart?</text>

  <path d="M306 252H352" stroke="#374151" stroke-width="3"/>
  <path d="M562 252H608" stroke="#374151" stroke-width="3"/>
  <path d="M818 252H864" stroke="#374151" stroke-width="3"/>
  <path d="M337 244L352 252L337 260" fill="#374151"/>
  <path d="M593 244L608 252L593 260" fill="#374151"/>
  <path d="M849 244L864 252L849 260" fill="#374151"/>

  <rect x="118" y="380" width="250" height="176" rx="22" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="150" y="420" fill="#111827" font-size="22" font-family="Arial, sans-serif" font-weight="700">Invalid</text>
  <text x="150" y="456" fill="#374151" font-size="16" font-family="Arial, sans-serif">different workload,</text>
  <text x="150" y="478" fill="#374151" font-size="16" font-family="Arial, sans-serif">single run only,</text>
  <text x="150" y="500" fill="#374151" font-size="16" font-family="Arial, sans-serif">mixed metrics,</text>
  <text x="150" y="522" fill="#374151" font-size="16" font-family="Arial, sans-serif">no system explanation</text>

  <rect x="516" y="380" width="250" height="176" rx="22" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="548" y="420" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">Maybe</text>
  <text x="548" y="456" fill="#92400E" font-size="16" font-family="Arial, sans-serif">numbers improved,</text>
  <text x="548" y="478" fill="#92400E" font-size="16" font-family="Arial, sans-serif">but variance is wide</text>
  <text x="548" y="500" fill="#92400E" font-size="16" font-family="Arial, sans-serif">or explanation is incomplete</text>

  <rect x="914" y="380" width="250" height="176" rx="22" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="946" y="420" fill="#166534" font-size="22" font-family="Arial, sans-serif" font-weight="700">Established</text>
  <text x="946" y="456" fill="#166534" font-size="16" font-family="Arial, sans-serif">same workload,</text>
  <text x="946" y="478" fill="#166534" font-size="16" font-family="Arial, sans-serif">repeatable gain,</text>
  <text x="946" y="500" fill="#166534" font-size="16" font-family="Arial, sans-serif">clear system explanation</text>

  <rect x="108" y="604" width="1058" height="24" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="132" y="621" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">Page 05 uses this board to stop false wins: better charts are not enough unless the benchmark design itself is trustworthy.</text>
</svg>

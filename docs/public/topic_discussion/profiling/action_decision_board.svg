<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="100" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">Diagnosis and Action Decision</text>
  <text x="88" y="132" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">The last profiling step is choosing the next action. Evidence should narrow actions, not just accumulate screenshots.</text>

  <rect x="110" y="206" width="220" height="92" rx="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="148" y="244" fill="#1E3A8A" font-size="22" font-family="Arial, sans-serif" font-weight="700">Classify bottleneck</text>
  <text x="136" y="274" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">compute / memory /</text>
  <text x="136" y="296" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">communication / setup</text>

  <rect x="380" y="206" width="220" height="92" rx="18" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <text x="410" y="244" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">Check confidence</text>
  <text x="408" y="274" fill="#92400E" font-size="16" font-family="Arial, sans-serif">one trace only or repeatable</text>
  <text x="408" y="296" fill="#92400E" font-size="16" font-family="Arial, sans-serif">across a stable workload?</text>

  <rect x="650" y="206" width="220" height="92" rx="18" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="690" y="244" fill="#166534" font-size="22" font-family="Arial, sans-serif" font-weight="700">Choose action</text>
  <text x="678" y="274" fill="#166534" font-size="16" font-family="Arial, sans-serif">observe, inspect deeper,</text>
  <text x="678" y="296" fill="#166534" font-size="16" font-family="Arial, sans-serif">optimize, revert</text>

  <rect x="920" y="206" width="220" height="92" rx="18" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <text x="954" y="244" fill="#9D174D" font-size="22" font-family="Arial, sans-serif" font-weight="700">Write rationale</text>
  <text x="954" y="274" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">which evidence supports</text>
  <text x="954" y="296" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">the chosen next move</text>

  <path d="M330 252H380" stroke="#374151" stroke-width="3"/>
  <path d="M600 252H650" stroke="#374151" stroke-width="3"/>
  <path d="M870 252H920" stroke="#374151" stroke-width="3"/>
  <path d="M365 244L380 252L365 260" fill="#374151"/>
  <path d="M635 244L650 252L635 260" fill="#374151"/>
  <path d="M905 244L920 252L905 260" fill="#374151"/>

  <rect x="98" y="380" width="230" height="180" rx="22" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="126" y="420" fill="#111827" font-size="22" font-family="Arial, sans-serif" font-weight="700">KEEP OBSERVING</text>
  <text x="126" y="454" fill="#374151" font-size="16" font-family="Arial, sans-serif">signal is weak,</text>
  <text x="126" y="476" fill="#374151" font-size="16" font-family="Arial, sans-serif">workload unstable,</text>
  <text x="126" y="498" fill="#374151" font-size="16" font-family="Arial, sans-serif">needs more evidence</text>

  <rect x="372" y="380" width="230" height="180" rx="22" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="400" y="420" fill="#1E3A8A" font-size="22" font-family="Arial, sans-serif" font-weight="700">INSPECT DEEPER</text>
  <text x="400" y="454" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">class is known,</text>
  <text x="400" y="476" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">root cause is not</text>
  <text x="400" y="498" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">yet isolated enough</text>

  <rect x="646" y="380" width="230" height="180" rx="22" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="692" y="420" fill="#166534" font-size="22" font-family="Arial, sans-serif" font-weight="700">OPTIMIZE</text>
  <text x="674" y="454" fill="#166534" font-size="16" font-family="Arial, sans-serif">repeatable evidence,</text>
  <text x="674" y="476" fill="#166534" font-size="16" font-family="Arial, sans-serif">clear bottleneck class,</text>
  <text x="674" y="498" fill="#166534" font-size="16" font-family="Arial, sans-serif">workload is representative</text>

  <rect x="920" y="380" width="230" height="180" rx="22" fill="#FCE7F3" stroke="#DB2777" stroke-width="1.5"/>
  <text x="976" y="420" fill="#9D174D" font-size="22" font-family="Arial, sans-serif" font-weight="700">REVERT</text>
  <text x="948" y="454" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">the change harms the</text>
  <text x="948" y="476" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">system envelope even if</text>
  <text x="948" y="498" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">one local chart improved</text>

  <rect x="108" y="606" width="1042" height="22" rx="10" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="132" y="622" fill="#374151" font-size="15" font-family="Arial, sans-serif">Page 06 turns profiling into operational language: not just “what happened”, but “what should we do next, and why”.</text>
</svg>

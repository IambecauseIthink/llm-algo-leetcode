<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="100" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">DPO Pairwise Objective</text>
  <text x="88" y="132" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">DPO shortens the post-training route by working directly on preference pairs, but the saved system complexity becomes a stronger dependency on pair quality.</text>

  <rect x="112" y="206" width="232" height="132" rx="20" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="146" y="246" fill="#1E3A8A" font-size="22" font-family="Arial, sans-serif" font-weight="700">Prompt</text>
  <text x="146" y="280" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">one instruction enters the</text>
  <text x="146" y="302" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">same comparison context</text>

  <rect x="404" y="174" width="220" height="132" rx="20" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="454" y="214" fill="#166534" font-size="22" font-family="Arial, sans-serif" font-weight="700">Chosen</text>
  <text x="442" y="248" fill="#166534" font-size="16" font-family="Arial, sans-serif">preferred answer</text>
  <text x="442" y="270" fill="#166534" font-size="16" font-family="Arial, sans-serif">should become relatively</text>
  <text x="442" y="292" fill="#166534" font-size="16" font-family="Arial, sans-serif">more likely</text>

  <rect x="404" y="354" width="220" height="132" rx="20" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <text x="448" y="394" fill="#9D174D" font-size="22" font-family="Arial, sans-serif" font-weight="700">Rejected</text>
  <text x="442" y="428" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">less preferred answer</text>
  <text x="442" y="450" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">should become relatively</text>
  <text x="442" y="472" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">less likely</text>

  <rect x="692" y="206" width="208" height="132" rx="20" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <text x="738" y="246" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">Reference</text>
  <text x="724" y="280" fill="#92400E" font-size="16" font-family="Arial, sans-serif">stabilizes comparison</text>
  <text x="724" y="302" fill="#92400E" font-size="16" font-family="Arial, sans-serif">and anchors relative change</text>

  <rect x="968" y="206" width="198" height="132" rx="20" fill="#E9D5FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="1016" y="246" fill="#5B21B6" font-size="22" font-family="Arial, sans-serif" font-weight="700">Update</text>
  <text x="998" y="280" fill="#5B21B6" font-size="16" font-family="Arial, sans-serif">raise chosen relative to</text>
  <text x="998" y="302" fill="#5B21B6" font-size="16" font-family="Arial, sans-serif">rejected under reference</text>

  <path d="M344 264H404" stroke="#374151" stroke-width="3"/>
  <path d="M344 264C372 264 372 240 404 240" stroke="#374151" stroke-width="3" fill="none"/>
  <path d="M344 264C372 264 372 420 404 420" stroke="#374151" stroke-width="3" fill="none"/>
  <path d="M624 240H692" stroke="#374151" stroke-width="3"/>
  <path d="M624 420C692 420 692 272 968 272" stroke="#374151" stroke-width="3" fill="none"/>
  <path d="M900 272H968" stroke="#374151" stroke-width="3"/>
  <path d="M389 232L404 240L389 248" fill="#374151"/>
  <path d="M389 412L404 420L389 428" fill="#374151"/>
  <path d="M677 232L692 240L677 248" fill="#374151"/>
  <path d="M953 264L968 272L953 280" fill="#374151"/>

  <rect x="110" y="548" width="1060" height="88" rx="18" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="138" y="584" fill="#111827" font-size="22" font-family="Arial, sans-serif" font-weight="700">What this picture clarifies</text>
  <text x="138" y="616" fill="#374151" font-size="17" font-family="Arial, sans-serif">DPO removes the long rollout + reward loop, but it shifts the burden onto pair cleanliness, reference choice and evaluation consistency.</text>
</svg>

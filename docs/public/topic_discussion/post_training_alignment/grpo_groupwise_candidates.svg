<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="100" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">GRPO Groupwise Candidates</text>
  <text x="88" y="132" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">GRPO moves from one pair to a candidate group. The gain is richer relative information; the risk is unstable groups and harder evaluation.</text>

  <rect x="108" y="222" width="216" height="96" rx="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="154" y="260" fill="#1E3A8A" font-size="22" font-family="Arial, sans-serif" font-weight="700">Prompt</text>
  <text x="140" y="290" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">one query produces a</text>
  <text x="140" y="312" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">set of candidates</text>

  <rect x="410" y="170" width="170" height="92" rx="18" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="456" y="206" fill="#166534" font-size="22" font-family="Arial, sans-serif" font-weight="700">A</text>
  <text x="438" y="236" fill="#166534" font-size="16" font-family="Arial, sans-serif">candidate one</text>

  <rect x="410" y="278" width="170" height="92" rx="18" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <text x="456" y="314" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">B</text>
  <text x="438" y="344" fill="#92400E" font-size="16" font-family="Arial, sans-serif">candidate two</text>

  <rect x="410" y="386" width="170" height="92" rx="18" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <text x="456" y="422" fill="#9D174D" font-size="22" font-family="Arial, sans-serif" font-weight="700">C</text>
  <text x="438" y="452" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">candidate three</text>

  <rect x="664" y="222" width="224" height="96" rx="18" fill="#E9D5FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="702" y="260" fill="#5B21B6" font-size="22" font-family="Arial, sans-serif" font-weight="700">Relative Comparison</text>
  <text x="688" y="290" fill="#5B21B6" font-size="16" font-family="Arial, sans-serif">who is better inside the group,</text>
  <text x="688" y="312" fill="#5B21B6" font-size="16" font-family="Arial, sans-serif">not just one binary label</text>

  <rect x="968" y="222" width="198" height="96" rx="18" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="1002" y="260" fill="#111827" font-size="22" font-family="Arial, sans-serif" font-weight="700">Group Update</text>
  <text x="994" y="290" fill="#374151" font-size="16" font-family="Arial, sans-serif">learn ranking direction</text>
  <text x="994" y="312" fill="#374151" font-size="16" font-family="Arial, sans-serif">from the full set</text>

  <path d="M324 270H410" stroke="#374151" stroke-width="3"/>
  <path d="M324 270C370 270 370 216 410 216" stroke="#374151" stroke-width="3" fill="none"/>
  <path d="M324 270C370 270 370 324 410 324" stroke="#374151" stroke-width="3" fill="none"/>
  <path d="M324 270C370 270 370 432 410 432" stroke="#374151" stroke-width="3" fill="none"/>
  <path d="M580 216C640 216 640 270 664 270" stroke="#374151" stroke-width="3" fill="none"/>
  <path d="M580 324C640 324 640 270 664 270" stroke="#374151" stroke-width="3" fill="none"/>
  <path d="M580 432C640 432 640 270 664 270" stroke="#374151" stroke-width="3" fill="none"/>
  <path d="M888 270H968" stroke="#374151" stroke-width="3"/>

  <rect x="104" y="544" width="1068" height="92" rx="18" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="132" y="580" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">What this picture clarifies</text>
  <text x="132" y="612" fill="#92400E" font-size="17" font-family="Arial, sans-serif">GRPO becomes useful when quality is better described by relative ranking across candidates, not by one clean chosen/rejected pair. The main risk moves to candidate quality and group evaluation.</text>
</svg>

<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="100" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">RLHF / PPO System Loop</text>
  <text x="88" y="132" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">PPO is “heavy” because it is not one objective only. It creates a longer loop with more resident objects and more update-time coordination.</text>

  <rect x="102" y="198" width="188" height="96" rx="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="150" y="235" fill="#1E3A8A" font-size="22" font-family="Arial, sans-serif" font-weight="700">Policy</text>
  <text x="126" y="266" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">current model used to</text>
  <text x="126" y="288" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">generate rollouts</text>

  <rect x="346" y="198" width="188" height="96" rx="18" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <text x="392" y="235" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">Reference</text>
  <text x="368" y="266" fill="#92400E" font-size="16" font-family="Arial, sans-serif">keeps policy drift</text>
  <text x="368" y="288" fill="#92400E" font-size="16" font-family="Arial, sans-serif">under control</text>

  <rect x="590" y="198" width="188" height="96" rx="18" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <text x="636" y="235" fill="#9D174D" font-size="22" font-family="Arial, sans-serif" font-weight="700">Reward</text>
  <text x="616" y="266" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">scores generated</text>
  <text x="616" y="288" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">answers</text>

  <rect x="834" y="198" width="188" height="96" rx="18" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="878" y="235" fill="#166534" font-size="22" font-family="Arial, sans-serif" font-weight="700">Rollout</text>
  <text x="858" y="266" fill="#166534" font-size="16" font-family="Arial, sans-serif">sample, score, keep</text>
  <text x="858" y="288" fill="#166534" font-size="16" font-family="Arial, sans-serif">trajectory state</text>

  <rect x="1078" y="198" width="102" height="96" rx="18" fill="#E9D5FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="1097" y="235" fill="#5B21B6" font-size="22" font-family="Arial, sans-serif" font-weight="700">PPO</text>
  <text x="1094" y="266" fill="#5B21B6" font-size="16" font-family="Arial, sans-serif">update</text>
  <text x="1090" y="288" fill="#5B21B6" font-size="16" font-family="Arial, sans-serif">step</text>

  <path d="M290 246H346" stroke="#374151" stroke-width="3"/>
  <path d="M534 246H590" stroke="#374151" stroke-width="3"/>
  <path d="M778 246H834" stroke="#374151" stroke-width="3"/>
  <path d="M1022 246H1078" stroke="#374151" stroke-width="3"/>
  <path d="M331 238L346 246L331 254" fill="#374151"/>
  <path d="M575 238L590 246L575 254" fill="#374151"/>
  <path d="M819 238L834 246L819 254" fill="#374151"/>
  <path d="M1063 238L1078 246L1063 254" fill="#374151"/>

  <path d="M1129 294V350H196V294" stroke="#374151" stroke-width="3"/>
  <path d="M204 309L196 294L188 309" fill="#374151"/>
  <text x="556" y="344" fill="#374151" font-size="17" font-family="Arial, sans-serif">new policy becomes the next rollout source</text>

  <rect x="104" y="392" width="504" height="188" rx="22" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="132" y="432" fill="#111827" font-size="22" font-family="Arial, sans-serif" font-weight="700">Why it is system-heavy</text>
  <text x="132" y="468" fill="#374151" font-size="17" font-family="Arial, sans-serif">1. More resident objects than SFT: policy + reference + reward + rollout state</text>
  <text x="132" y="496" fill="#374151" font-size="17" font-family="Arial, sans-serif">2. More phases than one forward/backward pass: generate, score, update</text>
  <text x="132" y="524" fill="#374151" font-size="17" font-family="Arial, sans-serif">3. More fragile throughput: rollout quality, sampling variance and multi-model coordination</text>
  <text x="132" y="552" fill="#374151" font-size="17" font-family="Arial, sans-serif">4. More expensive memory story: extra activations, buffers and synchronization cost</text>

  <rect x="656" y="392" width="524" height="188" rx="22" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="684" y="432" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">How page 02 uses this picture</text>
  <text x="684" y="468" fill="#92400E" font-size="17" font-family="Arial, sans-serif">It distinguishes “complete but heavy” from lighter routes such as DPO.</text>
  <text x="684" y="496" fill="#92400E" font-size="17" font-family="Arial, sans-serif">The point is not to memorize PPO internals only, but to see where the extra budget comes from.</text>
  <text x="684" y="538" fill="#92400E" font-size="17" font-family="Arial, sans-serif">If the main question becomes memory, transport or rollout cost, jump to memory and communication topics.</text>
</svg>

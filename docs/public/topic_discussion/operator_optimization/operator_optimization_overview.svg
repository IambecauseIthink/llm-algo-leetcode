<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#486581"/></marker><style>.title{font:700 29px sans-serif;fill:#17324d}.label{font:700 20px sans-serif;fill:#17324d}.text{font:16px sans-serif;fill:#334e68}.small{font:14px sans-serif;fill:#486581}.box{stroke:#829ab1;stroke-width:2;rx:14}.line{stroke:#486581;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="560" fill="#f7fafc"/><text x="600" y="48" text-anchor="middle" class="title">算子优化：从数学语义到端到端收益</text>
  <rect x="50" y="130" width="235" height="230" fill="#e6f6f5" class="box"/><text x="167" y="175" text-anchor="middle" class="label">算子语义</text><text x="90" y="230" class="text">输入 / 输出</text><text x="90" y="270" class="text">shape / dtype</text><text x="90" y="310" class="text">数值正确性</text>
  <path d="M285 245 H390" class="line"/><rect x="390" y="130" width="235" height="230" fill="#fff4e6" class="box"/><text x="507" y="175" text-anchor="middle" class="label">Kernel 实现</text><text x="430" y="230" class="text">tile / block</text><text x="430" y="270" class="text">load / store</text><text x="430" y="310" class="text">fusion</text>
  <path d="M625 245 H730" class="line"/><rect x="730" y="130" width="235" height="230" fill="#eef2ff" class="box"/><text x="847" y="175" text-anchor="middle" class="label">硬件代价</text><text x="770" y="230" class="text">访存 / 带宽</text><text x="770" y="270" class="text">occupancy</text><text x="770" y="310" class="text">Tensor Core / stream</text>
  <path d="M965 245 H1070" class="line"/><rect x="1070" y="130" width="90" height="230" fill="#f0f4f8" class="box"/><text x="1115" y="175" text-anchor="middle" class="label">证据</text><text x="1088" y="235" class="small">kernel</text><text x="1088" y="275" class="small">trace</text><text x="1088" y="315" class="small">E2E</text>
  <text x="600" y="425" text-anchor="middle" class="small">正确性是入口，kernel 指标是中间证据，端到端 workload 才是最终收益。</text><text x="600" y="465" text-anchor="middle" class="small">编译与图优化负责图变换；本路线聚焦具体算子、kernel 和执行代价。</text>
</svg>

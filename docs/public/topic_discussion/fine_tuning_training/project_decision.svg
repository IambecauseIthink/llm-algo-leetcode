<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Project decision diagram</title>
  <desc id="desc">A project decision diagram that summarizes report artifacts and adoption choice.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y1="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <style>
      .box{fill:#fff;stroke:#334155;stroke-width:3;rx:18;ry:18}
      .h{font:700 28px Arial, sans-serif;fill:#0f172a}
      .t{font:500 20px Arial, sans-serif;fill:#1e293b}
      .s{font:500 18px Arial, sans-serif;fill:#475569}
      .arrow{stroke:#475569;stroke-width:5;fill:none;marker-end:url(#m)}
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="60" y="64" class="h">Project Decision</text>
  <text x="60" y="104" class="s">adapter / tokenizer / config / report -> adopt or revise</text>

  <rect x="70" y="185" width="230" height="120" class="box"/>
  <text x="185" y="232" text-anchor="middle" class="t">Artifacts</text>
  <text x="185" y="266" text-anchor="middle" class="s">adapter, tokenizer, config</text>

  <rect x="335" y="185" width="230" height="120" class="box"/>
  <text x="450" y="232" text-anchor="middle" class="t">Metrics</text>
  <text x="450" y="266" text-anchor="middle" class="s">train / val, speed, memory</text>

  <rect x="600" y="185" width="230" height="120" class="box"/>
  <text x="715" y="232" text-anchor="middle" class="t">Samples</text>
  <text x="715" y="266" text-anchor="middle" class="s">qualitative generations</text>

  <rect x="865" y="185" width="265" height="120" class="box"/>
  <text x="998" y="232" text-anchor="middle" class="t">Decision</text>
  <text x="998" y="266" text-anchor="middle" class="s">adopt / revise / discard</text>

  <path d="M300 245 L335 245" class="arrow"/>
  <path d="M565 245 L600 245" class="arrow"/>
  <path d="M830 245 L865 245" class="arrow"/>

  <rect x="120" y="405" width="960" height="160" class="box"/>
  <text x="600" y="452" text-anchor="middle" class="t">Rule of thumb</text>
  <text x="600" y="488" text-anchor="middle" class="s">If the artifact set is incomplete, the metrics are not enough; if metrics are weak, the samples are not enough.</text>
  <text x="600" y="522" text-anchor="middle" class="s">The project page is the place where the experiment becomes a decision.</text>
</svg>

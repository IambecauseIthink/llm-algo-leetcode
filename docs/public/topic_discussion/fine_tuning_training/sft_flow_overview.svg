<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">SFT flow overview</title>
  <desc id="desc">A simple flow from data trio to LoRA, training control, evaluation, and project decision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <style>
      .box{fill:#ffffff;stroke:#334155;stroke-width:3;rx:22;ry:22}
      .title{font:700 28px Arial, sans-serif;fill:#0f172a}
      .txt{font:500 22px Arial, sans-serif;fill:#1e293b}
      .small{font:500 18px Arial, sans-serif;fill:#334155}
      .arrow{stroke:#475569;stroke-width:5;fill:none;marker-end:url(#m)}
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="60" y="64" class="title">SFT Closed Loop</text>
  <text x="60" y="104" class="small">Data trio -> LoRA -> training control -> eval -> project decision</text>

  <rect x="70" y="190" width="200" height="110" class="box"/>
  <text x="170" y="235" text-anchor="middle" class="txt">Data Trio</text>
  <text x="170" y="268" text-anchor="middle" class="small">input_ids / mask / labels</text>

  <rect x="330" y="190" width="200" height="110" class="box"/>
  <text x="430" y="235" text-anchor="middle" class="txt">LoRA</text>
  <text x="430" y="268" text-anchor="middle" class="small">target modules / rank</text>

  <rect x="590" y="190" width="220" height="110" class="box"/>
  <text x="700" y="235" text-anchor="middle" class="txt">Training Control</text>
  <text x="700" y="268" text-anchor="middle" class="small">scheduler / accumulation</text>

  <rect x="860" y="190" width="220" height="110" class="box"/>
  <text x="970" y="235" text-anchor="middle" class="txt">Eval</text>
  <text x="970" y="268" text-anchor="middle" class="small">train / val / samples</text>

  <rect x="430" y="410" width="340" height="120" class="box"/>
  <text x="600" y="456" text-anchor="middle" class="txt">Project Decision</text>
  <text x="600" y="490" text-anchor="middle" class="small">adapter / tokenizer / config / report</text>

  <path d="M270 245 L330 245" class="arrow"/>
  <path d="M530 245 L590 245" class="arrow"/>
  <path d="M810 245 L860 245" class="arrow"/>
  <path d="M970 300 C970 380 840 390 760 430" class="arrow"/>
  <path d="M430 300 C430 360 500 380 540 410" class="arrow"/>
  <path d="M700 300 C700 360 660 380 620 410" class="arrow"/>
</svg>

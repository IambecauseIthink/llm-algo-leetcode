<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Data alignment diagram</title>
  <desc id="desc">A simple diagram for prompt, response, mask, labels, and response-only loss.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <style>
      .box{fill:#fff;stroke:#334155;stroke-width:3;rx:18;ry:18}
      .h{font:700 28px Arial, sans-serif;fill:#0f172a}
      .t{font:500 20px Arial, sans-serif;fill:#1e293b}
      .s{font:500 18px Arial, sans-serif;fill:#475569}
      .arrow{stroke:#475569;stroke-width:5;fill:none;marker-end:url(#m)}
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="60" y="64" class="h">SFT Data Alignment</text>
  <text x="60" y="104" class="s">prompt / response / mask / labels -> response-only loss</text>

  <rect x="70" y="190" width="210" height="110" class="box"/>
  <text x="175" y="234" text-anchor="middle" class="t">Prompt</text>
  <text x="175" y="266" text-anchor="middle" class="s">masked out</text>

  <rect x="315" y="190" width="210" height="110" class="box"/>
  <text x="420" y="234" text-anchor="middle" class="t">Response</text>
  <text x="420" y="266" text-anchor="middle" class="s">supervised</text>

  <rect x="560" y="190" width="210" height="110" class="box"/>
  <text x="665" y="234" text-anchor="middle" class="t">Labels</text>
  <text x="665" y="266" text-anchor="middle" class="s">shifted targets</text>

  <rect x="805" y="190" width="250" height="110" class="box"/>
  <text x="930" y="234" text-anchor="middle" class="t">Loss</text>
  <text x="930" y="266" text-anchor="middle" class="s">response-only CE</text>

  <path d="M280 245 L315 245" class="arrow"/>
  <path d="M525 245 L560 245" class="arrow"/>
  <path d="M770 245 L805 245" class="arrow"/>

  <rect x="150" y="410" width="900" height="150" class="box"/>
  <text x="600" y="455" text-anchor="middle" class="t">Rule</text>
  <text x="600" y="492" text-anchor="middle" class="s">prompt -> mask out, response -> supervise, padding -> ignore, logits[t] -> label[t+1]</text>
  <text x="600" y="526" text-anchor="middle" class="s">The entire point is to make the supervision boundary explicit and stable.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">LoRA and training control diagram</title>
  <desc id="desc">A diagram showing LoRA adapter plus scheduler and accumulation control.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <style>
      .box{fill:#ffffff;stroke:#92400e;stroke-width:3;rx:18;ry:18}
      .h{font:700 28px Arial, sans-serif;fill:#451a03}
      .t{font:500 20px Arial, sans-serif;fill:#78350f}
      .s{font:500 18px Arial, sans-serif;fill:#92400e}
      .arrow{stroke:#92400e;stroke-width:5;fill:none;marker-end:url(#m)}
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#92400e"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="60" y="64" class="h">LoRA + Training Control</text>
  <text x="60" y="104" class="s">adapter placement -> scheduler -> accumulation -> optimizer step</text>

  <rect x="70" y="190" width="240" height="120" class="box"/>
  <text x="190" y="236" text-anchor="middle" class="t">LoRA Adapter</text>
  <text x="190" y="270" text-anchor="middle" class="s">target modules / rank</text>

  <rect x="355" y="190" width="220" height="120" class="box"/>
  <text x="465" y="236" text-anchor="middle" class="t">Scheduler</text>
  <text x="465" y="270" text-anchor="middle" class="s">step count / warmup</text>

  <rect x="630" y="190" width="240" height="120" class="box"/>
  <text x="750" y="236" text-anchor="middle" class="t">Gradient Accumulation</text>
  <text x="750" y="270" text-anchor="middle" class="s">micro-batch / effective batch</text>

  <rect x="925" y="190" width="205" height="120" class="box"/>
  <text x="1027" y="236" text-anchor="middle" class="t">Optimizer Step</text>
  <text x="1027" y="270" text-anchor="middle" class="s">update cadence</text>

  <path d="M310 250 L355 250" class="arrow"/>
  <path d="M575 250 L630 250" class="arrow"/>
  <path d="M870 250 L925 250" class="arrow"/>

  <rect x="150" y="410" width="900" height="150" class="box"/>
  <text x="600" y="455" text-anchor="middle" class="t">Checklist</text>
  <text x="600" y="492" text-anchor="middle" class="s">target modules -> trainable ratio -> update count -> evaluation cadence -> report</text>
  <text x="600" y="526" text-anchor="middle" class="s">If these five parts disagree, the experiment will look runnable but not trustworthy.</text>
</svg>

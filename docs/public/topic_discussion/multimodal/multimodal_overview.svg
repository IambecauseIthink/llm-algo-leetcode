<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#486581"/></marker>
    <style>
      .title{font:700 28px sans-serif;fill:#17324d}.group{font:700 18px sans-serif;fill:#17324d}.node{font:700 17px sans-serif;fill:#17324d}.text{font:15px sans-serif;fill:#334e68}.small{font:14px sans-serif;fill:#486581}.box{stroke:#829ab1;stroke-width:2;rx:14}.line{stroke:#486581;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#829ab1;stroke-width:2;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#f7fafc"/>
  <text x="600" y="42" text-anchor="middle" class="title">多模态学习路线：从输入对齐到可复核系统</text>

  <rect x="35" y="82" width="250" height="250" fill="#e6f6f5" class="box"/>
  <text x="160" y="116" text-anchor="middle" class="group">输入与表示</text>
  <rect x="65" y="145" width="190" height="62" fill="#ffffff" class="box"/><text x="160" y="171" text-anchor="middle" class="node">图像 / 文本 / 音频</text><text x="160" y="193" text-anchor="middle" class="small">原始输入与任务要求</text>
  <path d="M160 207 V235" class="line"/>
  <rect x="65" y="235" width="190" height="62" fill="#ffffff" class="box"/><text x="160" y="261" text-anchor="middle" class="node">模态编码</text><text x="160" y="283" text-anchor="middle" class="small">token、embedding、位置</text>

  <rect x="315" y="82" width="250" height="250" fill="#fff4e6" class="box"/>
  <text x="440" y="116" text-anchor="middle" class="group">对齐与融合</text>
  <rect x="345" y="145" width="190" height="62" fill="#ffffff" class="box"/><text x="440" y="171" text-anchor="middle" class="node">Projector</text><text x="440" y="193" text-anchor="middle" class="small">维度与表示空间对齐</text>
  <path d="M440 207 V235" class="line"/>
  <rect x="345" y="235" width="190" height="62" fill="#ffffff" class="box"/><text x="440" y="261" text-anchor="middle" class="node">Fusion / Attention</text><text x="440" y="283" text-anchor="middle" class="small">跨模态信息交互</text>

  <rect x="595" y="82" width="250" height="250" fill="#eef2ff" class="box"/>
  <text x="720" y="116" text-anchor="middle" class="group">推理执行</text>
  <rect x="625" y="145" width="190" height="62" fill="#ffffff" class="box"/><text x="720" y="171" text-anchor="middle" class="node">请求生成</text><text x="720" y="193" text-anchor="middle" class="small">Prefill、Decode、输出</text>
  <path d="M720 207 V235" class="line"/>
  <rect x="625" y="235" width="190" height="62" fill="#ffffff" class="box"/><text x="720" y="261" text-anchor="middle" class="node">多模态推理</text><text x="720" y="283" text-anchor="middle" class="small">token、cache、请求成本</text>

  <rect x="875" y="82" width="290" height="250" fill="#f0f4f8" class="box"/>
  <text x="1020" y="116" text-anchor="middle" class="group">评测与系统决策</text>
  <rect x="905" y="145" width="230" height="62" fill="#ffffff" class="box"/><text x="1020" y="171" text-anchor="middle" class="node">任务质量</text><text x="1020" y="193" text-anchor="middle" class="small">OCR、定位、图表、问答</text>
  <path d="M1020 207 V235" class="line"/>
  <rect x="905" y="235" width="230" height="62" fill="#ffffff" class="box"/><text x="1020" y="261" text-anchor="middle" class="node">成本与证据</text><text x="1020" y="283" text-anchor="middle" class="small">质量、延迟、显存、失败样例</text>

  <path d="M285 207 H315" class="line"/><path d="M565 207 H595" class="line"/><path d="M845 207 H875" class="line"/>
  <path d="M1020 332 V385 H160 V332" class="dash"/>
  <text x="600" y="382" text-anchor="middle" class="small">评测结果反向约束输入分辨率、融合方式和部署配置</text>

  <rect x="45" y="435" width="1110" height="190" fill="#ffffff" class="box"/>
  <text x="600" y="468" text-anchor="middle" class="group">Task0–6 的推进问题</text>
  <text x="95" y="510" class="text">Task0 模态如何进入推理请求？</text><text x="95" y="548" class="text">Task1 视觉 token 如何改变长度和显存？</text><text x="95" y="586" class="text">Task2 如何对齐并融合？</text>
  <text x="620" y="510" class="text">Task3 视觉信息如何进入生成？</text><text x="620" y="548" class="text">Task4 如何控制请求成本？</text><text x="620" y="586" class="text">Task5–6 如何部署、评测和决策？</text>
  <text x="600" y="672" text-anchor="middle" class="small">训练、数据工程和对齐是共享前置；多模态主线聚焦请求执行、成本控制和质量证据。</text>
</svg>

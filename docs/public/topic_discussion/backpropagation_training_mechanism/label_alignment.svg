<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 800" role="img" aria-labelledby="title desc">
  <title id="title">Loss backward label alignment</title>
  <desc id="desc">Shows prompt, response, EOS, padding, attention mask, labels, and shifted next-token supervision alignment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
    <style>
      .title { font: 700 30px "Inter", "Noto Sans SC", sans-serif; fill: #0f172a; }
      .sub { font: 500 16px "Inter", "Noto Sans SC", sans-serif; fill: #475569; }
      .label { font: 700 18px "Inter", "Noto Sans SC", sans-serif; fill: #111827; }
      .small { font: 500 14px "Inter", "Noto Sans SC", sans-serif; fill: #334155; }
      .box { fill: #ffffff; stroke-width: 3; rx: 16; ry: 16; }
      .p { fill: #fff7ed; stroke: #f59e0b; stroke-width: 2.5; rx: 10; ry: 10; }
      .r { fill: #ecfccb; stroke: #65a30d; stroke-width: 2.5; rx: 10; ry: 10; }
      .e { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 2.5; rx: 10; ry: 10; }
      .pad { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 2.5; rx: 10; ry: 10; }
    </style>
  </defs>
  <rect width="1660" height="800" fill="url(#bg)"/>
  <text x="64" y="66" class="title">Loss backward: prompt / response / EOS / padding must be aligned</text>
  <text x="64" y="96" class="sub">Prompt is context, response is supervision, EOS teaches stopping, padding is ignored, and logits are shifted by one token.</text>

  <text x="70" y="160" class="label">Token positions</text>
  <g>
    <rect x="230" y="120" width="140" height="70" class="p"/>
    <rect x="380" y="120" width="140" height="70" class="p"/>
    <rect x="530" y="120" width="140" height="70" class="p"/>
    <rect x="680" y="120" width="140" height="70" class="r"/>
    <rect x="830" y="120" width="140" height="70" class="r"/>
    <rect x="980" y="120" width="140" height="70" class="r"/>
    <rect x="1130" y="120" width="140" height="70" class="r"/>
    <rect x="1280" y="120" width="120" height="70" class="e"/>
    <rect x="1410" y="120" width="90" height="70" class="pad"/>
    <text x="300" y="152" text-anchor="middle" class="label">prompt</text>
    <text x="450" y="152" text-anchor="middle" class="label">prompt</text>
    <text x="600" y="152" text-anchor="middle" class="label">prompt</text>
    <text x="750" y="152" text-anchor="middle" class="label">response</text>
    <text x="900" y="152" text-anchor="middle" class="label">response</text>
    <text x="1050" y="152" text-anchor="middle" class="label">response</text>
    <text x="1200" y="152" text-anchor="middle" class="label">response</text>
    <text x="1340" y="152" text-anchor="middle" class="label">EOS</text>
    <text x="1455" y="152" text-anchor="middle" class="label">pad</text>
  </g>

  <rect x="90" y="230" width="1470" height="120" class="box" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="120" y="268" class="label">input_ids / attention_mask / labels</text>
  <text x="120" y="300" class="small">input_ids carries the full sequence; attention_mask marks real tokens; labels mask prompt and padding with -100.</text>
  <text x="120" y="328" class="small">shifted logits[t] are compared with labels[t+1] for next-token supervision.</text>

  <rect x="90" y="390" width="1470" height="150" class="box" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="120" y="428" class="label">Supervision rule</text>
  <text x="120" y="462" class="small">prompt -> context only</text>
  <text x="420" y="462" class="small">response -> supervised target</text>
  <text x="760" y="462" class="small">EOS -> teach stopping</text>
  <text x="1060" y="462" class="small">padding -> ignore</text>
  <text x="120" y="500" class="small">If any one of these roles is mixed up, the loss is technically computable but semantically wrong.</text>

  <rect x="90" y="580" width="1470" height="150" class="box" fill="#fffef2" stroke="#cbd5e1"/>
  <text x="120" y="618" class="label">What this page should teach</text>
  <text x="120" y="652" class="small">The core failure mode in SFT is not bad math, but bad alignment: the model is trained on the wrong span of tokens.</text>
  <text x="120" y="682" class="small">Once alignment is clear, loss/backward/debugging becomes much easier.</text>
</svg>

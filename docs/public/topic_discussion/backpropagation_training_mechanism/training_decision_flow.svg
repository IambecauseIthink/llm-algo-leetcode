<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 820" role="img" aria-labelledby="title desc">
  <title id="title">Training loop memory decision flow</title>
  <desc id="desc">Shows how data, forward, loss, backward, optimizer step, evaluation, and profiling connect to memory decisions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fff1f2"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 30px "Inter", "Noto Sans SC", sans-serif; fill: #0f172a; }
      .sub { font: 500 16px "Inter", "Noto Sans SC", sans-serif; fill: #475569; }
      .label { font: 700 18px "Inter", "Noto Sans SC", sans-serif; fill: #111827; }
      .small { font: 500 14px "Inter", "Noto Sans SC", sans-serif; fill: #334155; }
      .box { fill: #ffffff; stroke-width: 3; rx: 16; ry: 16; }
      .arrow { stroke: #475569; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #db2777; stroke-width: 4; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1660" height="820" fill="url(#bg)"/>
  <text x="64" y="66" class="title">Training loop and memory decisions</text>
  <text x="64" y="96" class="sub">The question is not just how to train, but what to do when gradient, activation, schedule, or bandwidth becomes the bottleneck.</text>

  <rect x="80" y="150" width="1470" height="120" class="box" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="120" y="186" class="label">Training loop nodes</text>
  <text x="120" y="220" class="small">data -> forward -> loss -> backward -> optimizer step -> evaluation -> profiling</text>
  <text x="120" y="246" class="small">the diagram should make it clear where memory decisions enter the loop</text>

  <rect x="100" y="330" width="180" height="80" class="box" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="190" y="364" text-anchor="middle" class="label">Data</text>
  <text x="190" y="390" text-anchor="middle" class="small">batch / mask</text>
  <rect x="330" y="330" width="180" height="80" class="box" fill="#ecfccb" stroke="#65a30d"/>
  <text x="420" y="364" text-anchor="middle" class="label">Forward</text>
  <rect x="560" y="330" width="180" height="80" class="box" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="650" y="364" text-anchor="middle" class="label">Loss</text>
  <rect x="790" y="330" width="180" height="80" class="box" fill="#ecfeff" stroke="#0891b2"/>
  <text x="880" y="364" text-anchor="middle" class="label">Backward</text>
  <rect x="1020" y="330" width="180" height="80" class="box" fill="#fff1f2" stroke="#db2777"/>
  <text x="1110" y="364" text-anchor="middle" class="label">Step</text>
  <rect x="1250" y="330" width="180" height="80" class="box" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="1340" y="364" text-anchor="middle" class="label">Eval</text>
  <rect x="1480" y="330" width="180" height="80" class="box" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="1570" y="364" text-anchor="middle" class="label">Profile</text>

  <path d="M 280 370 L 330 370" class="arrow"/>
  <path d="M 510 370 L 560 370" class="arrow"/>
  <path d="M 740 370 L 790 370" class="arrow"/>
  <path d="M 970 370 L 1020 370" class="arrow"/>
  <path d="M 1200 370 L 1250 370" class="arrow"/>
  <path d="M 1430 370 L 1480 370" class="arrow"/>

  <rect x="90" y="470" width="1470" height="140" class="box" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="120" y="508" class="label">Decision path</text>
  <text x="120" y="542" class="small">If the bottleneck is gradient accumulation, use micro-batch scheduling.</text>
  <text x="120" y="572" class="small">If the bottleneck is activation memory, consider checkpointing or offload.</text>
  <text x="820" y="542" class="small">If the bottleneck is still unclear, profile first and do not guess.</text>
  <text x="820" y="572" class="small">The decision is a loop, not a one-shot choice.</text>

  <rect x="90" y="640" width="1470" height="120" class="box" fill="#fffef2" stroke="#cbd5e1"/>
  <text x="120" y="678" class="label">What this page should teach</text>
  <text x="420" y="678" class="small">A training system is a chain of decisions, and memory optimization should be chosen by the bottleneck that actually appears.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Checkpointing tradeoff</title>
  <desc id="desc">Shows forward blocks with checkpoints kept, while intermediate activations are dropped and recomputed during backward.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 30px "Inter", "Noto Sans SC", sans-serif; fill: #0f172a; }
      .sub { font: 500 16px "Inter", "Noto Sans SC", sans-serif; fill: #475569; }
      .label { font: 700 18px "Inter", "Noto Sans SC", sans-serif; fill: #111827; }
      .small { font: 500 14px "Inter", "Noto Sans SC", sans-serif; fill: #334155; }
      .box { fill: #ffffff; stroke-width: 3; rx: 16; ry: 16; }
      .keep { fill: #eff6ff; stroke: #3b82f6; }
      .drop { fill: #fee2e2; stroke: #ef4444; }
      .arrow { stroke: #475569; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .recompute { stroke: #8b5cf6; stroke-width: 4; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="760" fill="url(#bg)"/>
  <text x="64" y="66" class="title">Checkpointing: keep checkpoints, drop intermediates, recompute later</text>
  <text x="64" y="96" class="sub">The point is to reduce activation memory, not to reduce parameters or optimizer state.</text>

  <rect x="90" y="170" width="1440" height="120" class="box" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="120" y="206" class="label">Forward pass</text>
  <text x="120" y="240" class="small">Block 1 -> Block 2 -> Block 3 -> Block 4</text>
  <text x="120" y="266" class="small">save only selected checkpoints, drop intermediate activations</text>

  <rect x="130" y="350" width="220" height="90" class="box keep"/>
  <text x="240" y="385" text-anchor="middle" class="label">Checkpoint A</text>
  <text x="240" y="412" text-anchor="middle" class="small">keep</text>
  <rect x="390" y="350" width="220" height="90" class="box drop"/>
  <text x="500" y="385" text-anchor="middle" class="label">Middle activations</text>
  <text x="500" y="412" text-anchor="middle" class="small">drop</text>
  <rect x="650" y="350" width="220" height="90" class="box keep"/>
  <text x="760" y="385" text-anchor="middle" class="label">Checkpoint B</text>
  <text x="760" y="412" text-anchor="middle" class="small">keep</text>
  <rect x="910" y="350" width="220" height="90" class="box drop"/>
  <text x="1020" y="385" text-anchor="middle" class="label">Middle activations</text>
  <text x="1020" y="412" text-anchor="middle" class="small">drop</text>
  <rect x="1170" y="350" width="220" height="90" class="box keep"/>
  <text x="1280" y="385" text-anchor="middle" class="label">Checkpoint C</text>
  <text x="1280" y="412" text-anchor="middle" class="small">keep</text>

  <path d="M 350 395 L 390 395" class="arrow"/>
  <path d="M 610 395 L 650 395" class="arrow"/>
  <path d="M 870 395 L 910 395" class="arrow"/>
  <path d="M 1130 395 L 1170 395" class="arrow"/>

  <path d="M 760 440 C 760 520 500 520 500 440" class="recompute"/>
  <path d="M 1280 440 C 1280 520 1020 520 1020 440" class="recompute"/>

  <rect x="90" y="560" width="1440" height="130" class="box" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="120" y="598" class="label">What this page should teach</text>
  <text x="120" y="632" class="small">1. checkpointing lowers activation footprint by discarding part of the forward state.</text>
  <text x="120" y="662" class="small">2. backward pays by recomputing the dropped segment.</text>
  <text x="820" y="632" class="small">3. it is a compute-for-memory tradeoff, not a storage migration.</text>
</svg>

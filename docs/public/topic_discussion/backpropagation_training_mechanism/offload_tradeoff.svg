<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Activation offload tradeoff</title>
  <desc id="desc">Shows activations moved from GPU to CPU or slower storage and fetched back for backward.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 30px "Inter", "Noto Sans SC", sans-serif; fill: #0f172a; }
      .sub { font: 500 16px "Inter", "Noto Sans SC", sans-serif; fill: #475569; }
      .label { font: 700 18px "Inter", "Noto Sans SC", sans-serif; fill: #111827; }
      .small { font: 500 14px "Inter", "Noto Sans SC", sans-serif; fill: #334155; }
      .box { fill: #ffffff; stroke-width: 3; rx: 16; ry: 16; }
      .gpu { fill: #eff6ff; stroke: #3b82f6; }
      .cpu { fill: #ecfccb; stroke: #65a30d; }
      .arrow { stroke: #475569; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .fetch { stroke: #db2777; stroke-width: 4; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="760" fill="url(#bg)"/>
  <text x="64" y="66" class="title">Activation offload: move activations off GPU, fetch them back for backward</text>
  <text x="64" y="96" class="sub">Offload trades GPU memory for transfer cost. It is a storage migration, not recomputation.</text>

  <rect x="100" y="200" width="360" height="140" class="box gpu"/>
  <text x="280" y="238" text-anchor="middle" class="label">GPU memory</text>
  <text x="280" y="268" text-anchor="middle" class="small">forward activations leave hot path</text>
  <text x="280" y="296" text-anchor="middle" class="small">keep only what must stay on device</text>

  <rect x="600" y="200" width="360" height="140" class="box cpu"/>
  <text x="780" y="238" text-anchor="middle" class="label">CPU / slower tier</text>
  <text x="780" y="268" text-anchor="middle" class="small">store offloaded activations</text>
  <text x="780" y="296" text-anchor="middle" class="small">lower GPU peak memory</text>

  <rect x="1100" y="200" width="360" height="140" class="box gpu"/>
  <text x="1280" y="238" text-anchor="middle" class="label">Backward fetch</text>
  <text x="1280" y="268" text-anchor="middle" class="small">bring activations back when needed</text>
  <text x="1280" y="296" text-anchor="middle" class="small">transfer adds latency / bandwidth cost</text>

  <path d="M 460 270 L 600 270" class="arrow"/>
  <path d="M 960 270 L 1100 270" class="fetch"/>

  <rect x="90" y="420" width="1440" height="150" class="box" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="120" y="458" class="label">What this page should teach</text>
  <text x="120" y="492" class="small">1. offload moves activations away from GPU memory to a slower tier.</text>
  <text x="120" y="522" class="small">2. backward later fetches them back, so transfer bandwidth becomes the new bottleneck.</text>
  <text x="120" y="552" class="small">3. it is different from checkpointing because it does not recompute the missing state.</text>

  <rect x="90" y="610" width="1440" height="90" class="box" fill="#fffef2" stroke="#cbd5e1"/>
  <text x="120" y="646" class="label">Reading rule</text>
  <text x="320" y="646" class="small">If memory drops but communication rises, you are looking at offload, not checkpointing.</text>
</svg>

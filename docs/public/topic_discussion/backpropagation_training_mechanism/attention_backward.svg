<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Attention backward flow</title>
  <desc id="desc">Shows the backward path dV -> dP -> dS -> dQ and dK for attention, with saved tensors and softmax as the key bridge.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 30px "Inter", "Noto Sans SC", sans-serif; fill: #0f172a; }
      .sub { font: 500 16px "Inter", "Noto Sans SC", sans-serif; fill: #475569; }
      .label { font: 700 18px "Inter", "Noto Sans SC", sans-serif; fill: #111827; }
      .small { font: 500 14px "Inter", "Noto Sans SC", sans-serif; fill: #334155; }
      .box { fill: #ffffff; stroke-width: 3; rx: 18; ry: 18; }
      .arrow { stroke: #475569; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .soft { stroke: #7c3aed; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="760" fill="url(#bg)"/>
  <text x="64" y="66" class="title">Attention backward: dV -> dP -> dS -> dQ / dK</text>
  <text x="64" y="96" class="sub">The softmax bridge and saved tensors are the two things that make attention backward expensive.</text>

  <rect x="80" y="180" width="150" height="90" class="box" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="155" y="214" text-anchor="middle" class="label">dO</text>
  <text x="155" y="240" text-anchor="middle" class="small">output grad</text>

  <rect x="280" y="180" width="150" height="90" class="box" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="355" y="214" text-anchor="middle" class="label">dV</text>
  <text x="355" y="240" text-anchor="middle" class="small">P^T dO</text>

  <rect x="480" y="180" width="150" height="90" class="box" fill="#ecfccb" stroke="#65a30d"/>
  <text x="555" y="214" text-anchor="middle" class="label">dP</text>
  <text x="555" y="240" text-anchor="middle" class="small">dO V^T</text>

  <rect x="680" y="180" width="150" height="90" class="box" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="755" y="214" text-anchor="middle" class="label">dS</text>
  <text x="755" y="240" text-anchor="middle" class="small">softmax backward</text>

  <rect x="880" y="180" width="150" height="90" class="box" fill="#ecfeff" stroke="#0891b2"/>
  <text x="955" y="214" text-anchor="middle" class="label">dQ</text>
  <text x="955" y="240" text-anchor="middle" class="small">dS K / sqrt(d)</text>

  <rect x="1080" y="180" width="150" height="90" class="box" fill="#fdf2f8" stroke="#db2777"/>
  <text x="1155" y="214" text-anchor="middle" class="label">dK</text>
  <text x="1155" y="240" text-anchor="middle" class="small">dS^T Q / sqrt(d)</text>

  <path d="M 230 225 L 280 225" class="arrow"/>
  <path d="M 430 225 L 480 225" class="arrow"/>
  <path d="M 630 225 L 680 225" class="arrow"/>
  <path d="M 830 225 L 880 225" class="arrow"/>
  <path d="M 1030 225 L 1080 225" class="arrow"/>

  <rect x="90" y="340" width="1420" height="150" class="box" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="120" y="376" class="label">What this page should teach</text>
  <text x="120" y="410" class="small">1. backward is easiest to read from the output gradient inward, not from Q/K directly.</text>
  <text x="120" y="440" class="small">2. softmax is the bridge that turns dP into dS.</text>
  <text x="120" y="470" class="small">3. saving Q/K/V/P in forward is what makes the backward path possible.</text>

  <rect x="90" y="530" width="1420" height="130" class="box" fill="#fffef2" stroke="#cbd5e1"/>
  <text x="120" y="568" class="label">Reading rule</text>
  <text x="120" y="602" class="small">If you can trace dV -> dP -> dS -> dQ / dK without looking back at the formula, you have the right mental model for this page.</text>
</svg>

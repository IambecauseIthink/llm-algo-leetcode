<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 800" role="img" aria-labelledby="title desc">
  <title id="title">Activation memory ledger</title>
  <desc id="desc">Shows which activations must stay on GPU, which are temporaries, and why sequence length amplifies memory pressure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <style>
      .title { font: 700 30px "Inter", "Noto Sans SC", sans-serif; fill: #0f172a; }
      .sub { font: 500 16px "Inter", "Noto Sans SC", sans-serif; fill: #475569; }
      .label { font: 700 18px "Inter", "Noto Sans SC", sans-serif; fill: #111827; }
      .small { font: 500 14px "Inter", "Noto Sans SC", sans-serif; fill: #334155; }
      .box { fill: #ffffff; stroke-width: 3; rx: 16; ry: 16; }
      .keep { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2.5; rx: 12; ry: 12; }
      .temp { fill: #fee2e2; stroke: #ef4444; stroke-width: 2.5; rx: 12; ry: 12; }
      .move { fill: #ecfccb; stroke: #65a30d; stroke-width: 2.5; rx: 12; ry: 12; }
    </style>
  </defs>
  <rect width="1660" height="800" fill="url(#bg)"/>
  <text x="64" y="66" class="title">Activation memory ledger: what must stay, what can be dropped, what can be moved</text>
  <text x="64" y="96" class="sub">Backward becomes expensive because some activations must be kept alive until gradients are computed.</text>

  <rect x="80" y="160" width="1470" height="110" class="box" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="120" y="196" class="label">Why activations dominate memory</text>
  <text x="120" y="230" class="small">the larger the model, the longer the sequence, the more intermediate tensors backward needs to revisit</text>
  <text x="120" y="256" class="small">memory pressure grows before optimizer state becomes the main story</text>

  <rect x="100" y="320" width="350" height="170" class="keep"/>
  <text x="275" y="358" text-anchor="middle" class="label">Must keep</text>
  <text x="275" y="392" text-anchor="middle" class="small">tensors required by backward</text>
  <text x="275" y="422" text-anchor="middle" class="small">e.g. saved activations, masks</text>
  <text x="275" y="452" text-anchor="middle" class="small">they stay on the hot path</text>

  <rect x="490" y="320" width="350" height="170" class="temp"/>
  <text x="665" y="358" text-anchor="middle" class="label">Temporary only</text>
  <text x="665" y="392" text-anchor="middle" class="small">states that can be recomputed</text>
  <text x="665" y="422" text-anchor="middle" class="small">or regenerated later</text>
  <text x="665" y="452" text-anchor="middle" class="small">checkpointing reduces their residency</text>

  <rect x="880" y="320" width="350" height="170" class="move"/>
  <text x="1055" y="358" text-anchor="middle" class="label">Movable</text>
  <text x="1055" y="392" text-anchor="middle" class="small">states that can be offloaded</text>
  <text x="1055" y="422" text-anchor="middle" class="small">to CPU / slower tier</text>
  <text x="1055" y="452" text-anchor="middle" class="small">offload trades memory for bandwidth</text>

  <rect x="1270" y="320" width="310" height="170" class="box" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1425" y="358" text-anchor="middle" class="label">Sequence length effect</text>
  <text x="1425" y="392" text-anchor="middle" class="small">longer context -> more activations</text>
  <text x="1425" y="422" text-anchor="middle" class="small">more states -> higher peak memory</text>
  <text x="1425" y="452" text-anchor="middle" class="small">the curve grows before optimization helps</text>

  <rect x="90" y="560" width="1470" height="150" class="box" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="120" y="598" class="label">What this page should teach</text>
  <text x="120" y="632" class="small">Backward memory is a ledger: some states are mandatory, some are optional, and some can be moved. The optimization choice depends on that classification.</text>
  <text x="120" y="662" class="small">If you know which category a tensor belongs to, checkpointing and offload become much easier to reason about.</text>
</svg>

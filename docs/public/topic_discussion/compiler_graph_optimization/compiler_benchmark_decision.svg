<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="100" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">Compiler Benchmark Decision</text>
  <text x="88" y="132" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">Compiler work closes only when the backend path improves the real workload. Graph elegance alone is not a project decision.</text>

  <rect x="112" y="206" width="200" height="92" rx="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="140" y="244" fill="#1E3A8A" font-size="22" font-family="Arial, sans-serif" font-weight="700">1. Fix workload</text>
  <text x="132" y="274" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">same model, shape,</text>
  <text x="132" y="296" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">batch, backend target</text>

  <rect x="360" y="206" width="212" height="92" rx="18" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <text x="390" y="244" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">2. Compare paths</text>
  <text x="392" y="274" fill="#92400E" font-size="16" font-family="Arial, sans-serif">baseline vs fused / lowered /</text>
  <text x="392" y="296" fill="#92400E" font-size="16" font-family="Arial, sans-serif">alternative backend path</text>

  <rect x="620" y="206" width="212" height="92" rx="18" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="650" y="244" fill="#166534" font-size="22" font-family="Arial, sans-serif" font-weight="700">3. Explain gain</text>
  <text x="652" y="274" fill="#166534" font-size="16" font-family="Arial, sans-serif">did fusion, schedule or</text>
  <text x="652" y="296" fill="#166534" font-size="16" font-family="Arial, sans-serif">backend choice cause it?</text>

  <rect x="880" y="206" width="212" height="92" rx="18" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <text x="914" y="244" fill="#9D174D" font-size="22" font-family="Arial, sans-serif" font-weight="700">4. Decide</text>
  <text x="912" y="274" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">keep, tune, switch</text>
  <text x="912" y="296" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">backend, reject</text>

  <path d="M312 252H360" stroke="#374151" stroke-width="3"/>
  <path d="M572 252H620" stroke="#374151" stroke-width="3"/>
  <path d="M832 252H880" stroke="#374151" stroke-width="3"/>
  <path d="M345 244L360 252L345 260" fill="#374151"/>
  <path d="M605 244L620 252L605 260" fill="#374151"/>
  <path d="M865 244L880 252L865 260" fill="#374151"/>

  <rect x="122" y="392" width="250" height="170" rx="22" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="154" y="430" fill="#111827" font-size="22" font-family="Arial, sans-serif" font-weight="700">REJECT</text>
  <text x="154" y="466" fill="#374151" font-size="16" font-family="Arial, sans-serif">graph story is elegant,</text>
  <text x="154" y="488" fill="#374151" font-size="16" font-family="Arial, sans-serif">but workload outcome</text>
  <text x="154" y="510" fill="#374151" font-size="16" font-family="Arial, sans-serif">does not improve</text>

  <rect x="516" y="392" width="250" height="170" rx="22" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="548" y="430" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">TUNE</text>
  <text x="548" y="466" fill="#92400E" font-size="16" font-family="Arial, sans-serif">the direction is plausible,</text>
  <text x="548" y="488" fill="#92400E" font-size="16" font-family="Arial, sans-serif">but schedule, layout or</text>
  <text x="548" y="510" fill="#92400E" font-size="16" font-family="Arial, sans-serif">backend config still leak cost</text>

  <rect x="910" y="392" width="250" height="170" rx="22" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="956" y="430" fill="#166534" font-size="22" font-family="Arial, sans-serif" font-weight="700">KEEP / SWITCH</text>
  <text x="942" y="466" fill="#166534" font-size="16" font-family="Arial, sans-serif">the chosen backend path</text>
  <text x="942" y="488" fill="#166534" font-size="16" font-family="Arial, sans-serif">wins under the real workload</text>
  <text x="942" y="510" fill="#166534" font-size="16" font-family="Arial, sans-serif">and the gain is explainable</text>

  <rect x="110" y="606" width="1050" height="22" rx="10" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="134" y="622" fill="#374151" font-size="15" font-family="Arial, sans-serif">Page 06 uses this board to make the compiler story answer the only project question that matters: which backend path should survive validation?</text>
</svg>

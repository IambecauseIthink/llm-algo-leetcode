<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="100" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">Backend Constraint Map</text>
  <text x="88" y="132" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">Backend constraints are not a late implementation detail. They decide which graph ideas remain executable and worthwhile.</text>

  <rect x="120" y="206" width="234" height="96" rx="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="156" y="244" fill="#1E3A8A" font-size="22" font-family="Arial, sans-serif" font-weight="700">Layout Rules</text>
  <text x="146" y="274" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">memory order, tensor shape,</text>
  <text x="146" y="296" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">contiguity assumptions</text>

  <rect x="396" y="206" width="234" height="96" rx="18" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <text x="436" y="244" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">Kernel Shape</text>
  <text x="424" y="274" fill="#92400E" font-size="16" font-family="Arial, sans-serif">tile size, warp / block,</text>
  <text x="424" y="296" fill="#92400E" font-size="16" font-family="Arial, sans-serif">program mapping</text>

  <rect x="672" y="206" width="234" height="96" rx="18" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="714" y="244" fill="#166534" font-size="22" font-family="Arial, sans-serif" font-weight="700">Launch Rules</text>
  <text x="700" y="274" fill="#166534" font-size="16" font-family="Arial, sans-serif">runtime overhead, streams,</text>
  <text x="700" y="296" fill="#166534" font-size="16" font-family="Arial, sans-serif">synchronization points</text>

  <rect x="948" y="206" width="234" height="96" rx="18" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <text x="990" y="244" fill="#9D174D" font-size="22" font-family="Arial, sans-serif" font-weight="700">Resource Budget</text>
  <text x="978" y="274" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">registers, SRAM, occupancy,</text>
  <text x="978" y="296" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">bandwidth pressure</text>

  <path d="M354 254H396" stroke="#374151" stroke-width="3"/>
  <path d="M630 254H672" stroke="#374151" stroke-width="3"/>
  <path d="M906 254H948" stroke="#374151" stroke-width="3"/>
  <path d="M381 246L396 254L381 262" fill="#374151"/>
  <path d="M657 246L672 254L657 262" fill="#374151"/>
  <path d="M933 246L948 254L933 262" fill="#374151"/>

  <rect x="108" y="382" width="492" height="188" rx="22" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="136" y="420" fill="#111827" font-size="22" font-family="Arial, sans-serif" font-weight="700">What this means for graph ideas</text>
  <text x="136" y="454" fill="#374151" font-size="17" font-family="Arial, sans-serif">A fusion may look ideal in the graph, but fail because layout conversion gets expensive.</text>
  <text x="136" y="482" fill="#374151" font-size="17" font-family="Arial, sans-serif">A schedule may look elegant on paper, but lose because occupancy collapses.</text>
  <text x="136" y="510" fill="#374151" font-size="17" font-family="Arial, sans-serif">A lowering may be legal, but still create too many launches or synchronization points.</text>

  <rect x="640" y="382" width="512" height="188" rx="22" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="668" y="420" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">Used by page 04</text>
  <text x="668" y="454" fill="#92400E" font-size="17" font-family="Arial, sans-serif">This page reframes backend as a constraint system.</text>
  <text x="668" y="482" fill="#92400E" font-size="17" font-family="Arial, sans-serif">The question is not “does the backend exist?” but “which graph decisions survive under its rules?”.</text>
  <text x="668" y="524" fill="#92400E" font-size="17" font-family="Arial, sans-serif">That is why execution model and compiler design must be read together.</text>

  <rect x="108" y="608" width="1044" height="22" rx="10" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="132" y="624" fill="#374151" font-size="15" font-family="Arial, sans-serif">Backend constraints do not merely limit execution after the fact; they feed back into which fusion, lowering and scheduling choices are worth keeping.</text>
</svg>

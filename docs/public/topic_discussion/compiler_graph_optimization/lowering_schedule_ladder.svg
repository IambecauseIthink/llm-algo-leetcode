<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="100" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">Lowering and Schedule Ladder</text>
  <text x="88" y="132" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">Lowering is not a single translation step. The form must stay legal, then executable, then schedulable, and only then potentially fast.</text>

  <rect x="104" y="196" width="180" height="94" rx="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="150" y="232" fill="#1E3A8A" font-size="22" font-family="Arial, sans-serif" font-weight="700">High-level IR</text>
  <text x="136" y="262" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">semantic graph,</text>
  <text x="136" y="284" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">operator relations</text>

  <rect x="328" y="196" width="180" height="94" rx="18" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <text x="372" y="232" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">Legalize</text>
  <text x="360" y="262" fill="#92400E" font-size="16" font-family="Arial, sans-serif">rewrite into forms</text>
  <text x="360" y="284" fill="#92400E" font-size="16" font-family="Arial, sans-serif">the backend accepts</text>

  <rect x="552" y="196" width="180" height="94" rx="18" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="602" y="232" fill="#166534" font-size="22" font-family="Arial, sans-serif" font-weight="700">Lower</text>
  <text x="584" y="262" fill="#166534" font-size="16" font-family="Arial, sans-serif">explicit memory /</text>
  <text x="584" y="284" fill="#166534" font-size="16" font-family="Arial, sans-serif">loop structure</text>

  <rect x="776" y="196" width="180" height="94" rx="18" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <text x="822" y="232" fill="#9D174D" font-size="22" font-family="Arial, sans-serif" font-weight="700">Schedule</text>
  <text x="812" y="262" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">tile, reorder,</text>
  <text x="812" y="284" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">parallelize</text>

  <rect x="1000" y="196" width="180" height="94" rx="18" fill="#E9D5FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="1048" y="232" fill="#5B21B6" font-size="22" font-family="Arial, sans-serif" font-weight="700">Codegen</text>
  <text x="1032" y="262" fill="#5B21B6" font-size="16" font-family="Arial, sans-serif">kernel / runtime</text>
  <text x="1032" y="284" fill="#5B21B6" font-size="16" font-family="Arial, sans-serif">concrete output</text>

  <path d="M284 243H328" stroke="#374151" stroke-width="3"/>
  <path d="M508 243H552" stroke="#374151" stroke-width="3"/>
  <path d="M732 243H776" stroke="#374151" stroke-width="3"/>
  <path d="M956 243H1000" stroke="#374151" stroke-width="3"/>
  <path d="M313 235L328 243L313 251" fill="#374151"/>
  <path d="M537 235L552 243L537 251" fill="#374151"/>
  <path d="M761 235L776 243L761 251" fill="#374151"/>
  <path d="M985 235L1000 243L985 251" fill="#374151"/>

  <rect x="96" y="380" width="1088" height="118" rx="22" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="124" y="418" fill="#111827" font-size="22" font-family="Arial, sans-serif" font-weight="700">What this picture stops you from assuming</text>
  <text x="124" y="452" fill="#374151" font-size="18" font-family="Arial, sans-serif">“The compiler translated it” is not the same as “the system found a good executable form”. Each rung can preserve or lose the potential of the previous one.</text>
  <text x="124" y="482" fill="#374151" font-size="18" font-family="Arial, sans-serif">That is why legality, lowering shape and schedule quality must be separated in discussion.</text>

  <rect x="98" y="540" width="340" height="96" rx="18" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="124" y="574" fill="#92400E" font-size="21" font-family="Arial, sans-serif" font-weight="700">Used by page 03</text>
  <text x="124" y="604" fill="#92400E" font-size="16" font-family="Arial, sans-serif">It distinguishes legal, executable</text>
  <text x="124" y="626" fill="#92400E" font-size="16" font-family="Arial, sans-serif">and efficient as separate questions.</text>

  <rect x="474" y="540" width="332" height="96" rx="18" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="500" y="574" fill="#1E3A8A" font-size="21" font-family="Arial, sans-serif" font-weight="700">Cross-topic role</text>
  <text x="500" y="604" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">Profiling can show slowdown after codegen.</text>
  <text x="500" y="626" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">This page explains which ladder rung failed.</text>

  <rect x="842" y="540" width="338" height="96" rx="18" fill="#DCFCE7" stroke="#22C55E" stroke-width="2"/>
  <text x="868" y="574" fill="#166534" font-size="21" font-family="Arial, sans-serif" font-weight="700">Validation rule</text>
  <text x="868" y="604" fill="#166534" font-size="16" font-family="Arial, sans-serif">A good schedule must still make sense</text>
  <text x="868" y="626" fill="#166534" font-size="16" font-family="Arial, sans-serif">under the real backend and workload.</text>
</svg>

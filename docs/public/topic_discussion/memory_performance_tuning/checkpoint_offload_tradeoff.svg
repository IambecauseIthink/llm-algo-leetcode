<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#526581"/></marker></defs>
<style>.title{font:700 29px sans-serif;fill:#172b4d}.sub{font:15px sans-serif;fill:#526581}.label{font:700 18px sans-serif;fill:#172b4d}.txt{font:15px sans-serif;fill:#243b53}.small{font:14px sans-serif;fill:#526581}.card{stroke-width:2;rx:18}.flow{stroke:#526581;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.lane{stroke:#d9e2ec;stroke-width:2}</style>
<rect width="1400" height="720" fill="#fbfcfe"/>
<text x="700" y="48" text-anchor="middle" class="title">Checkpoint 与 Offload：三种换空间方式</text>
<text x="700" y="78" text-anchor="middle" class="sub">它们都在缓解 activation 压力，但代价分别落在更新节奏、计算或带宽。</text>

<rect x="70" y="125" width="1260" height="92" rx="24" fill="#e6f0ff" stroke="#8fb3d8" stroke-width="2"/>
<text x="700" y="163" text-anchor="middle" class="label">共同起点：反向传播需要的 activation 超过 GPU 预算</text>
<text x="700" y="193" text-anchor="middle" class="txt">先确认是容量问题，再比较三种策略的代价转移</text>

<line x1="700" y1="217" x2="700" y2="260" class="flow"/>
<line x1="180" y1="260" x2="1220" y2="260" class="lane"/>
<rect x="90" y="320" width="350" height="220" class="card" fill="#fff4d6" stroke="#e0b34f"/>
<text x="265" y="365" text-anchor="middle" class="label">调整单次规模</text><text x="265" y="405" text-anchor="middle" class="txt">micro-batch ↓</text><text x="265" y="435" text-anchor="middle" class="txt">gradient accumulation ↑</text><text x="265" y="482" text-anchor="middle" class="small">保留有效 batch</text><text x="265" y="510" text-anchor="middle" class="small">代价：微步数与更新节奏</text>
<rect x="525" y="320" width="350" height="220" class="card" fill="#e8f5ee" stroke="#76b893"/>
<text x="700" y="365" text-anchor="middle" class="label">减少保存</text><text x="700" y="405" text-anchor="middle" class="txt">activation checkpointing</text><text x="700" y="435" text-anchor="middle" class="txt">需要时重算前向区段</text><text x="700" y="482" text-anchor="middle" class="small">显存下降更直接</text><text x="700" y="510" text-anchor="middle" class="small">代价：额外计算时间</text>
<rect x="960" y="320" width="350" height="220" class="card" fill="#fce8e6" stroke="#d98b87"/>
<text x="1135" y="365" text-anchor="middle" class="label">改变驻留位置</text><text x="1135" y="405" text-anchor="middle" class="txt">CPU offload / hybrid</text><text x="1135" y="435" text-anchor="middle" class="txt">需要时搬回继续反向</text><text x="1135" y="482" text-anchor="middle" class="small">GPU 空间换出来</text><text x="1135" y="510" text-anchor="middle" class="small">代价：带宽、同步与等待</text>
<path d="M700 260 V280 H265 V320" class="flow"/><path d="M700 260 V320" class="flow"/><path d="M700 280 H1135 V320" class="flow"/>

<rect x="285" y="600" width="830" height="72" rx="22" fill="#fff" stroke="#829ab1" stroke-width="2"/>
<text x="700" y="630" text-anchor="middle" class="label">同一 workload 下比较</text><text x="700" y="655" text-anchor="middle" class="small">peak memory · step time · throughput · loss · OOM</text>
<path d="M265 540 V565 H450 V600" class="flow"/><path d="M700 540 V600" class="flow"/><path d="M1135 540 V565 H950 V600" class="flow"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600">
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 0L8 4L0 8Z" fill="#64748b"/>
  </marker>
  <style>
    text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}
    .title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#475569}
    .group{font-size:18px;font-weight:700}.head{font-size:15px;font-weight:700}
    .small{font-size:12px;fill:#475569}
    .panel{stroke:#94a3b8;stroke-width:2;rx:16}.item{stroke:#cbd5e1;stroke-width:1.5;rx:10}
    .flow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
  </style>
</defs>

<rect width="1280" height="600" fill="#f8fafc"/>
<text x="640" y="42" text-anchor="middle" class="title">自动求导：从前向建图到反向梯度</text>
<text x="640" y="70" text-anchor="middle" class="sub">先记录依赖关系，再沿计算图回传梯度，最后观察梯度状态和保存位置</text>

<!-- 前向建图 -->
<rect x="20" y="112" width="220" height="390" fill="#e0f2fe" class="panel"/>
<text x="130" y="148" text-anchor="middle" class="group">前向建图</text>
<rect x="46" y="192" width="168" height="78" fill="#fff" class="item"/>
<text x="130" y="226" text-anchor="middle" class="head">Tensor + 算子</text>
<text x="130" y="250" text-anchor="middle" class="small">产生前向依赖</text>
<rect x="46" y="300" width="168" height="78" fill="#fff" class="item"/>
<text x="130" y="334" text-anchor="middle" class="head">requires_grad</text>
<text x="130" y="358" text-anchor="middle" class="small">决定是否记录梯度</text>
<rect x="46" y="408" width="168" height="54" fill="#fff" class="item"/>
<text x="130" y="441" text-anchor="middle" class="head">计算结果</text>

<!-- 反向回传 -->
<rect x="264" y="112" width="220" height="390" fill="#dcfce7" class="panel"/>
<text x="374" y="148" text-anchor="middle" class="group">反向回传</text>
<rect x="290" y="192" width="168" height="78" fill="#fff" class="item"/>
<text x="374" y="226" text-anchor="middle" class="head">backward()</text>
<text x="374" y="250" text-anchor="middle" class="small">启动反向计算</text>
<rect x="290" y="300" width="168" height="78" fill="#fff" class="item"/>
<text x="374" y="334" text-anchor="middle" class="head">链式法则</text>
<text x="374" y="358" text-anchor="middle" class="small">沿依赖关系回传</text>
<rect x="290" y="408" width="168" height="54" fill="#fff" class="item"/>
<text x="374" y="441" text-anchor="middle" class="head">输入梯度</text>

<!-- 状态观察 -->
<rect x="508" y="112" width="220" height="390" fill="#fef3c7" class="panel"/>
<text x="618" y="148" text-anchor="middle" class="group">状态观察</text>
<rect x="534" y="176" width="168" height="70" fill="#fff" class="item"/>
<text x="618" y="208" text-anchor="middle" class="head">requires_grad</text>
<text x="618" y="231" text-anchor="middle" class="small">是否参与梯度追踪</text>
<rect x="534" y="270" width="168" height="70" fill="#fff" class="item"/>
<text x="618" y="302" text-anchor="middle" class="head">grad_fn</text>
<text x="618" y="325" text-anchor="middle" class="small">由什么运算产生</text>
<rect x="534" y="364" width="168" height="70" fill="#fff" class="item"/>
<text x="618" y="396" text-anchor="middle" class="head">is_leaf</text>
<text x="618" y="419" text-anchor="middle" class="small">位于计算图哪里</text>

<!-- 梯度保存 -->
<rect x="752" y="112" width="220" height="390" fill="#fce7f3" class="panel"/>
<text x="862" y="148" text-anchor="middle" class="group">梯度保存</text>
<rect x="778" y="192" width="168" height="78" fill="#fff" class="item"/>
<text x="862" y="226" text-anchor="middle" class="head">叶子节点</text>
<text x="862" y="250" text-anchor="middle" class="small">默认接收 .grad</text>
<rect x="778" y="300" width="168" height="78" fill="#fff" class="item"/>
<text x="862" y="334" text-anchor="middle" class="head">中间结果</text>
<text x="862" y="358" text-anchor="middle" class="small">需要 retain_grad()</text>
<rect x="778" y="408" width="168" height="54" fill="#fff" class="item"/>
<text x="862" y="441" text-anchor="middle" class="head">状态生命周期</text>

<!-- 自定义反向 -->
<rect x="996" y="112" width="264" height="390" fill="#ede9fe" class="panel"/>
<text x="1128" y="148" text-anchor="middle" class="group">自定义反向</text>
<rect x="1022" y="184" width="212" height="86" fill="#fff" class="item"/>
<text x="1128" y="218" text-anchor="middle" class="head">forward(ctx)</text>
<text x="1128" y="242" text-anchor="middle" class="small">计算输出并保存信息</text>
<rect x="1022" y="300" width="212" height="86" fill="#fff" class="item"/>
<text x="1128" y="334" text-anchor="middle" class="head">backward(ctx)</text>
<text x="1128" y="358" text-anchor="middle" class="small">读取信息并返回梯度</text>
<rect x="1022" y="416" width="212" height="46" fill="#fff" class="item"/>
<text x="1128" y="445" text-anchor="middle" class="head">闭合 forward / backward</text>

<path d="M240 297H264" class="flow"/>
<path d="M484 297H508" class="flow"/>
<path d="M728 297H752" class="flow"/>
<path d="M972 297H996" class="flow"/>
</svg>

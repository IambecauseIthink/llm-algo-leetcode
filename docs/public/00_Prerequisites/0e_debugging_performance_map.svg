<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
<title id="title">0E 调试与性能分析路线</title><desc id="desc">从性能观测和显存记录，到最小复现、异常定位和优化决策。</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.t{font-size:28px;font-weight:700}.s{font-size:15px;fill:#475569}.g{font-size:19px;font-weight:700}.h{font-size:19px;font-weight:700}.b{font-size:14px;fill:#475569}.p{stroke:#94a3b8;stroke-width:2;rx:16}.i{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:10}.f{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1280" height="520" fill="#f8fafc"/><text x="640" y="46" text-anchor="middle" class="t">调试与性能分析：从现象到可复查决策</text><text x="640" y="75" text-anchor="middle" class="s">记录证据、缩小问题、复现现象，再选择优化动作</text>
<rect x="35" y="115" width="285" height="330" fill="#e0f2fe" class="p"/><text x="177" y="150" text-anchor="middle" class="g">观测</text><rect x="68" y="185" width="220" height="78" class="i"/><text x="178" y="218" text-anchor="middle" class="h">profiler / 时间线</text><text x="178" y="242" text-anchor="middle" class="b">step time、hotspot、显存</text><text x="178" y="365" text-anchor="middle" class="b">记录现象而不是猜原因</text>
<rect x="360" y="115" width="285" height="330" fill="#dcfce7" class="p"/><text x="502" y="150" text-anchor="middle" class="g">拆解</text><rect x="393" y="185" width="220" height="78" class="i"/><text x="503" y="218" text-anchor="middle" class="h">显存账本 / 调用路径</text><text x="503" y="242" text-anchor="middle" class="b">参数、激活、临时张量</text><text x="503" y="365" text-anchor="middle" class="b">把现象对应到资源对象</text>
<rect x="685" y="115" width="260" height="330" fill="#fef3c7" class="p"/><text x="815" y="150" text-anchor="middle" class="g">复现</text><rect x="715" y="185" width="200" height="78" class="i"/><text x="815" y="218" text-anchor="middle" class="h">最小样本 / 异常输入</text><text x="815" y="242" text-anchor="middle" class="b">固定 seed 和 workload</text><text x="815" y="365" text-anchor="middle" class="b">确认问题能稳定出现</text>
<rect x="985" y="115" width="260" height="330" fill="#fce7f3" class="p"/><text x="1115" y="150" text-anchor="middle" class="g">决策</text><rect x="1015" y="185" width="200" height="78" class="i"/><text x="1115" y="218" text-anchor="middle" class="h">数据 / 算子 / 训练结构</text><text x="1115" y="242" text-anchor="middle" class="b">比较收益、代价和证据等级</text><text x="1115" y="365" text-anchor="middle" class="b">选择下一项可验证动作</text>
<path d="M320 275H355" class="f"/><path d="M645 275H680" class="f"/><path d="M945 275H980" class="f"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
<title id="title">0D 训练与模型结构路线</title><desc id="desc">从训练闭环到激活函数、归一化和 Attention 结构。</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.t{font-size:28px;font-weight:700}.s{font-size:15px;fill:#475569}.g{font-size:19px;font-weight:700}.h{font-size:19px;font-weight:700}.b{font-size:14px;fill:#475569}.p{stroke:#94a3b8;stroke-width:2;rx:16}.i{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:10}.f{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1280" height="520" fill="#f8fafc"/><text x="640" y="46" text-anchor="middle" class="t">训练与模型结构：一次训练步如何连接模型组件</text><text x="640" y="75" text-anchor="middle" class="s">从 loss 和更新出发，观察非线性、归一化与 QKV 形状如何影响计算</text>
<rect x="35" y="115" width="285" height="330" fill="#e0f2fe" class="p"/><text x="177" y="150" text-anchor="middle" class="g">训练闭环</text><rect x="68" y="185" width="220" height="78" class="i"/><text x="178" y="218" text-anchor="middle" class="h">loss → backward</text><text x="178" y="242" text-anchor="middle" class="b">更新、保存、评估</text><text x="178" y="365" text-anchor="middle" class="b">提供结构变化的运行场景</text>
<rect x="360" y="115" width="285" height="330" fill="#dcfce7" class="p"/><text x="502" y="150" text-anchor="middle" class="g">非线性</text><rect x="393" y="185" width="220" height="78" class="i"/><text x="503" y="218" text-anchor="middle" class="h">ReLU / GELU / SiLU</text><text x="503" y="242" text-anchor="middle" class="b">输入输出形状与分布</text><text x="503" y="365" text-anchor="middle" class="b">改变表达和梯度范围</text>
<rect x="685" y="115" width="260" height="330" fill="#fef3c7" class="p"/><text x="815" y="150" text-anchor="middle" class="g">稳定性</text><rect x="715" y="185" width="200" height="78" class="i"/><text x="815" y="218" text-anchor="middle" class="h">LayerNorm / RMSNorm</text><text x="815" y="242" text-anchor="middle" class="b">统计维度与尺度</text><text x="815" y="365" text-anchor="middle" class="b">约束训练中的数值变化</text>
<rect x="985" y="115" width="260" height="330" fill="#fce7f3" class="p"/><text x="1115" y="150" text-anchor="middle" class="g">Attention 结构</text><rect x="1015" y="185" width="200" height="78" class="i"/><text x="1115" y="218" text-anchor="middle" class="h">Q / K / V / mask</text><text x="1115" y="242" text-anchor="middle" class="b">shape contract 与注意力矩阵</text><text x="1115" y="365" text-anchor="middle" class="b">约束模型结构和数据流</text>
<path d="M320 275H355" class="f"/><path d="M645 275H680" class="f"/><path d="M945 275H980" class="f"/>
</svg>

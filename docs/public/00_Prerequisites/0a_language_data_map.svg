<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
<title id="title">0A 基础语言与数据表示路线</title><desc id="desc">从 Python 对象和函数，到 NumPy 数组维度、工具封装以及配置输入输出。</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.t{font-size:28px;font-weight:700}.s{font-size:15px;fill:#475569}.g{font-size:19px;font-weight:700}.h{font-size:19px;font-weight:700}.b{font-size:14px;fill:#475569}.p{stroke:#94a3b8;stroke-width:2;rx:16}.i{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:10}.f{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1280" height="520" fill="#f8fafc"/><text x="640" y="46" text-anchor="middle" class="t">基础语言与数据表示：输入如何变成可计算对象</text><text x="640" y="75" text-anchor="middle" class="s">先识别对象和维度，再组织封装、配置与输入输出</text>
<rect x="35" y="115" width="285" height="330" fill="#e0f2fe" class="p"/><text x="177" y="150" text-anchor="middle" class="g">Python 表达</text><rect x="68" y="185" width="220" height="78" class="i"/><text x="178" y="218" text-anchor="middle" class="h">对象与函数</text><text x="178" y="242" text-anchor="middle" class="b">变量、容器、调用关系</text><text x="178" y="365" text-anchor="middle" class="b">描述逻辑和数据入口</text>
<rect x="360" y="115" width="285" height="330" fill="#dcfce7" class="p"/><text x="502" y="150" text-anchor="middle" class="g">数组与维度</text><rect x="393" y="185" width="220" height="78" class="i"/><text x="503" y="218" text-anchor="middle" class="h">NumPy / einsum</text><text x="503" y="242" text-anchor="middle" class="b">shape、广播、收缩</text><text x="503" y="365" text-anchor="middle" class="b">表达数据关系和计算形状</text>
<rect x="685" y="115" width="260" height="330" fill="#fef3c7" class="p"/><text x="815" y="150" text-anchor="middle" class="g">工具封装</text><rect x="715" y="185" width="200" height="78" class="i"/><text x="815" y="218" text-anchor="middle" class="h">类与辅助函数</text><text x="815" y="242" text-anchor="middle" class="b">复用规则和检查逻辑</text><text x="815" y="365" text-anchor="middle" class="b">把重复步骤变成接口</text>
<rect x="985" y="115" width="260" height="330" fill="#fce7f3" class="p"/><text x="1115" y="150" text-anchor="middle" class="g">配置与输入输出</text><rect x="1015" y="185" width="200" height="78" class="i"/><text x="1115" y="218" text-anchor="middle" class="h">config / I/O</text><text x="1115" y="242" text-anchor="middle" class="b">参数、样本、结果文件</text><text x="1115" y="365" text-anchor="middle" class="b">为 Tensor 和训练接口准备输入</text>

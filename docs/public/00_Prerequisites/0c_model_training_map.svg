<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
<title id="title">0C 模型构建与训练接口路线</title><desc id="desc">从参数注册和前向调用，到状态保存、优化更新和批量数据输入。</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.t{font-size:28px;font-weight:700}.s{font-size:15px;fill:#475569}.g{font-size:19px;font-weight:700}.h{font-size:19px;font-weight:700}.b{font-size:14px;fill:#475569}.p{stroke:#94a3b8;stroke-width:2;rx:16}.i{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:10}.f{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1280" height="520" fill="#f8fafc"/><text x="640" y="46" text-anchor="middle" class="t">模型构建与训练接口：对象如何连接成训练步</text><text x="640" y="75" text-anchor="middle" class="s">参数注册、前向调用、状态恢复、梯度更新和 batch 输入形成闭环</text>
<rect x="35" y="115" width="285" height="330" fill="#e0f2fe" class="p"/><text x="177" y="150" text-anchor="middle" class="g">模型参数</text><rect x="68" y="185" width="220" height="78" class="i"/><text x="178" y="218" text-anchor="middle" class="h">nn.Module</text><text x="178" y="242" text-anchor="middle" class="b">parameters / forward</text><text x="178" y="365" text-anchor="middle" class="b">注册可训练对象</text>
<rect x="360" y="115" width="285" height="330" fill="#dcfce7" class="p"/><text x="502" y="150" text-anchor="middle" class="g">状态管理</text><rect x="393" y="185" width="220" height="78" class="i"/><text x="503" y="218" text-anchor="middle" class="h">state_dict</text><text x="503" y="242" text-anchor="middle" class="b">保存、加载、checkpoint</text><text x="503" y="365" text-anchor="middle" class="b">恢复模型状态</text>
<rect x="685" y="115" width="260" height="330" fill="#fef3c7" class="p"/><text x="815" y="150" text-anchor="middle" class="g">训练更新</text><rect x="715" y="185" width="200" height="78" class="i"/><text x="815" y="218" text-anchor="middle" class="h">loss → backward</text><text x="815" y="242" text-anchor="middle" class="b">zero_grad、optimizer.step</text><text x="815" y="365" text-anchor="middle" class="b">完成一次参数更新</text>
<rect x="985" y="115" width="260" height="330" fill="#fce7f3" class="p"/><text x="1115" y="150" text-anchor="middle" class="g">数据批次</text><rect x="1015" y="185" width="200" height="78" class="i"/><text x="1115" y="218" text-anchor="middle" class="h">Dataset / DataLoader</text><text x="1115" y="242" text-anchor="middle" class="b">样本、batch、collate</text><text x="1115" y="365" text-anchor="middle" class="b">提供训练步的输入契约</text>
<path d="M320 275H355" class="f"/><path d="M645 275H680" class="f"/><path d="M945 275H980" class="f"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">教程主路线：从 Part 基础到问题驱动的系统优化</title>
<desc id="desc">教程沿 Part 00 到 Part 04 逐步展开，并从 Part 02 分出推理优化、显存优化、算子优化和后训练优化四条主路线。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#eef4fb"/></linearGradient>
  <linearGradient id="spine" x1="0" x2="1"><stop stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#64748b" flood-opacity=".16"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
  <style>
    text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172b4d}.title{font-size:31px;font-weight:700}.sub{font-size:16px;fill:#52606d}.section{font-size:20px;font-weight:700}.part{font-size:18px;font-weight:700}.body{font-size:14px;fill:#334e68}.small{font-size:13px;fill:#52606d}.card{stroke:#cbd5e1;stroke-width:2;rx:18}.route{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
  </style>
</defs>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#486581"/></marker>
    <style>
      .title{font:700 29px sans-serif;fill:#17324d}.group{font:700 19px sans-serif;fill:#17324d}.label{font:700 17px sans-serif;fill:#17324d}.text{font:15px sans-serif;fill:#334e68}.small{font:14px sans-serif;fill:#486581}.box{stroke:#829ab1;stroke-width:2;rx:14}.line{stroke:#486581;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#829ab1;stroke-width:2;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#f7fafc"/>
  <text x="600" y="42" text-anchor="middle" class="title">教程资产地图：从机制学习到可复核结论</text>

  <rect x="35" y="90" width="245" height="250" fill="#e6f6f5" class="box"/>
  <text x="157" y="125" text-anchor="middle" class="group">1 · 机制输入</text>
  <text x="70" y="170" class="label">Part 00 / Part 01</text><text x="70" y="197" class="small">基础、硬件、训练和系统约束</text>
  <text x="70" y="240" class="label">Part 02 Notebook</text><text x="70" y="267" class="small">机制、题目、TODO、测试</text>
  <text x="70" y="310" class="small">回答：模型为什么这样计算？</text>
  <path d="M280 215 H325" class="line"/>

  <rect x="325" y="90" width="245" height="250" fill="#fff4e6" class="box"/>
  <text x="447" y="125" text-anchor="middle" class="group">2 · 专题组织</text>
  <text x="360" y="170" class="label">路线 intro</text><text x="360" y="197" class="small">Task、学习顺序、入口</text>
  <text x="360" y="240" class="label">正文 / casebook</text><text x="360" y="267" class="small">机制关系、判断框架</text>
  <text x="360" y="310" class="small">回答：问题应该沿哪条路线学？</text>
  <path d="M570 215 H615" class="line"/>

  <rect x="615" y="90" width="245" height="250" fill="#eef2ff" class="box"/>
  <text x="737" y="125" text-anchor="middle" class="group">3 · 项目实验</text>
  <text x="650" y="170" class="label">CPU 逻辑验证</text><text x="650" y="197" class="small">接口、账本、策略模拟</text>
  <text x="650" y="240" class="label">GPU / backend</text><text x="650" y="267" class="small">固定 workload、变量、对照</text>
  <text x="650" y="310" class="small">回答：改变条件后，结果如何变化？</text>
  <path d="M860 215 H905" class="line"/>

  <rect x="905" y="90" width="260" height="250" fill="#f0f4f8" class="box"/>
  <text x="1035" y="125" text-anchor="middle" class="group">4 · 证据与决策</text>
  <text x="940" y="170" class="label">结果文件</text><text x="940" y="197" class="small">指标、环境、证据等级</text>
  <text x="940" y="240" class="label">报告表格</text><text x="940" y="267" class="small">输入条件、对照结果、质量</text>
  <text x="940" y="310" class="label">accept / tune / reject</text>

  <rect x="35" y="405" width="1130" height="225" fill="#ffffff" class="box"/>
  <text x="600" y="443" text-anchor="middle" class="group">不同资产回答不同问题</text>
  <rect x="75" y="475" width="220" height="95" fill="#e6f6f5" class="box"/><text x="185" y="512" text-anchor="middle" class="label">图片</text><text x="185" y="542" text-anchor="middle" class="small">建立概念与关系</text>
  <rect x="335" y="475" width="220" height="95" fill="#fff4e6" class="box"/><text x="445" y="512" text-anchor="middle" class="label">表格</text><text x="445" y="542" text-anchor="middle" class="small">对照字段与条件</text>
  <rect x="595" y="475" width="220" height="95" fill="#eef2ff" class="box"/><text x="705" y="512" text-anchor="middle" class="label">Notebook / 项目</text><text x="705" y="542" text-anchor="middle" class="small">运行机制与采集数据</text>
  <rect x="855" y="475" width="220" height="95" fill="#fce8e6" class="box"/><text x="965" y="512" text-anchor="middle" class="label">报告</text><text x="965" y="542" text-anchor="middle" class="small">解释证据并做决策</text>
  <path d="M295 522 H335" class="line"/><path d="M555 522 H595" class="line"/><path d="M815 522 H855" class="line"/>
  <path d="M1035 340 V375 H157 V340" class="dash"/>
  <text x="600" y="375" text-anchor="middle" class="small">报告中的问题会反向决定下一轮 Notebook、项目变量和性能分析</text>
  <text x="600" y="680" text-anchor="middle" class="small">多模态专题将沿用同一资产链：多模态机制 → 图文项目 → 任务质量与系统成本证据。</text>
</svg>

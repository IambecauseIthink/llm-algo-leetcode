<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700">
<defs>
  <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#64748b"/></marker>
  <style>
    text{font-family:'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif;fill:#172033}
    .title{font-size:28px;font-weight:700}.sub{font-size:14px;fill:#475569}.group{font-size:18px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:14px}.small{font-size:12px;fill:#475569}
    .panel{stroke:#94a3b8;stroke-width:2;rx:16}.item{stroke:#cbd5e1;stroke-width:1.5;rx:10}.flow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.branch{stroke:#64748b;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.guide{stroke:#94a3b8;stroke-width:1.8;fill:none;stroke-dasharray:6 5;marker-end:url(#arrow)}.label{paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round}
  </style>
</defs>
<rect width="1280" height="700" fill="#f8fafc"/>
<text x="640" y="42" text-anchor="middle" class="title">KV Cache：从请求状态到显存组织</text>
<text x="640" y="70" text-anchor="middle" class="sub">先建立 MHA 容量基线，再分别选择架构压缩或运行时管理策略</text>

<!-- 请求生命周期 -->
<rect x="28" y="105" width="250" height="300" fill="#e0f2fe" class="panel"/>
<text x="153" y="138" text-anchor="middle" class="group">请求生命周期</text>
<rect x="55" y="160" width="196" height="56" fill="#fff" class="item"/>
<text x="153" y="198" text-anchor="middle" class="head">Prefill</text>
<text x="153" y="216" text-anchor="middle" class="small">读取上下文，建立初始 K / V</text>
<path d="M153 216V236" class="flow"/>
<rect x="55" y="242" width="196" height="56" fill="#fff" class="item"/>
<text x="153" y="276" text-anchor="middle" class="head">Decode</text>
<text x="153" y="294" text-anchor="middle" class="small">逐 token 读取并追加缓存</text>
<path d="M153 298V318" class="flow"/>
<rect x="55" y="324" width="196" height="56" fill="#fff" class="item"/>
<text x="153" y="358" text-anchor="middle" class="head">请求结束</text>
<text x="153" y="376" text-anchor="middle" class="small">释放或回收缓存空间</text>

<!-- MHA 基线 -->
<rect x="310" y="105" width="270" height="300" fill="#dcfce7" class="panel"/>
<text x="445" y="138" text-anchor="middle" class="group">MHA KV Cache 基线</text>
<rect x="338" y="164" width="214" height="68" fill="#fff" class="item"/>
<text x="445" y="194" text-anchor="middle" class="head">MHA</text>
<text x="445" y="216" text-anchor="middle" class="small">每个 Query 头对应一组 K / V</text>
<rect x="338" y="250" width="214" height="92" fill="#fff" class="item"/>
<text x="445" y="279" text-anchor="middle" class="body">KV Cache bytes</text>
<text x="445" y="302" text-anchor="middle" class="small">2 × B × L × S × Hkv</text>
<text x="445" y="322" text-anchor="middle" class="small">× D × dtype_bytes</text>
<text x="445" y="375" text-anchor="middle" class="small">容量与读取量随规模增长</text>

<!-- 架构压缩分支 -->
<rect x="620" y="105" width="270" height="300" fill="#fef3c7" class="panel"/>
<text x="755" y="138" text-anchor="middle" class="group">架构压缩</text>
<rect x="648" y="164" width="214" height="78" fill="#fff" class="item"/>
<text x="755" y="195" text-anchor="middle" class="head">GQA / MQA</text>
<text x="755" y="218" text-anchor="middle" class="small">减少 KV heads</text>
<text x="755" y="236" text-anchor="middle" class="small">降低缓存与潜在读取量</text>
<rect x="648" y="260" width="214" height="90" fill="#fff" class="item"/>
<text x="755" y="290" text-anchor="middle" class="head">MLA</text>
<text x="755" y="313" text-anchor="middle" class="small">缓存 latent 表示</text>
<text x="755" y="333" text-anchor="middle" class="small">用恢复计算换缓存空间</text>
<text x="755" y="375" text-anchor="middle" class="small">改变“保存什么”</text>

<!-- 运行时管理分支 -->
<rect x="930" y="105" width="322" height="300" fill="#fce7f3" class="panel"/>
<text x="1091" y="138" text-anchor="middle" class="group">运行时管理</text>
<rect x="958" y="164" width="266" height="78" fill="#fff" class="item"/>
<text x="1091" y="195" text-anchor="middle" class="head">PagedAttention</text>
<text x="1091" y="218" text-anchor="middle" class="small">Block 分配、寻址与回收</text>
<text x="1091" y="236" text-anchor="middle" class="small">降低连续预留造成的浪费</text>
<rect x="958" y="260" width="266" height="90" fill="#fff" class="item"/>
<text x="1091" y="290" text-anchor="middle" class="head">Prefix Cache / RadixAttention</text>
<text x="1091" y="313" text-anchor="middle" class="small">跨请求复用共享前缀</text>
<text x="1091" y="333" text-anchor="middle" class="small">观察命中率与复用 token</text>
<text x="1091" y="375" text-anchor="middle" class="small">改变“缓存放在哪里、能否复用”</text>

<!-- 基线到两条分支：架构与运行时是并行选择 -->
<path d="M278 255H310" class="flow"/>
<path d="M580 255H620" class="branch"/>
<path d="M520 405V620H970V405" class="branch"/>
<text x="745" y="610" text-anchor="middle" class="small label">运行时路径：与架构压缩可组合</text>

<!-- 成本与验证出口 -->
<path d="M445 405V450H295V500" class="guide"/>
<path d="M755 405V450H650V500" class="guide"/>
<path d="M1091 405V450H850V500" class="guide"/>
<path d="M510 548H550" class="branch"/>
<path d="M960 548H1000" class="guide"/>
<rect x="80" y="500" width="430" height="95" fill="#eff6ff" class="panel"/>
<text x="295" y="531" text-anchor="middle" class="group">资源成本</text>
<text x="295" y="560" text-anchor="middle" class="body">容量 · 带宽 · 计算 · 调度</text>
<text x="295" y="582" text-anchor="middle" class="small">每种策略都可能把成本转移到另一处</text>
<rect x="550" y="500" width="410" height="95" fill="#fefce8" class="panel"/>
<text x="755" y="531" text-anchor="middle" class="group">策略选择</text>
<text x="755" y="560" text-anchor="middle" class="body">表示压缩 · Block 管理 · 前缀复用</text>
<text x="755" y="582" text-anchor="middle" class="small">资源成本驱动策略组合</text>
<rect x="1000" y="500" width="220" height="95" fill="#fff1f2" class="panel"/>
<text x="1110" y="531" text-anchor="middle" class="group">验证出口</text>
<text x="1110" y="560" text-anchor="middle" class="body">显存 · TTFT · TPOT</text>
<text x="1110" y="582" text-anchor="middle" class="small">固定 workload 实测</text>
<path d="M300 645H350" class="flow"/>
<text x="360" y="649" class="small">实线：概念路径与策略分支</text>
<path d="M700 645H750" class="guide"/>
<text x="760" y="649" class="small">虚线：成本与验证出口</text>
</svg>

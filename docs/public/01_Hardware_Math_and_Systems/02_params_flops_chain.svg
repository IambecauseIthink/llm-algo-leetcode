<rect width="1280" height="570" fill="#f8fafc"/>
<text x="640" y="42" text-anchor="middle" class="title">参数量与 FLOPs：从模型结构到实际利用率</text>
<text x="640" y="69" text-anchor="middle" class="subtitle">先得到参数量，再计算前向与训练工作量，最后解释理论值和实测值的差距</text>

<rect x="35" y="125" width="270" height="300" fill="#e0f2fe" class="panel"/>

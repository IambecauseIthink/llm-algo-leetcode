<text x="480" y="244" text-anchor="middle" class="small">模型规模的计算输入</text>
<rect x="372" y="285" width="216" height="76" class="item"/>
<text x="480" y="315" text-anchor="middle" class="head">token 数 T</text>
<text x="480" y="339" text-anchor="middle" class="small">一次 workload 的工作量</text>
<text x="480" y="397" text-anchor="middle" class="body">Q2：前向约为 2PT</text>

<rect x="655" y="125" width="270" height="300" fill="#fef3c7" class="panel"/>
<text x="790" y="163" text-anchor="middle" class="group">训练计算量</text>
<rect x="682" y="190" width="216" height="76" class="item"/>

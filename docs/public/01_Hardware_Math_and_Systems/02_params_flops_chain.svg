<text x="170" y="220" text-anchor="middle" class="head">层数与隐藏维度</text>
<text x="170" y="244" text-anchor="middle" class="small">Attention · FFN · LayerNorm</text>
<rect x="62" y="285" width="216" height="76" class="item"/>
<text x="170" y="315" text-anchor="middle" class="head">词表与权重共享</text>
<text x="170" y="339" text-anchor="middle" class="small">结构参数汇总为参数量 P</text>
<text x="170" y="397" text-anchor="middle" class="body">Q1：模型有多少参数？</text>

<rect x="345" y="125" width="270" height="300" fill="#dcfce7" class="panel"/>
<text x="480" y="163" text-anchor="middle" class="group">前向计算量</text>
<rect x="372" y="190" width="216" height="76" class="item"/>

<rect x="682" y="285" width="216" height="76" class="item"/>
<text x="790" y="315" text-anchor="middle" class="head">Backward + Update</text>
<text x="790" y="339" text-anchor="middle" class="small">梯度、参数更新与训练开销</text>
<text x="790" y="397" text-anchor="middle" class="body">Q3：训练约为 6PT</text>

<rect x="965" y="125" width="270" height="300" fill="#fce7f3" class="panel"/>
<text x="1100" y="163" text-anchor="middle" class="group">利用率与瓶颈</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
  <title id="title">通信调度：从成本模型到计算重叠</title>
  <desc id="desc">消息组织和 collective 选择决定通信如何进入计算关键路径，最终通过 trace 和 step time 验证重叠收益。</desc>
  <defs><marker id="a27" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker><style>
    text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#475569}.group{font-size:19px;font-weight:700}.head{font-size:17px;font-weight:700}.body{font-size:14px}.small{font-size:12px;fill:#475569}.panel{stroke:#94a3b8;stroke-width:2;rx:16}.item{stroke:#cbd5e1;stroke-width:1.5;rx:10}.flow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#a27)}
  </style></defs>
  <rect width="1280" height="650" fill="#f8fafc"/>
  <text x="640" y="42" text-anchor="middle" class="title">通信调度：从成本模型到计算重叠</text>
  <text x="640" y="70" text-anchor="middle" class="sub">通信总量不变时，消息粒度和时间位置仍可能改变 step time</text>

  <rect x="40" y="110" width="285" height="155" fill="#e0f2fe" class="panel"/><text x="65" y="145" class="group">成本拆解</text><text x="65" y="180" class="body">数据量 / 带宽：传输下限</text><text x="65" y="207" class="body">延迟 / 启动次数：小消息开销</text><text x="65" y="234" class="body">同步：是否暴露在关键路径</text>
  <rect x="370" y="110" width="285" height="155" fill="#dcfce7" class="panel"/><text x="395" y="145" class="group">消息与 Collective</text><text x="395" y="180" class="body">合并小通信，控制消息粒度</text><text x="395" y="207" class="body">AllReduce：全局聚合</text><text x="395" y="234" class="body">All-to-All：token / 专家路由</text>
  <rect x="700" y="110" width="500" height="155" fill="#fef3c7" class="panel"/><text x="725" y="145" class="group">观测指标</text><text x="725" y="180" class="body">通信区间 · 计算区间 · overlap</text><text x="725" y="207" class="body">关键路径等待 · step time · 吞吐</text><text x="725" y="234" class="small">选择 collective 后仍需观察时间线，而不是只看通信总量</text>
  <path d="M325 188H360" class="flow"/><path d="M655 188H690" class="flow"/>
  <text x="342" y="170" text-anchor="middle" class="small">组织</text><text x="672" y="170" text-anchor="middle" class="small">观测</text>

  <rect x="40" y="330" width="1160" height="250" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" rx="16"/>
  <text x="70" y="370" class="group">训练 step 时间线</text>
  <text x="70" y="425" class="head">Compute</text>
  <rect x="190" y="398" width="180" height="46" fill="#dbeafe" class="item"/><text x="280" y="427" text-anchor="middle" class="body">计算块 A</text>
  <rect x="420" y="398" width="210" height="46" fill="#dbeafe" class="item"/><text x="525" y="427" text-anchor="middle" class="body">计算块 B</text>
  <rect x="700" y="398" width="190" height="46" fill="#dbeafe" class="item"/><text x="795" y="427" text-anchor="middle" class="body">计算块 C</text>
  <rect x="960" y="398" width="170" height="46" fill="#dbeafe" class="item"/><text x="1045" y="427" text-anchor="middle" class="body">计算块 D</text>
  <text x="70" y="515" class="head">Communication</text>
  <rect x="350" y="488" width="105" height="46" fill="#fef3c7" class="item"/><text x="402" y="517" text-anchor="middle" class="body">通信 1</text>
  <rect x="750" y="488" width="120" height="46" fill="#fef3c7" class="item"/><text x="810" y="517" text-anchor="middle" class="body">通信 2</text>
  <path d="M455 511H740" stroke="#f59e0b" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="600" y="500" text-anchor="middle" class="small">通信落在计算间隙，可被部分隐藏</text>
  <path d="M190 468H1130" stroke="#94a3b8" stroke-width="2"/>
  <text x="1110" y="468" text-anchor="end" class="small">时间方向 →</text>
</svg>

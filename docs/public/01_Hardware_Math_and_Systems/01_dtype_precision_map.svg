<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
  <style>
    text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}
    .title{font-size:28px;font-weight:700}.subtitle{font-size:15px;fill:#475569}
    .group{font-size:19px;font-weight:700}.head{font-size:19px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#475569}
    .root{fill:#eef2ff;stroke:#6366f1;stroke-width:2.5}.panel{stroke:#94a3b8;stroke-width:2;rx:16}.item{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:10}
    .flow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1280" height="720" fill="#f8fafc"/>
<text x="640" y="42" text-anchor="middle" class="title">数据格式与混合精度</text>
<text x="640" y="68" text-anchor="middle" class="subtitle">同一个 dtype 选择，同时影响表示方式、训练状态和硬件计算路径</text>

<rect x="400" y="92" width="480" height="82" class="root" rx="16"/>
<text x="640" y="126" text-anchor="middle" class="head">从表示方式到可验证的资源取舍</text>
<text x="640" y="151" text-anchor="middle" class="small">容量下界 · 数值范围 · 计算路径 · workload 结果</text>

<rect x="55" y="245" width="270" height="300" fill="#e0f2fe" class="panel"/>
<text x="190" y="280" text-anchor="middle" class="group">数据表示</text>
<rect x="82" y="305" width="216" height="76" class="item"/>
<text x="190" y="334" text-anchor="middle" class="head">FP32 / FP16 / BF16</text>
<text x="190" y="358" text-anchor="middle" class="small">位宽 · 指数 · 尾数</text>
<rect x="82" y="402" width="216" height="76" class="item"/>
<text x="190" y="431" text-anchor="middle" class="head">INT8 / INT4</text>
<text x="190" y="455" text-anchor="middle" class="small">量化后的存储表示</text>
<text x="190" y="516" text-anchor="middle" class="body">范围、精度与字节数</text>

<rect x="345" y="245" width="270" height="300" fill="#dcfce7" class="panel"/>
<text x="480" y="280" text-anchor="middle" class="group">训练状态</text>
<rect x="372" y="305" width="216" height="76" class="item"/>
<text x="480" y="334" text-anchor="middle" class="head">参数 · 梯度</text>
<text x="480" y="358" text-anchor="middle" class="small">前向与反向的驻留状态</text>
<rect x="372" y="402" width="216" height="76" class="item"/>
<text x="480" y="431" text-anchor="middle" class="head">优化器 · Master Weights</text>
<text x="480" y="455" text-anchor="middle" class="small">更新精度带来的额外成本</text>
<text x="480" y="516" text-anchor="middle" class="body">训练账本与显存压力</text>

<rect x="665" y="245" width="270" height="300" fill="#fef3c7" class="panel"/>
<text x="800" y="280" text-anchor="middle" class="group">硬件计算路径</text>
<rect x="692" y="305" width="216" height="76" class="item"/>
<text x="800" y="334" text-anchor="middle" class="head">FP32 → TF32</text>
<text x="800" y="358" text-anchor="middle" class="small">FP32 存储，改变矩阵乘路径</text>
<rect x="692" y="402" width="216" height="76" class="item"/>
<text x="800" y="431" text-anchor="middle" class="head">BF16 / FP16</text>
<text x="800" y="455" text-anchor="middle" class="small">16-bit 存储与 Tensor Core</text>
<text x="800" y="516" text-anchor="middle" class="body">算子、库与硬件共同决定</text>

<rect x="955" y="245" width="270" height="300" fill="#fce7f3" class="panel"/>
<text x="1090" y="280" text-anchor="middle" class="group">低精度演进</text>
<rect x="982" y="305" width="216" height="76" class="item"/>
<text x="1090" y="334" text-anchor="middle" class="head">H100 · FP8</text>
<text x="1090" y="358" text-anchor="middle" class="small">更低存储与计算成本</text>
<rect x="982" y="402" width="216" height="76" class="item"/>
<text x="1090" y="431" text-anchor="middle" class="head">E4M3 / E5M2</text>
<text x="1090" y="455" text-anchor="middle" class="small">精度、范围与 scaling</text>
<text x="1090" y="516" text-anchor="middle" class="body">格式选择需要校准验证</text>

<path d="M500 174L190 238" class="flow"/>
<path d="M580 174L480 238" class="flow"/>
<path d="M700 174L800 238" class="flow"/>
<path d="M780 174L1090 238" class="flow"/>
</svg>

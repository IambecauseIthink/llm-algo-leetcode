<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
  <title id="title">Checkpoint：从训练状态到可恢复交付</title>
  <desc id="desc">训练状态经过保存、继续训练、故障、加载恢复和可恢复验证，验证通过后回到训练过程。</desc>
  <defs><marker id="a28" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker><style>
    text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#475569}.group{font-size:18px;font-weight:700}.head{font-size:16px;font-weight:700}.body{font-size:13px}.small{font-size:12px;fill:#475569}.item{stroke:#cbd5e1;stroke-width:1.5;rx:12}.flow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#a28)}.return{stroke:#a855f7;stroke-width:2.5;fill:none;marker-end:url(#a28)}
  </style></defs>
  <rect width="1280" height="650" fill="#f8fafc"/>
  <text x="640" y="42" text-anchor="middle" class="title">Checkpoint：从训练状态到可恢复交付</text>
  <text x="640" y="70" text-anchor="middle" class="sub">保存什么、故障损失多少、恢复是否可信，共同决定训练能否可靠继续</text>

  <rect x="30" y="185" width="170" height="190" fill="#e0f2fe" class="item"/><text x="115" y="220" text-anchor="middle" class="group">可恢复状态</text><text x="115" y="265" text-anchor="middle" class="body">权重 · 优化器</text><text x="115" y="290" text-anchor="middle" class="body">调度器 · RNG</text><text x="115" y="315" text-anchor="middle" class="body">step · 数据位置</text><text x="115" y="350" text-anchor="middle" class="small">从同一训练点继续</text>
  <rect x="240" y="185" width="170" height="190" fill="#dcfce7" class="item"/><text x="325" y="220" text-anchor="middle" class="group">保存策略</text><text x="325" y="265" text-anchor="middle" class="body">保存间隔</text><text x="325" y="290" text-anchor="middle" class="body">文件大小 · 写入时间</text><text x="325" y="315" text-anchor="middle" class="body">一致性 · 版本</text><text x="325" y="350" text-anchor="middle" class="small">保存本身有成本</text>
  <rect x="450" y="185" width="170" height="190" fill="#fef3c7" class="item"/><text x="535" y="220" text-anchor="middle" class="group">继续训练</text><text x="535" y="265" text-anchor="middle" class="body">加载 checkpoint</text><text x="535" y="290" text-anchor="middle" class="body">恢复 optimizer / RNG</text><text x="535" y="315" text-anchor="middle" class="body">继续执行后续 step</text><text x="535" y="350" text-anchor="middle" class="small">进入下一次保存</text>
  <rect x="660" y="185" width="170" height="190" fill="#fee2e2" class="item"/><text x="745" y="220" text-anchor="middle" class="group">故障</text><text x="745" y="265" text-anchor="middle" class="body">失败概率</text><text x="745" y="290" text-anchor="middle" class="body">回滚步数</text><text x="745" y="315" text-anchor="middle" class="body">重复计算量</text><text x="745" y="350" text-anchor="middle" class="small">形成有效训练损失</text>
  <rect x="870" y="185" width="170" height="190" fill="#ede9fe" class="item"/><text x="955" y="220" text-anchor="middle" class="group">加载恢复</text><text x="955" y="265" text-anchor="middle" class="body">读取与重分片</text><text x="955" y="290" text-anchor="middle" class="body">多卡状态同步</text><text x="955" y="315" text-anchor="middle" class="body">恢复时间</text><text x="955" y="350" text-anchor="middle" class="small">恢复也需要预算</text>
  <rect x="1080" y="185" width="170" height="190" fill="#fce7f3" class="item"/><text x="1165" y="220" text-anchor="middle" class="group">可恢复验证</text><text x="1165" y="265" text-anchor="middle" class="body">能加载</text><text x="1165" y="290" text-anchor="middle" class="body">能继续训练</text><text x="1165" y="315" text-anchor="middle" class="body">能复现预期状态</text><text x="1165" y="350" text-anchor="middle" class="small">区分训练 / 激活检查点</text>

  <path d="M200 280H230" class="flow"/><path d="M410 280H440" class="flow"/><path d="M620 280H650" class="flow"/><path d="M830 280H860" class="flow"/><path d="M1040 280H1070" class="flow"/>
  <text x="215" y="262" text-anchor="middle" class="small">保存</text><text x="425" y="262" text-anchor="middle" class="small">恢复</text><text x="635" y="262" text-anchor="middle" class="small">中断</text><text x="845" y="262" text-anchor="middle" class="small">加载</text><text x="1055" y="262" text-anchor="middle" class="small">校验</text>
  <path d="M1165 375V520H535V385" class="return"/>
  <text x="850" y="510" text-anchor="middle" class="small">验证通过后回到训练过程</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">推理优化专题</title>
  <desc id="desc">从请求进入、Prefill、Decode 到 KV Cache 和 Serving 的推理优化主视觉。</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#061126" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#061126" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#061126" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <style>
      .title { font: 700 48px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #f8fafc; letter-spacing: 2px; }
      .en { font: 500 16px "Inter", "Arial", sans-serif; fill: #bfdbfe; letter-spacing: 1.2px; }
      .subtitle { font: 500 19px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #dbeafe; }
      .path { font: 600 17px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .path-en { font: 500 11px "Inter", "Arial", sans-serif; fill: #dbeafe; letter-spacing: 0.6px; }
    </style>
  </defs>

  <image href="./inference_optimization_topic_hero_v1.png" xlink:href="./inference_optimization_topic_hero_v1.png" x="0" y="0" width="1672" height="941" preserveAspectRatio="xMidYMid slice"/>
  <rect x="0" y="0" width="820" height="941" fill="url(#shade)"/>

  <g filter="url(#shadow)">
    <text x="82" y="150" class="title">推理优化</text>
    <text x="86" y="188" class="en">INFERENCE OPTIMIZATION</text>
    <text x="84" y="238" class="subtitle">让每一次请求更快、更稳、更省</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="78" y="775" width="1170" height="76" rx="22" fill="#071126" fill-opacity="0.82" stroke="#60a5fa" stroke-opacity="0.72" stroke-width="2"/>
    <text x="112" y="808" class="path">请求</text>
    <text x="112" y="832" class="path-en">REQUEST</text>
    <text x="268" y="811" class="path">→</text>
    <text x="340" y="808" class="path">Prefill</text>
    <text x="340" y="832" class="path-en">PROMPT PROCESSING</text>
    <text x="592" y="811" class="path">→</text>
    <text x="666" y="808" class="path">Decode</text>
    <text x="666" y="832" class="path-en">TOKEN GENERATION</text>
    <text x="910" y="811" class="path">→</text>
    <text x="984" y="808" class="path">KV Cache</text>
    <text x="984" y="832" class="path-en">STATE REUSE</text>
    <text x="1164" y="811" class="path">→ Serving</text>
  </g>
</svg>

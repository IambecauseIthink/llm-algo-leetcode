<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">大模型算法与系统教程</title>
  <desc id="desc">大模型算法与系统教程的四条主学习路线：推理优化、显存优化、算子优化和后训练优化。</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#071126" stop-opacity="0.96"/>
      <stop offset="0.58" stop-color="#071126" stop-opacity="0.76"/>
      <stop offset="1" stop-color="#071126" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <style>
      .title { font: 700 42px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #f8fafc; letter-spacing: 1px; }
      .subtitle { font: 500 20px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #bfdbfe; }
      .part { font: 600 14px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #dbeafe; }
      .route { font: 700 23px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .route-en { font: 500 12px "Inter", "Arial", sans-serif; fill: #dbeafe; letter-spacing: 0.7px; }
    </style>
  </defs>

  <image href="./tutorial_roadmap_hero_bg_v2.png" xlink:href="./tutorial_roadmap_hero_bg_v2.png" x="0" y="0" width="1672" height="941" preserveAspectRatio="xMidYMid slice"/>
  <rect x="0" y="0" width="900" height="941" fill="url(#shade)"/>

  <text x="82" y="126" class="title">llm-algo-leetcode</text>
  <text x="84" y="164" class="subtitle">大模型算法与系统教程</text>
  <text x="84" y="204" class="subtitle">从算法机制，到硬件执行与系统优化</text>

  <g opacity="0.9">
    <rect x="86" y="280" width="300" height="48" rx="18" fill="#172554" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="236" y="310" text-anchor="middle" class="part">Part 00 · 基础计算</text>
    <rect x="86" y="348" width="300" height="48" rx="18" fill="#172554" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="236" y="378" text-anchor="middle" class="part">Part 01 · 硬件与系统</text>
    <rect x="86" y="416" width="300" height="48" rx="18" fill="#24104f" stroke="#c084fc" stroke-width="3"/>
    <text x="236" y="446" text-anchor="middle" class="part">Part 02 · 机制与项目</text>
    <rect x="86" y="484" width="300" height="48" rx="18" fill="#422006" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="236" y="514" text-anchor="middle" class="part">Part 03 / 04 · 底层实现</text>
    <path d="M236 328 L236 348 M236 396 L236 416 M236 464 L236 484" stroke="#93c5fd" stroke-width="2" stroke-dasharray="5 7"/>
  </g>

  <g filter="url(#soft)">
    <rect x="858" y="704" width="176" height="92" rx="22" fill="#2563eb" fill-opacity="0.94" stroke="#93c5fd" stroke-width="2"/>
    <text x="946" y="744" text-anchor="middle" class="route">推理优化</text>
    <text x="946" y="768" text-anchor="middle" class="route-en">Inference Optimization</text>
    <rect x="1048" y="704" width="176" height="92" rx="22" fill="#16a34a" fill-opacity="0.94" stroke="#86efac" stroke-width="2"/>
    <text x="1136" y="744" text-anchor="middle" class="route">显存优化</text>
    <text x="1136" y="768" text-anchor="middle" class="route-en">Memory Optimization</text>
    <rect x="1238" y="704" width="176" height="92" rx="22" fill="#d97706" fill-opacity="0.96" stroke="#fde68a" stroke-width="2"/>
    <text x="1326" y="744" text-anchor="middle" class="route">算子优化</text>
    <text x="1326" y="768" text-anchor="middle" class="route-en">Operator Optimization</text>
    <rect x="1428" y="704" width="190" height="92" rx="22" fill="#7c3aed" fill-opacity="0.96" stroke="#d8b4fe" stroke-width="2"/>
    <text x="1523" y="744" text-anchor="middle" class="route">后训练优化</text>
    <text x="1523" y="768" text-anchor="middle" class="route-en">Post-Training Optimization</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1908" height="887" viewBox="0 0 1908 887" role="img" aria-labelledby="title desc">
  <title id="title">大模型算法与系统教程总览</title>
  <desc id="desc">从基础计算、硬件与系统，到模型机制、项目实验和底层实现，并延伸到推理优化、显存优化、算子优化和后训练优化四条主线。</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#eff6ff" stop-opacity="0.78"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e3a8a" flood-opacity="0.16"/>
    </filter>
    <style>
      .title { font: 700 42px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 20px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .part { font: 700 18px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .part-note { font: 500 14px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .route { font: 700 18px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .small { font: 500 14px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #334155; }
    </style>
  </defs>

  <image href="tutorial_roadmap_hero_v1.png" x="0" y="0" width="1908" height="887" preserveAspectRatio="xMidYMid slice"/>

  <!-- 左侧标题与纵向学习结构 -->
  <rect x="54" y="70" width="620" height="650" rx="28" fill="url(#panel)" filter="url(#shadow)"/>
  <text x="98" y="145" class="title">大模型算法与系统教程</text>
  <text x="100" y="185" class="subtitle">从算法机制，到硬件执行与系统优化</text>
  <text x="100" y="224" class="small">Notebook-first · 机制理解 · 项目实验 · 工程决策</text>

  <rect x="100" y="280" width="520" height="70" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="128" y="314" class="part">Part 00　基础计算</text>
  <text x="128" y="338" class="part-note">张量、自动微分、训练循环与数据基础</text>

  <rect x="100" y="368" width="520" height="84" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="128" y="405" class="part">Part 01　硬件与系统底座</text>
  <text x="128" y="431" class="part-note">精度、计算量、GPU、显存、Attention 与性能</text>

  <rect x="100" y="470" width="520" height="84" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="128" y="507" class="part">Part 02　机制与项目</text>
  <text x="128" y="533" class="part-note">最小实现、受控实验、指标比较与项目决策</text>

  <rect x="100" y="572" width="520" height="84" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="128" y="609" class="part">Part 03 / 04　底层实现</text>
  <text x="128" y="635" class="part-note">Triton、Kernel、编译、CUDA 与系统优化</text>

  <!-- 四条主线标签 -->
  <rect x="760" y="750" width="210" height="58" rx="18" fill="#2563eb" fill-opacity="0.94"/>
  <text x="865" y="786" text-anchor="middle" class="route">推理优化</text>
  <rect x="990" y="750" width="210" height="58" rx="18" fill="#16a34a" fill-opacity="0.94"/>
  <text x="1095" y="786" text-anchor="middle" class="route">显存优化</text>
  <rect x="1220" y="750" width="210" height="58" rx="18" fill="#d97706" fill-opacity="0.94"/>
  <text x="1325" y="786" text-anchor="middle" class="route">算子优化</text>
  <rect x="1450" y="750" width="210" height="58" rx="18" fill="#7c3aed" fill-opacity="0.94"/>
  <text x="1555" y="786" text-anchor="middle" class="route">后训练优化</text>
</svg>

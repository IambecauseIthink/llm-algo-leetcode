<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">大模型算法与系统教程总览</title>
  <desc id="desc">从基础计算、硬件与系统，到机制、项目和底层实现，进入四条优化主线。</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff" stop-opacity="0.97"/>
      <stop offset="1" stop-color="#e8f1ff" stop-opacity="0.88"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
    <style>
      .title { font: 700 39px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .sub { font: 500 19px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .part { font: 700 16px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .note { font: 500 13px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .route { font: 700 17px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .route-note { font: 500 12px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #e0ecff; }
      .badge { font: 700 11px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <image href="./tutorial_roadmap_hero_bg_v2.png" xlink:href="./tutorial_roadmap_hero_bg_v2.png" x="0" y="0" width="1672" height="941" preserveAspectRatio="xMidYMid slice"/>
  <rect x="48" y="48" width="590" height="670" rx="28" fill="url(#panel)" filter="url(#shadow)"/>
  <text x="86" y="120" class="title">大模型算法与系统教程</text>
  <text x="88" y="157" class="sub">从算法机制，到硬件执行与系统优化</text>
  <text x="88" y="190" class="note">Notebook-first · 机制理解 · 项目实验 · 工程决策</text>

  <rect x="88" y="238" width="510" height="74" rx="15" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="114" y="270" class="part">Part 00　基础计算</text>
  <text x="114" y="295" class="note">张量、自动微分、训练循环与数据基础</text>
  <rect x="88" y="330" width="510" height="86" rx="15" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="114" y="365" class="part">Part 01　硬件与系统底座</text>
  <text x="114" y="391" class="note">精度、计算量、GPU、显存、Attention 与性能</text>
  <rect x="88" y="434" width="510" height="86" rx="15" fill="#ede9fe" stroke="#7c3aed" stroke-width="4"/>
  <rect x="456" y="444" width="112" height="22" rx="11" fill="#7c3aed"/>
  <text x="512" y="459" text-anchor="middle" class="badge">推荐入口</text>
  <text x="114" y="469" class="part">Part 02　机制与项目</text>
  <text x="114" y="495" class="note">最小实现、受控实验、指标比较与项目决策</text>
  <rect x="88" y="538" width="510" height="86" rx="15" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="114" y="573" class="part">Part 03 / 04　底层实现</text>
  <text x="114" y="599" class="note">Triton、Kernel、编译、CUDA 与系统优化</text>
  <path d="M343 312 L343 330 M343 416 L343 434 M343 520 L343 538" stroke="#64748b" stroke-width="2"/>

  <rect x="742" y="668" width="850" height="70" rx="17" fill="#0f172a" fill-opacity="0.84" stroke="#64748b" stroke-width="2"/>
  <text x="1167" y="710" text-anchor="middle" class="route-note">共同方法：机制理解 → 可复现实验 → 指标证据 → 工程决策</text>
  <rect x="742" y="758" width="200" height="58" rx="16" fill="#2563eb" fill-opacity="0.95"/>
  <text x="842" y="784" text-anchor="middle" class="route">推理优化</text>
  <text x="842" y="804" text-anchor="middle" class="route-note">请求与服务</text>
  <rect x="958" y="758" width="200" height="58" rx="16" fill="#16a34a" fill-opacity="0.95"/>
  <text x="1058" y="784" text-anchor="middle" class="route">显存优化</text>
  <text x="1058" y="804" text-anchor="middle" class="route-note">状态与预算</text>
  <rect x="1174" y="758" width="200" height="58" rx="16" fill="#d97706" fill-opacity="0.95"/>
  <text x="1274" y="784" text-anchor="middle" class="route">算子优化</text>
  <text x="1274" y="804" text-anchor="middle" class="route-note">Kernel 与编译</text>
  <rect x="1390" y="758" width="202" height="58" rx="16" fill="#7c3aed" fill-opacity="0.95"/>
  <text x="1491" y="784" text-anchor="middle" class="route">后训练优化</text>
  <text x="1491" y="804" text-anchor="middle" class="route-note">微调与对齐</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">推理优化专题</title>
  <desc id="desc">从请求、Prefill、Decode 到 KV Cache 和服务调度的推理优化主视觉。</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.94"/>
      <stop offset="0.54" stop-color="#ffffff" stop-opacity="0.66"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1e3a8a" flood-opacity="0.18"/>
    </filter>
    <style>
      .title { font: 700 58px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f2a5a; letter-spacing: 3px; }
      .en { font: 600 18px "Inter", "Arial", sans-serif; fill: #2563a8; letter-spacing: 1.8px; }
      .subtitle { font: 500 24px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #24446f; }
      .node { font: 700 20px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #173b6c; }
      .node-en { font: 500 11px "Inter", "Arial", sans-serif; fill: #47709f; letter-spacing: 0.5px; }
      .arrow { font: 600 25px "Inter", "Arial", sans-serif; fill: #2563eb; }
    </style>
  </defs>

  <image href="./inference_optimization_topic_hero_light_v1.png" xlink:href="./inference_optimization_topic_hero_light_v1.png" x="0" y="0" width="1672" height="941" preserveAspectRatio="xMidYMid slice"/>
  <rect x="0" y="0" width="850" height="941" fill="url(#shade)"/>

  <g filter="url(#shadow)">
    <text x="82" y="142" class="title">推理优化</text>
    <text x="88" y="181" class="en">INFERENCE OPTIMIZATION</text>
    <text x="84" y="238" class="subtitle">让每一次请求更快、更稳、更省</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="770" width="1530" height="108" rx="26" fill="#ffffff" fill-opacity="0.84" stroke="#60a5fa" stroke-opacity="0.8" stroke-width="2"/>
    <rect x="94" y="792" width="220" height="64" rx="17" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="204" y="820" text-anchor="middle" class="node">请求</text>
    <text x="204" y="841" text-anchor="middle" class="node-en">REQUEST</text>
    <text x="328" y="831" class="arrow">→</text>
    <rect x="386" y="792" width="248" height="64" rx="17" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="510" y="820" text-anchor="middle" class="node">Prefill</text>
    <text x="510" y="841" text-anchor="middle" class="node-en">PROMPT PROCESSING</text>
    <text x="648" y="831" class="arrow">→</text>
    <rect x="706" y="792" width="248" height="64" rx="17" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="830" y="820" text-anchor="middle" class="node">Decode</text>
    <text x="830" y="841" text-anchor="middle" class="node-en">TOKEN GENERATION</text>
    <text x="968" y="831" class="arrow">→</text>
    <rect x="1026" y="792" width="248" height="64" rx="17" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
    <text x="1150" y="820" text-anchor="middle" class="node">KV Cache</text>
    <text x="1150" y="841" text-anchor="middle" class="node-en">STATE REUSE</text>
    <text x="1288" y="831" class="arrow">→</text>
    <rect x="1346" y="792" width="224" height="64" rx="17" fill="#cffafe" stroke="#0891b2" stroke-width="1.5"/>
    <text x="1458" y="820" text-anchor="middle" class="node">服务调度</text>
    <text x="1458" y="841" text-anchor="middle" class="node-en">SERVING</text>
  </g>
</svg>

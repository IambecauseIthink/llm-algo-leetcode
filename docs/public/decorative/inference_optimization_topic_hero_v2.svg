<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">推理优化专题</title>
  <desc id="desc">从请求、Prefill、Decode 到 KV Cache 和服务调度的推理优化主视觉。</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#061126" stop-opacity="0.94"/>
      <stop offset="0.54" stop-color="#061126" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#061126" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <style>
      .title { font: 700 62px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #ffffff; letter-spacing: 4px; }
      .en { font: 600 19px "Inter", "Arial", sans-serif; fill: #bfdbfe; letter-spacing: 2px; }
      .subtitle { font: 500 25px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #e0ecff; }
      .node { font: 700 21px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .node-en { font: 500 11px "Inter", "Arial", sans-serif; fill: #cfe2ff; letter-spacing: 0.5px; }
      .arrow { font: 600 27px "Inter", "Arial", sans-serif; fill: #93c5fd; }
    </style>
  </defs>

  <image href="./inference_optimization_topic_hero_v1.png" xlink:href="./inference_optimization_topic_hero_v1.png" x="0" y="0" width="1672" height="941" preserveAspectRatio="xMidYMid slice"/>
  <rect x="0" y="0" width="900" height="941" fill="url(#shade)"/>

  <g filter="url(#shadow)">
    <text x="82" y="142" class="title">推理优化</text>
    <text x="88" y="181" class="en">INFERENCE OPTIMIZATION</text>
    <text x="84" y="238" class="subtitle">让每一次请求更快、更稳、更省</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="74" y="768" width="1524" height="112" rx="28" fill="#071126" fill-opacity="0.86" stroke="#60a5fa" stroke-opacity="0.78" stroke-width="2"/>
    <rect x="98" y="792" width="218" height="66" rx="18" fill="#1d4ed8" fill-opacity="0.9"/>
    <text x="207" y="820" text-anchor="middle" class="node">请求</text>
    <text x="207" y="842" text-anchor="middle" class="node-en">REQUEST</text>
    <text x="328" y="832" class="arrow">→</text>
    <rect x="386" y="792" width="246" height="66" rx="18" fill="#2563eb" fill-opacity="0.9"/>
    <text x="509" y="820" text-anchor="middle" class="node">Prefill</text>
    <text x="509" y="842" text-anchor="middle" class="node-en">PROMPT PROCESSING</text>
    <text x="644" y="832" class="arrow">→</text>
    <rect x="702" y="792" width="246" height="66" rx="18" fill="#4f46e5" fill-opacity="0.9"/>
    <text x="825" y="820" text-anchor="middle" class="node">Decode</text>
    <text x="825" y="842" text-anchor="middle" class="node-en">TOKEN GENERATION</text>
    <text x="960" y="832" class="arrow">→</text>
    <rect x="1018" y="792" width="246" height="66" rx="18" fill="#7c3aed" fill-opacity="0.9"/>
    <text x="1141" y="820" text-anchor="middle" class="node">KV Cache</text>
    <text x="1141" y="842" text-anchor="middle" class="node-en">STATE REUSE</text>
    <text x="1276" y="832" class="arrow">→</text>
    <rect x="1334" y="792" width="238" height="66" rx="18" fill="#0891b2" fill-opacity="0.9"/>
    <text x="1453" y="820" text-anchor="middle" class="node">服务调度</text>
    <text x="1453" y="842" text-anchor="middle" class="node-en">SERVING</text>
  </g>
</svg>

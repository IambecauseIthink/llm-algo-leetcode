<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 740" role="img" aria-labelledby="title desc">
  <title id="title">PagedAttention 块表</title>
  <desc id="desc">展示逻辑 token 序列如何通过块表映射到分页 KV Cache 的固定大小物理块。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 30px "Inter", "Noto Sans SC", sans-serif; fill: #0f172a; }
      .sub { font: 500 16px "Inter", "Noto Sans SC", sans-serif; fill: #475569; }
      .label { font: 700 18px "Inter", "Noto Sans SC", sans-serif; fill: #111827; }
      .small { font: 500 14px "Inter", "Noto Sans SC", sans-serif; fill: #334155; }
      .box { fill: #ffffff; stroke-width: 3; rx: 16; ry: 16; }
      .cell { fill: #fff; stroke-width: 2; rx: 12; ry: 12; }
      .arrow { stroke: #475569; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1660" height="740" fill="url(#bg)"/>
  <text x="64" y="66" class="title">PagedAttention：逻辑序列 → 块表 → 物理块</text>
  <text x="64" y="96" class="sub">KV Cache 不是一块连续大张量，而是通过块表访问固定大小的物理块。</text>

  <rect x="90" y="160" width="1470" height="104" class="box" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="120" y="196" class="label">逻辑 token 序列</text>
  <text x="120" y="228" class="small">token 0 ... 15 → 逻辑块 0，token 16 ... 31 → 逻辑块 1，token 32 ... 47 → 逻辑块 2</text>
  <text x="120" y="252" class="small">decode 只有在当前块装满后才申请新块。</text>

  <rect x="90" y="330" width="520" height="200" class="box" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="120" y="368" class="label">块表</text>
  <rect x="120" y="396" width="110" height="54" class="cell" fill="#e0f2fe" stroke="#60a5fa"/>
  <rect x="240" y="396" width="110" height="54" class="cell" fill="#e0f2fe" stroke="#60a5fa"/>
  <rect x="360" y="396" width="110" height="54" class="cell" fill="#e0f2fe" stroke="#60a5fa"/>
  <rect x="480" y="396" width="110" height="54" class="cell" fill="#e0f2fe" stroke="#60a5fa"/>
  <text x="175" y="429" text-anchor="middle" class="small">逻辑块 0</text>
  <text x="295" y="429" text-anchor="middle" class="small">逻辑块 1</text>
  <text x="415" y="429" text-anchor="middle" class="small">逻辑块 2</text>
  <text x="535" y="429" text-anchor="middle" class="small">逻辑块 3</text>
  <text x="120" y="492" class="small">映射：逻辑块编号 → 物理块编号</text>
  <text x="120" y="520" class="small">从分散的物理块恢复逻辑上的连续序列</text>

  <rect x="690" y="330" width="790" height="200" class="box" fill="#ecfccb" stroke="#65a30d"/>
  <text x="720" y="368" class="label">物理块池</text>
  <rect x="720" y="398" width="120" height="54" class="cell" fill="#f7fee7" stroke="#84cc16"/>
  <rect x="850" y="398" width="120" height="54" class="cell" fill="#f7fee7" stroke="#84cc16"/>
  <rect x="980" y="398" width="120" height="54" class="cell" fill="#f7fee7" stroke="#84cc16"/>
  <rect x="1110" y="398" width="120" height="54" class="cell" fill="#f7fee7" stroke="#84cc16"/>
  <rect x="1240" y="398" width="120" height="54" class="cell" fill="#f7fee7" stroke="#84cc16"/>
  <rect x="1370" y="398" width="80" height="54" class="cell" fill="#f7fee7" stroke="#84cc16"/>
  <text x="780" y="432" text-anchor="middle" class="small">B0</text>
  <text x="910" y="432" text-anchor="middle" class="small">B1</text>
  <text x="1040" y="432" text-anchor="middle" class="small">B2</text>
  <text x="1170" y="432" text-anchor="middle" class="small">B3</text>
  <text x="1300" y="432" text-anchor="middle" class="small">B4</text>
  <text x="1410" y="432" text-anchor="middle" class="small">...</text>
  <text x="720" y="492" class="small">空闲物理块按请求需要分配</text>

  <path d="M 350 330 C 350 300 500 300 500 330" class="arrow"/>
  <path d="M 1170 330 C 1170 300 980 300 980 330" class="arrow"/>

  <rect x="90" y="570" width="1470" height="110" class="box" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="120" y="608" class="label">一句话理解</text>
  <text x="120" y="642" class="small">PagedAttention 让请求通过块表逐步增长，减少每个请求独占一块连续 KV 大张量造成的碎片。</text>
</svg>

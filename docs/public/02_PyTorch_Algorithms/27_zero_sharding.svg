<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 560" role="img" aria-labelledby="title desc">
<title id="title">ZeRO 状态分片总览</title><desc id="desc">数据并行中的参数、梯度和优化器状态冗余，以及 ZeRO 分阶段切分对象。</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><style>
.title{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:28px;font-weight:700;fill:#0f172a}.sub{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:15px;font-weight:500;fill:#475569}.label{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:18px;font-weight:700;fill:#111827}.small{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:13px;font-weight:500;fill:#334155}.box{stroke-width:3;rx:16;ry:16}.flow{stroke:#475569;stroke-width:4;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
<rect width="1500" height="560" fill="url(#bg)"/><text x="60" y="54" class="title">ZeRO：把训练状态从每卡复制改成分片</text><text x="60" y="82" class="sub">核心问题是每张卡是否都需要长期保存完整的参数、梯度和优化器状态</text>
<rect x="70" y="220" width="220" height="100" class="box" fill="#fff7ed" stroke="#f59e0b"/><text x="180" y="260" text-anchor="middle" class="label">数据并行</text><text x="180" y="290" text-anchor="middle" class="small">每卡复制全部状态</text>
<rect x="390" y="120" width="230" height="100" class="box" fill="#eff6ff" stroke="#3b82f6"/><text x="505" y="160" text-anchor="middle" class="label">ZeRO-1</text><text x="505" y="190" text-anchor="middle" class="small">切分优化器状态</text>
<rect x="390" y="230" width="230" height="100" class="box" fill="#f5f3ff" stroke="#8b5cf6"/><text x="505" y="270" text-anchor="middle" class="label">ZeRO-2</text><text x="505" y="300" text-anchor="middle" class="small">再切分梯度</text>
<rect x="390" y="340" width="230" height="100" class="box" fill="#ecfccb" stroke="#65a30d"/><text x="505" y="380" text-anchor="middle" class="label">ZeRO-3</text><text x="505" y="410" text-anchor="middle" class="small">连参数也按卡切分</text>
<rect x="780" y="220" width="290" height="100" class="box" fill="#fff1f2" stroke="#e11d48"/><text x="925" y="260" text-anchor="middle" class="label">显存账本</text><text x="925" y="290" text-anchor="middle" class="small">参数 · 梯度 · 优化器状态</text>
<rect x="1190" y="220" width="240" height="100" class="box" fill="#ffffff" stroke="#cbd5e1"/><text x="1310" y="260" text-anchor="middle" class="label">通信代价</text><text x="1310" y="290" text-anchor="middle" class="small">Reduce-Scatter / All-Gather</text>
<path d="M290 270L390 170" class="flow"/><path d="M290 270L390 280" class="flow"/><path d="M290 270L390 390" class="flow"/><path d="M620 170C700 170 700 250 780 250" class="flow"/><path d="M620 280L780 270" class="flow"/><path d="M620 390C700 390 700 300 780 300" class="flow"/><path d="M1070 270L1190 270" class="flow"/>
</svg>

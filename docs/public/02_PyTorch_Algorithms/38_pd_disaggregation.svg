  <text x="958" y="248" fill="#334155" font-size="15" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">状态同步</text>
  <text x="958" y="272" fill="#334155" font-size="15" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">缓存归属</text>
  <text x="958" y="296" fill="#334155" font-size="15" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">通信与等待时间</text>

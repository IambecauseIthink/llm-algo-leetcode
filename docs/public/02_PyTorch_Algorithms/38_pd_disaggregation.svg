<svg width="1280" height="760" viewBox="0 0 1280 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="760" fill="#F7F4EC"/>
  <rect x="48" y="36" width="1184" height="688" rx="28" fill="#FFFDF7" stroke="#263238" stroke-width="2"/>
  <text x="84" y="84" fill="#17202A" font-size="28" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-weight="700">Prefill / Decode 分离：从请求分类到拆分决策</text>
  <text x="84" y="116" fill="#52616B" font-size="17" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">先记录两段工作的规模，再判断拆池收益能否覆盖状态交接代价。</text>

  <rect x="90" y="166" width="220" height="112" rx="18" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
  <text x="148" y="202" fill="#075985" font-size="21" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-weight="700">请求进入</text>
  <text x="116" y="236" fill="#075985" font-size="16" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">输入 token</text>
  <text x="116" y="260" fill="#075985" font-size="16" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">生成 token · 缓存命中</text>

  <rect x="370" y="166" width="220" height="112" rx="18" fill="#F3E8FF" stroke="#9333EA" stroke-width="2"/>
  <text x="424" y="202" fill="#6B21A8" font-size="21" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-weight="700">分类账本</text>
  <text x="396" y="236" fill="#6B21A8" font-size="16" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">长输入 / 长生成</text>
  <text x="396" y="260" fill="#6B21A8" font-size="16" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">队列与缓存状态</text>

  <path d="M310 222H370" stroke="#455A64" stroke-width="3"/>
  <path d="M358 214L370 222L358 230" fill="#455A64"/>

  <rect x="650" y="146" width="220" height="96" rx="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>

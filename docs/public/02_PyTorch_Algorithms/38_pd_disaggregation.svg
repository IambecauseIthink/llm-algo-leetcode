  <rect x="90" y="574" width="1060" height="92" rx="18" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="122" y="612" fill="#334155" font-size="16" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">比较出口：prefill 时间、TPOT、端到端延迟、吞吐、队列等待和通信代价。</text>
  <text x="122" y="640" fill="#334155" font-size="16" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">实线表示请求流向；虚线表示需要计入的状态交接或对照关系。</text>

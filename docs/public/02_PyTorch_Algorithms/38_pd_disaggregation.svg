  <text x="684" y="216" fill="#1E3A8A" font-size="15" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">输入处理与 attention</text>

  <rect x="650" y="286" width="220" height="96" rx="18" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="714" y="324" fill="#166534" font-size="20" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-weight="700">Decode 池</text>
  <text x="684" y="356" fill="#166534" font-size="15" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">逐 token 生成与 KV Cache</text>

  <rect x="650" y="426" width="220" height="96" rx="18" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="704" y="464" fill="#92400E" font-size="20" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-weight="700">共享池</text>
  <text x="684" y="496" fill="#92400E" font-size="15" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">拆分收益不足时的基线</text>


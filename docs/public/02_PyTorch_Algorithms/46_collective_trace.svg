<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d">
<title id="t">通信事件如何读时间线</title><desc id="d">按 rank 对齐计算和通信事件，观察等待间隙与通信重叠。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><style>.h{font:700 26px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.s{font:500 15px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.l{font:700 18px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#111827}.b{font:500 14px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}.box{stroke-width:3;rx:16}.f{stroke:#475569;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1200" height="500" fill="#f8fafc"/><text x="50" y="55" class="h">通信时间线：找出谁在等待</text><text x="50" y="83" class="s">同一 collective 在不同 rank 的开始和结束位置，决定是否形成同步瓶颈。</text>
<rect x="55" y="190" width="220" height="110" class="box" fill="#eff6ff" stroke="#3b82f6"/><text x="165" y="232" text-anchor="middle" class="l">Rank 时间线</text><text x="165" y="263" text-anchor="middle" class="b">计算 · 通信 · 空闲</text>
<rect x="345" y="190" width="220" height="110" class="box" fill="#fef3c7" stroke="#d97706"/><text x="455" y="232" text-anchor="middle" class="l">事件对齐</text><text x="455" y="263" text-anchor="middle" class="b">开始时间 · 持续时间</text>
<rect x="635" y="115" width="220" height="100" class="box" fill="#ecfccb" stroke="#65a30d"/><text x="745" y="155" text-anchor="middle" class="l">可重叠</text><text x="745" y="185" text-anchor="middle" class="b">通信覆盖在计算下</text>
<rect x="635" y="260" width="220" height="100" class="box" fill="#fff1f2" stroke="#e11d48"/><text x="745" y="300" text-anchor="middle" class="l">待等待</text><text x="745" y="330" text-anchor="middle" class="b">空闲间隙扩大</text>
<rect x="930" y="190" width="210" height="110" class="box" fill="#f5f3ff" stroke="#8b5cf6"/><text x="1035" y="232" text-anchor="middle" class="l">优化假设</text><text x="1035" y="263" text-anchor="middle" class="b">改 bucket / overlap / 拓扑</text>
<path d="M275 245H345M565 235L635 165M565 265L635 310M855 165L930 225M855 310L930 265" class="f"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" role="img" aria-labelledby="title desc">
  <title id="title">交叉熵损失的梯度路径</title>
  <desc id="desc">logits 经过 softmax，与目标标签和有效位置掩码共同计算 loss；梯度从 loss 回到 logits。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#fff7ed"/></linearGradient>
    <style>
      .title { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 28px; font-weight: 700; fill: #0f172a; }
      .sub { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 15px; font-weight: 500; fill: #475569; }
      .label { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .small { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 500; fill: #334155; }
      .box { stroke-width: 3; rx: 16; ry: 16; }
      .flow { stroke: #475569; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .grad { stroke: #dc2626; stroke-width: 4; stroke-dasharray: 9 7; fill: none; marker-end: url(#red); }
      .input { stroke: #8b5cf6; stroke-width: 3; stroke-dasharray: 8 6; fill: none; marker-end: url(#purple); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker>
    <marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker>
    <marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8b5cf6"/></marker>
  </defs>
  <rect width="1500" height="600" fill="url(#bg)"/>
  <text x="60" y="54" class="title">交叉熵 backward：loss 如何把信号送回 logits</text>
  <text x="60" y="82" class="sub">实线表示前向计算；紫色虚线表示标签与掩码输入；红色虚线表示梯度回到 logits</text>

  <rect x="70" y="205" width="190" height="90" class="box" fill="#fff7ed" stroke="#f59e0b"/><text x="165" y="241" text-anchor="middle" class="label">logits</text><text x="165" y="268" text-anchor="middle" class="small">模型输出分数</text>
  <rect x="345" y="205" width="210" height="90" class="box" fill="#eff6ff" stroke="#3b82f6"/><text x="450" y="241" text-anchor="middle" class="label">softmax</text><text x="450" y="268" text-anchor="middle" class="small">得到类别概率</text>
  <rect x="640" y="205" width="250" height="90" class="box" fill="#f5f3ff" stroke="#8b5cf6"/><text x="765" y="241" text-anchor="middle" class="label">概率与标签比较</text><text x="765" y="268" text-anchor="middle" class="small">选择目标类别并取对数</text>
  <rect x="980" y="205" width="200" height="90" class="box" fill="#ecfccb" stroke="#65a30d"/><text x="1080" y="241" text-anchor="middle" class="label">loss</text><text x="1080" y="268" text-anchor="middle" class="small">负对数似然</text>
  <path d="M260 250 H345" class="flow"/><path d="M555 250 H640" class="flow"/><path d="M890 250 H980" class="flow"/>

  <rect x="330" y="400" width="230" height="90" class="box" fill="#fff" stroke="#8b5cf6"/><text x="445" y="436" text-anchor="middle" class="label">ignore_index / padding</text><text x="445" y="463" text-anchor="middle" class="small">该位置不计入平均</text>
  <rect x="650" y="400" width="230" height="90" class="box" fill="#fff" stroke="#8b5cf6"/><text x="765" y="436" text-anchor="middle" class="label">目标标签</text><text x="765" y="463" text-anchor="middle" class="small">正确类别 token</text>
  <path d="M445 400 V355 H700 V295" class="input"/><path d="M765 400 V295" class="input"/>

  <rect x="980" y="400" width="200" height="90" class="box" fill="#fff1f2" stroke="#e11d48"/><text x="1080" y="436" text-anchor="middle" class="label">d(logits)</text><text x="1080" y="463" text-anchor="middle" class="small">softmax − one_hot</text>
  <path d="M1080 295 V400" class="grad"/>
  <text x="70" y="555" class="small">关键关系：标签和有效位置共同决定 loss；loss 的梯度再沿 logits 返回计算图。</text>
</svg>

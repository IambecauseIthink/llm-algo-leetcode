<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">前向传播与反向传播的训练闭环</title><desc id="desc">展示输入经过前向计算得到 loss，再通过反向传播得到梯度并更新参数的关系。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>
.title{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:27px;font-weight:700;fill:#0f172a}.sub{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:15px;fill:#475569}.head{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:18px;font-weight:700;fill:#111827}.body{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:14px;fill:#334155}.small{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:13px;fill:#475569}.box{stroke-width:2.5;rx:15}.line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}
</style></defs><rect width="1200" height="300" fill="#f8fafc"/><text x="55" y="52" class="title">训练闭环：前向计算、Loss 与梯度更新</text><text x="55" y="82" class="sub">前向产生可比较的结果，Loss 提供误差信号，反向传播把信号传回参数；中间状态支撑正确求导并影响训练显存。</text>
<rect x="55" y="135" width="190" height="125" fill="#dbeafe" class="box" stroke="#3b82f6"/><text x="150" y="177" text-anchor="middle" class="head">输入数据</text><text x="150" y="210" text-anchor="middle" class="body">x / labels</text><text x="150" y="237" text-anchor="middle" class="small">进入模型</text>
<rect x="285" y="135" width="190" height="125" fill="#dcfce7" class="box" stroke="#16a34a"/><text x="380" y="177" text-anchor="middle" class="head">前向传播</text><text x="380" y="210" text-anchor="middle" class="body">Linear → ReLU</text><text x="380" y="237" text-anchor="middle" class="small">保存必要中间状态</text>
<rect x="515" y="135" width="190" height="125" fill="#fef3c7" class="box" stroke="#d97706"/><text x="610" y="177" text-anchor="middle" class="head">Loss</text><text x="610" y="210" text-anchor="middle" class="body">预测与目标比较</text><text x="610" y="237" text-anchor="middle" class="small">产生误差信号</text>
<rect x="745" y="135" width="190" height="125" fill="#fce7f3" class="box" stroke="#db2777"/><text x="840" y="177" text-anchor="middle" class="head">反向传播</text><text x="840" y="210" text-anchor="middle" class="body">链式法则</text><text x="840" y="237" text-anchor="middle" class="small">得到各处梯度</text>
<rect x="975" y="135" width="170" height="125" fill="#ede9fe" class="box" stroke="#7c3aed"/><text x="1060" y="177" text-anchor="middle" class="head">参数更新</text><text x="1060" y="210" text-anchor="middle" class="body">优化器</text><text x="1060" y="237" text-anchor="middle" class="small">进入下一轮</text>
<path d="M245 197H275" class="line"/><path d="M475 197H505" class="line"/><path d="M705 197H735" class="line"/><path d="M935 197H965" class="line"/>
</svg>

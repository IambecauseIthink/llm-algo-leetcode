<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">SwiGLU 总览</title><desc id="d">输入分别进入 gate 和 content 两条升维路径，经过 SiLU 门控后逐元素相乘，再降回 hidden size。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><style>.h{font:700 26px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.s{font:500 15px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.l{font:700 18px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#111827}.b{font:500 14px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}.box{stroke-width:3;rx:16}.f{stroke:#475569;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="500" fill="#f8fafc"/><text x="50" y="55" class="h">SwiGLU：内容分支与门控分支</text><text x="50" y="83" class="s">两条升维路径分工不同，逐元素门控后再投影回 hidden size。</text><rect x="55" y="190" width="220" height="110" class="box" fill="#eff6ff" stroke="#3b82f6"/><text x="165" y="232" text-anchor="middle" class="l">输入 x</text><text x="165" y="263" text-anchor="middle" class="b">hidden state</text><rect x="345" y="115" width="220" height="100" class="box" fill="#fef3c7" stroke="#d97706"/><text x="455" y="155" text-anchor="middle" class="l">gate_proj</text><text x="455" y="185" text-anchor="middle" class="b">SiLU 门控</text><rect x="345" y="260" width="220" height="100" class="box" fill="#ecfccb" stroke="#65a30d"/><text x="455" y="300" text-anchor="middle" class="l">up_proj</text><text x="455" y="330" text-anchor="middle" class="b">内容候选</text><rect x="650" y="190" width="220" height="110" class="box" fill="#f5f3ff" stroke="#8b5cf6"/><text x="760" y="232" text-anchor="middle" class="l">逐元素相乘</text><text x="760" y="263" text-anchor="middle" class="b">选择性激活</text><rect x="945" y="190" width="195" height="110" class="box" fill="#fff1f2" stroke="#e11d48"/><text x="1042" y="232" text-anchor="middle" class="l">down_proj</text><text x="1042" y="263" text-anchor="middle" class="b">回到 hidden size</text><path d="M275 235L345 165M275 265L345 310M565 165L650 225M565 310L650 275M870 245H945" class="f"/></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">激活与损失的反向训练信号</title>
  <desc id="desc">模型表示经过激活函数和模型输出进入损失函数，反向梯度从损失函数回到 logits，再经过激活函数回到上游表示。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#eff6ff"/></linearGradient>
    <style>
      .title { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 30px; font-weight: 700; fill: #0f172a; }
      .sub { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 16px; font-weight: 500; fill: #475569; }
      .group { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 20px; font-weight: 700; fill: #334155; }
      .label { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .small { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 14px; font-weight: 500; fill: #334155; }
      .box { stroke-width: 3; rx: 18; ry: 18; }
      .forward { stroke: #475569; stroke-width: 4; fill: none; }
      .forward-head { fill: #475569; }
      .backward { stroke: #dc2626; stroke-width: 4; stroke-dasharray: 9 7; fill: none; }
      .backward-head { fill: #dc2626; }
      .correspond { stroke: #94a3b8; stroke-width: 2.5; stroke-dasharray: 7 7; fill: none; marker-end: url(#correspond-arrow); }
      .legend { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 14px; font-weight: 500; fill: #475569; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker>
    <marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker>
    <marker id="correspond-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1400" height="700" fill="url(#bg)"/>
  <text x="60" y="58" class="title">反向训练信号：损失梯度与激活门控</text>
  <text x="60" y="88" class="sub">先看前向如何产生 loss，再看梯度如何沿同一条计算路径返回</text>

  <text x="70" y="145" class="group">前向：从表示得到训练目标</text>
  <rect x="70" y="175" width="210" height="90" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="175" y="212" text-anchor="middle" class="label">上游表示</text><text x="175" y="240" text-anchor="middle" class="small">激活函数的输入</text>
  <rect x="370" y="175" width="210" height="90" class="box" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="475" y="212" text-anchor="middle" class="label">激活函数</text><text x="475" y="240" text-anchor="middle" class="small">例如 ReLU</text>
  <rect x="670" y="175" width="210" height="90" class="box" fill="#ecfccb" stroke="#65a30d"/>
  <text x="775" y="212" text-anchor="middle" class="label">模型输出</text><text x="775" y="240" text-anchor="middle" class="small">logits</text>
  <rect x="970" y="175" width="260" height="90" class="box" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="1100" y="212" text-anchor="middle" class="label">损失函数</text><text x="1100" y="240" text-anchor="middle" class="small">比较模型输出与目标</text>
  <path d="M280 220H370M580 220H670M880 220H970" class="forward"/>
  <path d="M358 214L370 220L358 226Z M658 214L670 220L658 226Z M958 214L970 220L958 226Z" class="forward-head"/>

  <text x="70" y="375" class="group">反向：从损失回传训练信号</text>
  <rect x="70" y="405" width="210" height="90" class="box" fill="#fff1f2" stroke="#e11d48"/>
  <text x="175" y="442" text-anchor="middle" class="label">上游梯度</text><text x="175" y="470" text-anchor="middle" class="small">回到表示的梯度</text>
  <rect x="370" y="405" width="210" height="90" class="box" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="475" y="442" text-anchor="middle" class="label">激活梯度</text><text x="475" y="470" text-anchor="middle" class="small">ReLU 门控</text>
  <rect x="670" y="405" width="210" height="90" class="box" fill="#ecfccb" stroke="#65a30d"/>
  <text x="775" y="442" text-anchor="middle" class="label">d(logits)</text><text x="775" y="470" text-anchor="middle" class="small">返回 logits 的梯度</text>
  <rect x="970" y="405" width="260" height="90" class="box" fill="#fff1f2" stroke="#e11d48"/>
  <text x="1100" y="442" text-anchor="middle" class="label">d(loss)</text><text x="1100" y="470" text-anchor="middle" class="small">反向计算起点</text>
  <path d="M970 450H880M670 450H580M370 450H280" class="backward"/>
  <path d="M892 444L880 450L892 456Z M592 444L580 450L592 456Z M292 444L280 450L292 456Z" class="backward-head"/>

  <path d="M1100 265V405" class="correspond"/>
  <path d="M775 265V405" class="correspond"/>
  <path d="M475 265V405" class="correspond"/>
  <text x="1108" y="340" class="small">产生</text>
  <text x="783" y="340" class="small">回传到</text>
  <text x="483" y="340" class="small">门控</text>

  <line x1="70" y1="590" x2="115" y2="590" stroke="#475569" stroke-width="4"/>
  <text x="128" y="595" class="legend">灰色实线：前向计算</text>
  <line x1="370" y1="590" x2="415" y2="590" stroke="#dc2626" stroke-width="4" stroke-dasharray="9 7"/>
  <text x="428" y="595" class="legend">红色虚线箭头：反向梯度</text>
  <line x1="760" y1="590" x2="805" y2="590" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="7 7"/>
  <text x="818" y="595" class="legend">灰色虚线：前向节点与反向节点的对应关系</text>
</svg>

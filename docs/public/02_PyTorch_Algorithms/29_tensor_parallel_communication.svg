<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 560" role="img" aria-labelledby="title desc">
<title id="title">Tensor Parallelism 的通信位置</title><desc id="desc">列并行产生分片输出并通过 All-Gather，行并行产生局部结果并通过 All-Reduce。</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><style>
.title{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:28px;font-weight:700;fill:#0f172a}.sub{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:15px;font-weight:500;fill:#475569}.label{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:18px;font-weight:700;fill:#111827}.small{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:13px;font-weight:500;fill:#334155}.box{stroke-width:3;rx:16;ry:16}.flow{stroke:#475569;stroke-width:4;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
<rect width="1500" height="560" fill="url(#bg)"/><text x="60" y="54" class="title">Tensor Parallelism：切分方向决定通信算子</text><text x="60" y="82" class="sub">Column Parallel 拼接输出，Row Parallel 聚合局部结果</text>
<rect x="80" y="200" width="220" height="100" class="box" fill="#fff7ed" stroke="#f59e0b"/><text x="190" y="240" text-anchor="middle" class="label">局部输入 / 权重</text><text x="190" y="270" text-anchor="middle" class="small">分片后参与计算</text>
<rect x="390" y="110" width="300" height="120" class="box" fill="#eff6ff" stroke="#3b82f6"/><text x="540" y="155" text-anchor="middle" class="label">Column Parallel</text><text x="540" y="185" text-anchor="middle" class="small">得到 Y1、Y2 等分片输出</text><text x="540" y="210" text-anchor="middle" class="small">All-Gather 拼接 Y</text>
<rect x="390" y="350" width="300" height="120" class="box" fill="#f5f3ff" stroke="#8b5cf6"/><text x="540" y="395" text-anchor="middle" class="label">Row Parallel</text><text x="540" y="425" text-anchor="middle" class="small">得到局部结果 Y1、Y2</text><text x="540" y="450" text-anchor="middle" class="small">All-Reduce 求和 Y</text>
<rect x="880" y="200" width="250" height="100" class="box" fill="#ecfccb" stroke="#65a30d"/><text x="1005" y="240" text-anchor="middle" class="label">下一层输入</text><text x="1005" y="270" text-anchor="middle" class="small">可继续保留局部布局</text>
<rect x="1220" y="200" width="210" height="100" class="box" fill="#fff1f2" stroke="#e11d48"/><text x="1325" y="240" text-anchor="middle" class="label">完整输出</text><text x="1325" y="270" text-anchor="middle" class="small">Y = XW</text>
<path d="M300 230C340 190 350 170 390 170" class="flow"/><path d="M300 270C340 370 350 410 390 410" class="flow"/><path d="M690 170C770 170 800 230 880 230" class="flow"/><path d="M690 410C770 410 800 270 880 270" class="flow"/><path d="M1130 250L1220 250" class="flow"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">RMSNorm Block Diagram</title>
  <desc id="desc">RMSNorm normalizes each token across the hidden dimension and sits before attention and MLP branches.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <style>
      .title { font: 700 30px "Inter", "Noto Sans SC", sans-serif; fill: #0f172a; }
      .sub { font: 500 16px "Inter", "Noto Sans SC", sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke-width: 3; rx: 18; ry: 18; }
      .label { font: 700 18px "Inter", "Noto Sans SC", sans-serif; fill: #111827; }
      .small { font: 500 13px "Inter", "Noto Sans SC", sans-serif; fill: #334155; }
      .arrow { stroke: #475569; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .accent { stroke: #2563eb; stroke-width: 4; fill: none; marker-end: url(#arrowBlue); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1400" height="720" fill="url(#bg)"/>
  <text x="64" y="66" class="title">RMSNorm: per-token hidden state normalization</text>
  <text x="64" y="96" class="sub">Normalize per token across hidden dimension, then scale.</text>

  <rect x="70" y="188" width="230" height="90" class="box" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="185" y="225" text-anchor="middle" class="label">Input hidden state</text>
  <text x="185" y="250" text-anchor="middle" class="small">x [B, T, D]</text>

  <rect x="370" y="172" width="260" height="122" class="box" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="500" y="208" text-anchor="middle" class="label">RMS over D</text>
  <text x="500" y="236" text-anchor="middle" class="small">sqrt(mean(x^2) + eps)</text>
  <text x="500" y="258" text-anchor="middle" class="small">no mean subtraction</text>

  <rect x="690" y="188" width="230" height="90" class="box" fill="#ecfccb" stroke="#65a30d"/>
  <text x="805" y="225" text-anchor="middle" class="label">Scale by weight</text>
  <text x="805" y="250" text-anchor="middle" class="small">learned gamma</text>

  <rect x="1020" y="172" width="300" height="122" class="box" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="1170" y="208" text-anchor="middle" class="label">Stable output</text>
  <text x="1170" y="236" text-anchor="middle" class="small">same shape as input</text>
  <text x="1170" y="258" text-anchor="middle" class="small">same token, stable scale</text>

  <path d="M 300 233 L 370 233" class="arrow"/>
  <path d="M 630 233 L 690 233" class="accent"/>
  <path d="M 920 233 L 1020 233" class="arrow"/>

  <rect x="160" y="390" width="1080" height="170" class="box" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="700" y="430" text-anchor="middle" class="label">Block position</text>
  <text x="700" y="472" text-anchor="middle" class="small">x -> RMSNorm -> Attention -> residual</text>
  <text x="700" y="512" text-anchor="middle" class="small">h -> RMSNorm -> MLP / SwiGLU -> residual</text>
</svg>

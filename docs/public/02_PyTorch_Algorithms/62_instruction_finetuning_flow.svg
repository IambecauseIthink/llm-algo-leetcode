<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <rect width="1000" height="300" fill="#fffaf5"/>
  <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#431407} .box{fill:#fff;stroke:#ea580c;stroke-width:2;rx:14} .arrow{stroke:#9a3412;stroke-width:3;marker-end:url(#m)}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#9a3412"/></marker></defs>
  <text x="500" y="38" text-anchor="middle" font-size="24" font-weight="700">指令微调项目实验流程</text>
  <rect class="box" x="35" y="105" width="190" height="100"/><text x="130" y="137" text-anchor="middle" font-size="18">定义任务</text><text x="130" y="159" text-anchor="middle" font-size="13">输入：数据与配置</text><text x="130" y="178" text-anchor="middle" font-size="13">输出：回答与报告</text><text x="130" y="197" text-anchor="middle" font-size="13">失败：质量或资源越界</text>
  <rect class="box" x="270" y="105" width="190" height="100"/><text x="365" y="140" text-anchor="middle" font-size="18">固定条件</text><text x="365" y="174" text-anchor="middle" font-size="16">模型、数据、模板、seed</text>
  <rect class="box" x="505" y="105" width="190" height="100"/><text x="600" y="140" text-anchor="middle" font-size="18">建立对照</text><text x="600" y="174" text-anchor="middle" font-size="16">基础模型与微调模型</text>
  <rect class="box" x="740" y="105" width="190" height="100"/><text x="835" y="140" text-anchor="middle" font-size="18">汇总证据</text><text x="835" y="174" text-anchor="middle" font-size="16">数据、质量、资源、产物</text>
  <path class="arrow" d="M225 155 H265"/><path class="arrow" d="M460 155 H500"/><path class="arrow" d="M695 155 H735"/>
  <text x="500" y="255" text-anchor="middle" font-size="16" fill="#7c2d12">CPU 检查数据与报告逻辑；GPU 补充模型效果和训练资源</text>
</svg>

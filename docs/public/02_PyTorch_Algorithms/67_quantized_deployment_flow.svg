<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">量化推理部署决策流程</title>
  <desc id="desc">从浮点 baseline 到真实量化 artifact，再到统一指标和部署决策。</desc>
  <defs><marker id="a67" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><style>.t{font:700 30px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.s{font:500 17px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.h{font:700 20px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#111827}.b{font:500 15px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}.box{stroke-width:2.5;rx:18}.l{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a67)}</style></defs>
  <rect width="1200" height="560" fill="#f8fafc"/><text x="60" y="58" class="t">67：量化 artifact 是否值得进入部署</text><text x="60" y="90" class="s">先配对测量，再用格式、kernel、性能、显存和质量共同做决定。</text>
  <rect x="55" y="190" width="190" height="145" class="box" fill="#dbeafe" stroke="#2563eb"/><text x="112" y="238" class="h">G0 浮点基线</text><text x="82" y="276" class="b">同模型 / workload</text><text x="82" y="302" class="s">记录速度、显存、质量</text>
  <rect x="300" y="190" width="190" height="145" class="box" fill="#fef3c7" stroke="#d97706"/><text x="358" y="238" class="h">G1 真实量化</text><text x="327" y="276" class="b">加载 GPTQ / AWQ</text><text x="327" y="302" class="s">确认格式与 kernel</text>
  <rect x="545" y="190" width="190" height="145" class="box" fill="#dcfce7" stroke="#16a34a"/><text x="598" y="238" class="h">统一指标</text><text x="572" y="276" class="b">TTFT / 吞吐 / 显存</text><text x="572" y="302" class="s">输出质量与误差</text>
  <rect x="790" y="190" width="190" height="145" class="box" fill="#fce7f3" stroke="#db2777"/><text x="837" y="238" class="h">G2 对照</text><text x="812" y="276" class="b">另一格式或 backend</text><text x="812" y="302" class="s">一次只改变一项</text>
  <rect x="1020" y="190" width="130" height="145" class="box" fill="#e0e7ff" stroke="#4f46e5"/><text x="1040" y="238" class="h">决策</text><text x="1040" y="276" class="b">接受</text><text x="1040" y="302" class="b">调优 / 拒绝</text>
  <path d="M245 262H300" class="l"/><path d="M490 262H545" class="l"/><path d="M735 262H790" class="l"/><path d="M980 262H1020" class="l"/><text x="60" y="430" class="s">G0/G1 的 workload、硬件、backend 和 cache policy 固定；GGUF 走独立 backend 路径，不直接套用 GPTQ/AWQ 启动方式。</text><text x="60" y="470" class="s">没有真实 artifact、kernel 证据或任务质量时，只能报告链路检查，不能宣称量化收益。</text>
</svg>

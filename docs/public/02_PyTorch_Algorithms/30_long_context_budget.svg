<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="100" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">Long Context Fine-Tuning Budget</text>
  <text x="88" y="132" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">Long-context tuning is a balance between target length, data organization and memory budget, not just a larger sequence length.</text>
  <rect x="112" y="208" width="214" height="94" rx="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="146" y="244" fill="#1E3A8A" font-size="22" font-family="Arial, sans-serif" font-weight="700">Target Length</text>
  <text x="138" y="274" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">4k, 8k, 16k or beyond</text>
  <text x="138" y="296" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">must be fixed first</text>
  <rect x="380" y="208" width="214" height="94" rx="18" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <text x="420" y="244" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">Data Shape</text>
  <text x="410" y="274" fill="#92400E" font-size="16" font-family="Arial, sans-serif">packing, truncation,</text>
  <text x="410" y="296" fill="#92400E" font-size="16" font-family="Arial, sans-serif">chunk boundary rules</text>
  <rect x="648" y="208" width="214" height="94" rx="18" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="684" y="244" fill="#166534" font-size="22" font-family="Arial, sans-serif" font-weight="700">Memory Budget</text>
  <text x="674" y="274" fill="#166534" font-size="16" font-family="Arial, sans-serif">micro-batch, accum,</text>
  <text x="674" y="296" fill="#166534" font-size="16" font-family="Arial, sans-serif">step time, peak mem</text>
  <rect x="916" y="208" width="230" height="94" rx="18" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <text x="956" y="244" fill="#9D174D" font-size="22" font-family="Arial, sans-serif" font-weight="700">Usable Outcome</text>
  <text x="948" y="274" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">better long-context quality</text>
  <text x="948" y="296" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">under stable training</text>
  <path d="M326 255H380" stroke="#374151" stroke-width="3"/>
  <path d="M594 255H648" stroke="#374151" stroke-width="3"/>
  <path d="M862 255H916" stroke="#374151" stroke-width="3"/>
  <path d="M365 247L380 255L365 263" fill="#374151"/>
  <path d="M633 247L648 255L633 263" fill="#374151"/>
  <path d="M901 247L916 255L901 263" fill="#374151"/>
  <rect x="108" y="378" width="1052" height="128" rx="22" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="136" y="418" fill="#111827" font-size="22" font-family="Arial, sans-serif" font-weight="700">What to compare</text>
  <text x="136" y="452" fill="#374151" font-size="18" font-family="Arial, sans-serif">baseline max length vs target length, packing rule, truncation rule, peak memory, step time and final quality under the same workload.</text>
  <text x="136" y="482" fill="#374151" font-size="18" font-family="Arial, sans-serif">If longer context only produces memory blow-up without quality gain, the problem is likely data organization or budget, not ambition.</text>
  <rect x="108" y="548" width="1052" height="78" rx="18" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="136" y="582" fill="#1E3A8A" font-size="18" font-family="Arial, sans-serif">Page 30 uses this figure to force one rule: length, data shape and memory budget must be defined together, otherwise every comparison drifts.</text>
</svg>

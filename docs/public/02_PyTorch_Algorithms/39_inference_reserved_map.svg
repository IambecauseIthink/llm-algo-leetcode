<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="100" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">Reserved Inference Slot Map</text>
  <text x="88" y="132" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">A reserved inference page should still route readers and define the future boundary of the slot.</text>
  <rect x="118" y="210" width="238" height="104" rx="20" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="172" y="248" fill="#1E3A8A" font-size="22" font-family="Arial, sans-serif" font-weight="700">Existing Line</text>
  <text x="146" y="280" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">34 prefix and chunks</text>
  <text x="146" y="302" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">35/36/37 decode and cache</text>
  <rect x="458" y="188" width="364" height="148" rx="22" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="514" y="226" fill="#92400E" font-size="24" font-family="Arial, sans-serif" font-weight="700">Reserved Slot 39</text>
  <text x="492" y="262" fill="#92400E" font-size="17" font-family="Arial, sans-serif">must define a future bottleneck</text>
  <text x="492" y="292" fill="#92400E" font-size="17" font-family="Arial, sans-serif">that is not already covered by cache,</text>
  <text x="492" y="322" fill="#92400E" font-size="17" font-family="Arial, sans-serif">scheduling, or deployment pages</text>
  <rect x="924" y="210" width="238" height="104" rx="20" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="984" y="248" fill="#166534" font-size="22" font-family="Arial, sans-serif" font-weight="700">Future Role</text>
  <text x="954" y="280" fill="#166534" font-size="16" font-family="Arial, sans-serif">new mechanism page</text>
  <text x="954" y="302" fill="#166534" font-size="16" font-family="Arial, sans-serif">or project bridge page</text>
  <path d="M356 262H458" stroke="#374151" stroke-width="3"/>
  <path d="M822 262H924" stroke="#374151" stroke-width="3"/>
  <path d="M443 254L458 262L443 270" fill="#374151"/>
  <path d="M909 254L924 262L909 270" fill="#374151"/>
  <rect x="118" y="396" width="1044" height="156" rx="22" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="146" y="438" fill="#111827" font-size="22" font-family="Arial, sans-serif" font-weight="700">What a useful reserved page already tells the reader</text>
  <text x="146" y="472" fill="#374151" font-size="18" font-family="Arial, sans-serif">1. What class of inference problem is still missing.</text>
  <text x="146" y="500" fill="#374151" font-size="18" font-family="Arial, sans-serif">2. Why this slot should not collapse into neighboring pages.</text>
  <text x="146" y="528" fill="#374151" font-size="18" font-family="Arial, sans-serif">3. Where to read now if the future topic has not been filled yet.</text>
  <rect x="118" y="576" width="1044" height="50" rx="18" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
  <text x="146" y="607" fill="#075985" font-size="18" font-family="Arial, sans-serif">Page 39 stays valuable only if it communicates future boundary and routing instead of being dead empty space.</text>
</svg>

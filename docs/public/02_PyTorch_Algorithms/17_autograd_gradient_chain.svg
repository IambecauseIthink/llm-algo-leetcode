<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 560" role="img" aria-labelledby="title desc">
  <title id="title">Attention 反向传播的梯度链</title>
  <desc id="desc">上游梯度依次经过矩阵乘法、Softmax 和缩放点积回到 V、P、S、Q、K。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eff6ff"/></linearGradient>
    <style>
      .title { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 28px; font-weight: 700; fill: #0f172a; }
      .sub { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 15px; font-weight: 500; fill: #475569; }
      .label { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .small { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 500; fill: #334155; }
      .box { stroke-width: 3; rx: 16; ry: 16; }
      .flow { stroke: #dc2626; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker>
  </defs>
  <rect width="1500" height="560" fill="url(#bg)"/>
  <text x="60" y="54" class="title">Attention backward：梯度沿计算依赖逆向传播</text>
  <text x="60" y="82" class="sub">从 dO 出发，先拆开 O = P·V，再穿过 Softmax 和缩放点积回到 Q、K、V</text>
  <rect x="80" y="210" width="170" height="90" class="box" fill="#fff1f2" stroke="#e11d48"/><text x="165" y="246" text-anchor="middle" class="label">dO</text><text x="165" y="273" text-anchor="middle" class="small">上游梯度</text>
  <rect x="330" y="150" width="190" height="90" class="box" fill="#eff6ff" stroke="#3b82f6"/><text x="425" y="186" text-anchor="middle" class="label">dV</text><text x="425" y="213" text-anchor="middle" class="small">由 O = P·V 得到</text>
  <rect x="330" y="330" width="190" height="90" class="box" fill="#eff6ff" stroke="#3b82f6"/><text x="425" y="366" text-anchor="middle" class="label">dP</text><text x="425" y="393" text-anchor="middle" class="small">继续穿过 Softmax</text>
  <rect x="650" y="330" width="190" height="90" class="box" fill="#f5f3ff" stroke="#8b5cf6"/><text x="745" y="366" text-anchor="middle" class="label">dS</text><text x="745" y="393" text-anchor="middle" class="small">Softmax 的梯度</text>
  <rect x="970" y="250" width="190" height="90" class="box" fill="#ecfccb" stroke="#65a30d"/><text x="1065" y="286" text-anchor="middle" class="label">dQ</text><text x="1065" y="313" text-anchor="middle" class="small">由 dS 回到 Q</text>
  <rect x="970" y="420" width="190" height="90" class="box" fill="#ecfccb" stroke="#65a30d"/><text x="1065" y="456" text-anchor="middle" class="label">dK</text><text x="1065" y="483" text-anchor="middle" class="small">由 dS 回到 K</text>
  <path d="M250 240 C285 210 295 195 330 195" class="flow"/><path d="M250 270 C285 330 295 375 330 375" class="flow"/><path d="M520 375 L650 375" class="flow"/><path d="M840 365 C900 330 915 300 970 295" class="flow"/><path d="M840 395 C900 440 915 465 970 465" class="flow"/>
  <text x="560" y="135" class="small" fill="#b91c1c">矩阵乘法拆分</text><text x="860" y="235" class="small" fill="#b91c1c">缩放点积</text>
</svg>

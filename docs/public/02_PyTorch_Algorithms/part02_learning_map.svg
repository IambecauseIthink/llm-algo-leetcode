<rect x="235" y="135" width="220" height="190" fill="#dbeafe" class="box" stroke="#3b82f6"/><text x="345" y="178" text-anchor="middle" class="head">组件表达</text><text x="345" y="220" text-anchor="middle" class="body">张量、Embedding</text><text x="345" y="250" text-anchor="middle" class="body">RoPE、Attention</text><text x="345" y="291" text-anchor="middle" class="small">00–04</text>

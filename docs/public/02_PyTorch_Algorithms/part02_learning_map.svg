<title id="title">Part 02 大模型算法实战知识地图</title>
<desc id="desc">展示 Part 02 从基础组件、模型结构、训练对齐、系统优化到项目验证的学习范围，以及与前置和后续 Part 的联系。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>
.title{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:30px;font-weight:700;fill:#0f172a}.sub{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:16px;font-weight:500;fill:#475569}.group{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:16px;font-weight:700;fill:#64748b}.head{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:19px;font-weight:700;fill:#111827}.body{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:500;fill:#334155}.small{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:13px;font-weight:500;fill:#475569}.box{stroke-width:2.5;rx:16}.line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}
</style></defs>
<rect width="1500" height="650" fill="#f8fafc"/><text x="70" y="58" class="title">Part 02：把大模型算法写成可验证的 PyTorch 实现</text><text x="70" y="91" class="sub">从组件正确性出发，经过模型与训练机制，进入推理、显存、量化、并行和项目验证；全程关注语义、资源代价和可复核证据。</text>

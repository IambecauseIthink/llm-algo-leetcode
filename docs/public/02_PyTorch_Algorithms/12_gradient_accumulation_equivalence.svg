<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
<title id="t">Full batch 与梯度累积的可比条件</title><desc id="d">完整 batch 和梯度累积分别处理同一逻辑 batch，只有在数据、损失缩放和更新节奏对齐后，参数更新结果才具有可比性。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><style>
.h{font:700 28px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.s{font:500 15px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.l{font:700 18px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#111827}.b{font:500 14px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}.box{stroke-width:3;rx:16}.f{stroke:#475569;stroke-width:4;fill:none;marker-end:url(#a)}
</style></defs>
<rect width="1200" height="560" fill="#f8fafc"/>
<text x="50" y="52" class="h">Full batch 与梯度累积：先对齐，再比较</text>
<text x="50" y="82" class="s">第二张图只说明等价条件，不重复主图的执行流程，也不代表所有训练设置都天然等价。</text>

<rect x="45" y="220" width="190" height="110" class="box" fill="#eff6ff" stroke="#3b82f6"/>
<text x="140" y="263" text-anchor="middle" class="l">同一逻辑 batch</text><text x="140" y="297" text-anchor="middle" class="b">样本与顺序一致</text>
<path d="M235 275H300" class="f"/>

<rect x="300" y="135" width="240" height="110" class="box" fill="#e0f2fe" stroke="#0284c7"/>
<text x="420" y="178" text-anchor="middle" class="l">Full batch</text><text x="420" y="212" text-anchor="middle" class="b">一次 forward / backward</text>
<rect x="300" y="325" width="240" height="110" class="box" fill="#fef3c7" stroke="#d97706"/>
<text x="420" y="368" text-anchor="middle" class="l">Gradient accumulation</text><text x="420" y="402" text-anchor="middle" class="b">K 次 micro-step 后更新</text>
<path d="M540 190 C590 190 600 235 650 255" class="f"/><path d="M540 380 C590 380 600 335 650 315" class="f"/>

<rect x="650" y="185" width="300" height="200" class="box" fill="#ecfccb" stroke="#65a30d"/>
<text x="800" y="225" text-anchor="middle" class="l">比较前先对齐</text>
<text x="700" y="270" class="b">同一 reduction 与 loss / K</text>
<text x="700" y="305" class="b">累积完成后只更新一次</text>
<text x="700" y="340" class="b">随机状态与 scheduler 节奏一致</text>
<path d="M950 285H1010" class="f"/>

<rect x="1010" y="220" width="145" height="110" class="box" fill="#f5f3ff" stroke="#8b5cf6"/>
<text x="1082" y="263" text-anchor="middle" class="l">可比结果</text><text x="1082" y="297" text-anchor="middle" class="b">梯度与参数更新接近</text>
<text x="600" y="490" text-anchor="middle" class="s">若 reduction、随机性或更新节奏不同，只能说明两种路径的结果不同，不能直接归因于显存策略。</text>
</svg>

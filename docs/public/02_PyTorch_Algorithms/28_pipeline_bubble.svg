<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 620" role="img" aria-labelledby="title desc">
<title id="title">1F1B 流水线与 Bubble</title><desc id="desc">多个 micro-batch 在 pipeline stage 之间交错执行，灌入和排空阶段形成空闲气泡。</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#ecfeff"/></linearGradient><style>
.title{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:28px;font-weight:700;fill:#0f172a}.sub{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:15px;font-weight:500;fill:#475569}.label{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:17px;font-weight:700;fill:#111827}.small{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:13px;font-weight:500;fill:#334155}.cell{stroke:#ffffff;stroke-width:3;rx:6;ry:6}.bubble{fill:#fef3c7;stroke:#f59e0b;stroke-width:2;rx:6;ry:6}</style></defs>
<rect width="1500" height="620" fill="url(#bg)"/><text x="60" y="54" class="title">1F1B：micro-batch 越过 stage 时的时间轴</text><text x="60" y="82" class="sub">前向先灌入流水线，反向再排空；黄色空档就是 bubble</text>
<text x="80" y="145" class="label">Stage / 时间步</text>
<text x="300" y="145" class="small">1</text><text x="410" y="145" class="small">2</text><text x="520" y="145" class="small">3</text><text x="630" y="145" class="small">4</text><text x="740" y="145" class="small">5</text><text x="850" y="145" class="small">6</text><text x="960" y="145" class="small">7</text><text x="1070" y="145" class="small">8</text><text x="1180" y="145" class="small">9</text>
<text x="80" y="205" class="label">Stage 1</text><text x="80" y="285" class="label">Stage 2</text><text x="80" y="365" class="label">Stage 3</text><text x="80" y="445" class="label">Stage 4</text>
<g fill="#bfdbfe"><rect x="270" y="170" width="90" height="55" class="cell"/><rect x="380" y="170" width="90" height="55" class="cell"/><rect x="490" y="170" width="90" height="55" class="cell"/><rect x="600" y="170" width="90" height="55" class="cell"/></g>
<g fill="#bbf7d0"><rect x="380" y="250" width="90" height="55" class="cell"/><rect x="490" y="250" width="90" height="55" class="cell"/><rect x="600" y="250" width="90" height="55" class="cell"/><rect x="710" y="250" width="90" height="55" class="cell"/></g>
<g fill="#ddd6fe"><rect x="490" y="330" width="90" height="55" class="cell"/><rect x="600" y="330" width="90" height="55" class="cell"/><rect x="710" y="330" width="90" height="55" class="cell"/><rect x="820" y="330" width="90" height="55" class="cell"/></g>
<g fill="#fecdd3"><rect x="600" y="410" width="90" height="55" class="cell"/><rect x="710" y="410" width="90" height="55" class="cell"/><rect x="820" y="410" width="90" height="55" class="cell"/><rect x="930" y="410" width="90" height="55" class="cell"/></g>
<text x="295" y="204" class="small">F1</text><text x="405" y="204" class="small">F2</text><text x="515" y="204" class="small">F3</text><text x="625" y="204" class="small">F4</text><text x="405" y="284" class="small">F1</text><text x="515" y="284" class="small">F2</text><text x="625" y="284" class="small">F3</text><text x="735" y="284" class="small">B1</text><text x="515" y="364" class="small">F1</text><text x="625" y="364" class="small">F2</text><text x="735" y="364" class="small">B1</text><text x="845" y="364" class="small">B2</text><text x="625" y="444" class="small">F1</text><text x="735" y="444" class="small">B1</text><text x="845" y="444" class="small">B2</text><text x="955" y="444" class="small">B3</text>
<rect x="270" y="490" width="90" height="55" class="bubble"/><rect x="380" y="490" width="90" height="55" class="bubble"/><rect x="490" y="490" width="90" height="55" class="bubble"/><text x="315" y="525" text-anchor="middle" class="small">空闲</text><text x="425" y="525" text-anchor="middle" class="small">bubble</text><text x="535" y="525" text-anchor="middle" class="small">灌入阶段</text>
</svg>

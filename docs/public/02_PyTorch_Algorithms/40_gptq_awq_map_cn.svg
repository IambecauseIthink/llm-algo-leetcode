<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">GPTQ 与 AWQ 的校准路径</title>
  <desc id="desc">校准数据经过统计后分别进入 GPTQ 误差重构或 AWQ 敏感通道保护，最终生成部署 artifact。</desc>
  <defs><marker id="a40" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><style>.t{font:700 30px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.s{font:500 17px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.h{font:700 21px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#111827}.b{font:500 16px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}.box{stroke-width:2.5;rx:18}.l{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a40)}</style></defs>
  <rect width="1200" height="600" fill="#fffbeb"/><text x="60" y="58" class="t">GPTQ / AWQ：同一部署目标，不同校准信号</text><text x="60" y="90" class="s">两者都属于后训练权重量化；本节用模拟解释决策信号，67 再验证真实 artifact。</text>
  <rect x="60" y="205" width="220" height="150" class="box" fill="#dbeafe" stroke="#2563eb"/><text x="112" y="255" class="h">校准数据</text><text x="95" y="293" class="b">输入样本</text><text x="95" y="322" class="s">暴露层输出与激活分布</text>
  <rect x="360" y="130" width="260" height="150" class="box" fill="#fef3c7" stroke="#d97706"/><text x="454" y="180" class="h">GPTQ</text><text x="400" y="218" class="b">重构误差与误差补偿</text><text x="400" y="247" class="s">尽量保持层输出</text>
  <rect x="360" y="350" width="260" height="150" class="box" fill="#dcfce7" stroke="#16a34a"/><text x="454" y="400" class="h">AWQ</text><text x="400" y="438" class="b">激活感知与敏感通道</text><text x="400" y="467" class="s">保护重要通道</text>
  <rect x="730" y="205" width="310" height="150" class="box" fill="#fce7f3" stroke="#db2777"/><text x="818" y="255" class="h">量化 artifact</text><text x="785" y="293" class="b">分组、scale、格式与元数据</text><text x="785" y="322" class="s">交给目标 backend 加载</text>
  <path d="M280 260L360 205" class="l"/><path d="M280 300L360 425" class="l"/><path d="M620 205L730 260" class="l"/><path d="M620 425L730 300" class="l"/><text x="60" y="555" class="s">CPU 可验证：校准统计、分组和重构误差；GPU/backend 才能验证 kernel、显存、速度和任务质量。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 670" role="img" aria-labelledby="title desc">
  <title id="title">Weight-only quantization pipeline</title>
  <desc id="desc">Shows float weights being compressed to 8-bit storage and dequantized back before matrix multiplication with activations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fefce8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 30px "Inter", "Noto Sans SC", sans-serif; fill: #0f172a; }
      .sub { font: 500 16px "Inter", "Noto Sans SC", sans-serif; fill: #475569; }
      .label { font: 700 18px "Inter", "Noto Sans SC", sans-serif; fill: #111827; }
      .small { font: 500 14px "Inter", "Noto Sans SC", sans-serif; fill: #334155; }
      .box { fill: #ffffff; stroke-width: 3; rx: 16; ry: 16; }
      .arrow { stroke: #475569; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1660" height="670" fill="url(#bg)"/>
  <text x="64" y="66" class="title">Weight-only quantization: store smaller weights, run the same linear path</text>
  <text x="64" y="96" class="sub">Compress weights to 8-bit storage, keep scales, and dequantize right before the linear layer runs.</text>

  <rect x="80" y="180" width="260" height="120" class="box" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="210" y="216" text-anchor="middle" class="label">Float weights</text>
  <text x="210" y="246" text-anchor="middle" class="small">W fp16 / fp32</text>
  <text x="210" y="272" text-anchor="middle" class="small">original storage</text>

  <rect x="410" y="180" width="260" height="120" class="box" fill="#ecfccb" stroke="#65a30d"/>
  <text x="540" y="216" text-anchor="middle" class="label">Quantize</text>
  <text x="540" y="246" text-anchor="middle" class="small">absmax + scale</text>
  <text x="540" y="272" text-anchor="middle" class="small">W -> int8 + scale</text>

  <rect x="740" y="180" width="260" height="120" class="box" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="870" y="216" text-anchor="middle" class="label">8-bit weights</text>
  <text x="870" y="246" text-anchor="middle" class="small">compact storage</text>
  <text x="870" y="272" text-anchor="middle" class="small">less memory traffic</text>

  <rect x="1070" y="180" width="260" height="120" class="box" fill="#fff1f2" stroke="#db2777"/>
  <text x="1200" y="216" text-anchor="middle" class="label">Dequantize</text>
  <text x="1200" y="246" text-anchor="middle" class="small">int8 + scale -> float</text>
  <text x="1200" y="272" text-anchor="middle" class="small">before matmul</text>

  <rect x="1400" y="180" width="190" height="120" class="box" fill="#ecfeff" stroke="#0891b2"/>
  <text x="1495" y="216" text-anchor="middle" class="label">Linear op</text>
  <text x="1495" y="246" text-anchor="middle" class="small">x @ W^T</text>
  <text x="1495" y="272" text-anchor="middle" class="small">same forward path</text>

  <path d="M 340 240 L 410 240" class="arrow"/>
  <path d="M 670 240 L 740 240" class="arrow"/>
  <path d="M 1000 240 L 1070 240" class="arrow"/>
  <path d="M 1330 240 L 1400 240" class="arrow"/>

  <rect x="90" y="360" width="1470" height="130" class="box" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="120" y="398" class="label">Key mechanism</text>
  <text x="120" y="432" class="small">Weights are stored in int8 form, but activations stay in normal precision and matmul still runs after dequantization.</text>
  <text x="120" y="462" class="small">The scale is part of the stored representation, so dequantization can rebuild approximate float weights on demand.</text>

  <rect x="90" y="530" width="1470" height="90" class="box" fill="#fffef2" stroke="#cbd5e1"/>
  <text x="120" y="568" class="label">Read it in one line</text>
  <text x="120" y="602" class="small">This page is about shrinking weight storage and bandwidth, not changing the basic linear-layer computation graph.</text>
</svg>

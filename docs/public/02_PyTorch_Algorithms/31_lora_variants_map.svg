<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="100" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">LoRA Variant Comparison Map</text>
  <text x="88" y="132" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">LoRA variants should be compared by trade-offs, not by names alone. The baseline must stay fixed while rank, allocation and parameterization change.</text>
  <rect x="102" y="210" width="210" height="96" rx="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="146" y="246" fill="#1E3A8A" font-size="22" font-family="Arial, sans-serif" font-weight="700">Standard LoRA</text>
  <text x="132" y="276" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">fixed rank, simple</text>
  <text x="132" y="298" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">trainable branch</text>
  <rect x="364" y="176" width="230" height="96" rx="18" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <text x="406" y="212" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">Capacity Variant</text>
  <text x="392" y="242" fill="#92400E" font-size="16" font-family="Arial, sans-serif">dynamic rank, per-layer</text>
  <text x="392" y="264" fill="#92400E" font-size="16" font-family="Arial, sans-serif">allocation, larger flexibility</text>
  <rect x="364" y="336" width="230" height="96" rx="18" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="404" y="372" fill="#166534" font-size="22" font-family="Arial, sans-serif" font-weight="700">Parameterization</text>
  <text x="392" y="402" fill="#166534" font-size="16" font-family="Arial, sans-serif">different scaling, routing</text>
  <text x="392" y="424" fill="#166534" font-size="16" font-family="Arial, sans-serif">or decomposition rules</text>
  <rect x="658" y="210" width="220" height="96" rx="18" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <text x="708" y="246" fill="#9D174D" font-size="22" font-family="Arial, sans-serif" font-weight="700">Trade-offs</text>
  <text x="688" y="276" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">trainable params, stability,</text>
  <text x="688" y="298" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">merge cost, complexity</text>
  <rect x="942" y="210" width="204" height="96" rx="18" fill="#E9D5FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="982" y="246" fill="#5B21B6" font-size="22" font-family="Arial, sans-serif" font-weight="700">Decision</text>
  <text x="970" y="276" fill="#5B21B6" font-size="16" font-family="Arial, sans-serif">keep standard, tune,</text>
  <text x="970" y="298" fill="#5B21B6" font-size="16" font-family="Arial, sans-serif">or switch variant</text>
  <path d="M312 258H364" stroke="#374151" stroke-width="3"/>
  <path d="M312 258C340 258 340 224 364 224" stroke="#374151" stroke-width="3" fill="none"/>
  <path d="M312 258C340 258 340 384 364 384" stroke="#374151" stroke-width="3" fill="none"/>
  <path d="M594 224C638 224 638 258 658 258" stroke="#374151" stroke-width="3" fill="none"/>
  <path d="M594 384C638 384 638 258 658 258" stroke="#374151" stroke-width="3" fill="none"/>
  <path d="M878 258H942" stroke="#374151" stroke-width="3"/>
  <rect x="104" y="502" width="1052" height="120" rx="22" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="132" y="540" fill="#111827" font-size="22" font-family="Arial, sans-serif" font-weight="700">What must stay fixed</text>
  <text x="132" y="574" fill="#374151" font-size="18" font-family="Arial, sans-serif">base model, target layers, dataset and evaluation task must stay fixed; otherwise the comparison is no longer about the variant itself.</text>
  <text x="132" y="604" fill="#374151" font-size="18" font-family="Arial, sans-serif">Page 31 uses this map to turn “variant theory” into a structured comparison table rather than a list of names.</text>
</svg>

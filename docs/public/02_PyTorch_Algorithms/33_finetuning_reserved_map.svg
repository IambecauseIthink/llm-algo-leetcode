<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="100" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">Reserved Fine-Tuning Slot Map</text>
  <text x="88" y="132" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">A reserved slot is not an empty page. It should already explain what kind of future content it is keeping space for and how it differs from neighboring pages.</text>
  <rect x="118" y="218" width="232" height="96" rx="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="158" y="254" fill="#1E3A8A" font-size="22" font-family="Arial, sans-serif" font-weight="700">Previous Pages</text>
  <text x="148" y="284" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">30 long context</text>
  <text x="148" y="306" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">31 variants / 32 data</text>
  <rect x="458" y="186" width="364" height="156" rx="22" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="502" y="226" fill="#92400E" font-size="24" font-family="Arial, sans-serif" font-weight="700">Reserved Slot 33</text>
  <text x="490" y="264" fill="#92400E" font-size="17" font-family="Arial, sans-serif">define future role first</text>
  <text x="490" y="294" fill="#92400E" font-size="17" font-family="Arial, sans-serif">mechanism page, method page, or experiment page?</text>
  <text x="490" y="324" fill="#92400E" font-size="17" font-family="Arial, sans-serif">keep boundary clear before filling content</text>
  <rect x="930" y="218" width="232" height="96" rx="18" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="974" y="254" fill="#166534" font-size="22" font-family="Arial, sans-serif" font-weight="700">Future Pages</text>
  <text x="958" y="284" fill="#166534" font-size="16" font-family="Arial, sans-serif">advanced fine-tuning</text>
  <text x="958" y="306" fill="#166534" font-size="16" font-family="Arial, sans-serif">or project bridge</text>
  <path d="M350 266H458" stroke="#374151" stroke-width="3"/>
  <path d="M822 266H930" stroke="#374151" stroke-width="3"/>
  <path d="M443 258L458 266L443 274" fill="#374151"/>
  <path d="M915 258L930 266L915 274" fill="#374151"/>
  <rect x="118" y="406" width="1044" height="170" rx="22" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="146" y="446" fill="#111827" font-size="22" font-family="Arial, sans-serif" font-weight="700">What a good reserved page already does</text>
  <text x="146" y="480" fill="#374151" font-size="18" font-family="Arial, sans-serif">1. It states the future role of the slot.</text>
  <text x="146" y="508" fill="#374151" font-size="18" font-family="Arial, sans-serif">2. It explains how it differs from surrounding pages.</text>
  <text x="146" y="536" fill="#374151" font-size="18" font-family="Arial, sans-serif">3. It tells the reader where to go now if the content is not filled yet.</text>
  <rect x="118" y="602" width="1044" height="24" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="142" y="619" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">Page 33 uses this figure to show that “reserved” still needs to communicate boundary and routing, otherwise it becomes dead space.</text>
</svg>

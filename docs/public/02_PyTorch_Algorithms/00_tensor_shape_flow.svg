<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">张量形状从基础操作连接到 Attention</title><desc id="desc">展示张量维度、重排、Embedding 输出与 Attention 输入之间的关系。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>
.title{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:27px;font-weight:700;fill:#0f172a}.sub{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:15px;fill:#475569}.head{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:18px;font-weight:700;fill:#111827}.body{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:14px;fill:#334155}.small{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:13px;fill:#475569}.box{stroke-width:2.5;rx:15}.line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}
</style></defs><rect width="1200" height="430" fill="#f8fafc"/><text x="55" y="52" class="title">张量形状：从重排到模型输入</text><text x="55" y="82" class="sub">先读懂每一维代表什么，再把张量整理成 Attention 能够读取的布局。</text>
<rect x="55" y="135" width="190" height="125" fill="#dbeafe" class="box" stroke="#3b82f6"/><text x="150" y="177" text-anchor="middle" class="head">维度语义</text><text x="150" y="210" text-anchor="middle" class="body">batch / sequence</text><text x="150" y="237" text-anchor="middle" class="small">每一维都有角色</text>
<rect x="285" y="135" width="190" height="125" fill="#dcfce7" class="box" stroke="#16a34a"/><text x="380" y="177" text-anchor="middle" class="head">形状重排</text><text x="380" y="210" text-anchor="middle" class="body">reshape / permute</text><text x="380" y="237" text-anchor="middle" class="small">改变布局，不改变元素</text>
<rect x="515" y="135" width="190" height="125" fill="#fef3c7" class="box" stroke="#d97706"/><text x="610" y="177" text-anchor="middle" class="head">Embedding 输出</text><text x="610" y="210" text-anchor="middle" class="body">token id → 向量</text><text x="610" y="237" text-anchor="middle" class="small">得到连续表示</text>
<rect x="745" y="135" width="190" height="125" fill="#fce7f3" class="box" stroke="#db2777"/><text x="840" y="177" text-anchor="middle" class="head">序列表示</text><text x="840" y="210" text-anchor="middle" class="body">[B, S, D]</text><text x="840" y="237" text-anchor="middle" class="small">按 token 排列</text>
<rect x="975" y="135" width="170" height="125" fill="#ede9fe" class="box" stroke="#7c3aed"/><text x="1060" y="177" text-anchor="middle" class="head">后续模块</text><text x="1060" y="210" text-anchor="middle" class="body">Attention / MLP</text><text x="1060" y="237" text-anchor="middle" class="small">继续变换</text>
<path d="M245 197H275" class="line"/><path d="M475 197H505" class="line"/><path d="M705 197H735" class="line"/><path d="M935 197H965" class="line"/>
</svg>

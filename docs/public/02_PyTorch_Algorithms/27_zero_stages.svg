<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 560" role="img" aria-labelledby="title desc">
<title id="title">ZeRO-1、ZeRO-2、ZeRO-3 的分片层次</title><desc id="desc">三个 ZeRO 阶段逐步增加分片对象，同时增加参数聚合和梯度分发通信。</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient><style>
.title{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:28px;font-weight:700;fill:#0f172a}.sub{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:15px;font-weight:500;fill:#475569}.label{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:18px;font-weight:700;fill:#111827}.small{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:13px;font-weight:500;fill:#334155}.box{stroke-width:3;rx:16;ry:16}.flow{stroke:#475569;stroke-width:4;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
<rect width="1500" height="560" fill="url(#bg)"/><text x="60" y="54" class="title">ZeRO 分阶段：省下的状态对应新增的通信</text><text x="60" y="82" class="sub">从优化器状态到梯度再到参数，切分越彻底，单卡驻留越少，聚合时机越重要</text>
<rect x="80" y="180" width="250" height="220" class="box" fill="#eff6ff" stroke="#3b82f6"/><text x="205" y="220" text-anchor="middle" class="label">ZeRO-1</text><text x="120" y="265" class="small">保留：参数、梯度</text><text x="120" y="300" class="small">切分：优化器状态</text><text x="120" y="350" class="small">主要通信：梯度分发</text>
<rect x="430" y="180" width="250" height="220" class="box" fill="#f5f3ff" stroke="#8b5cf6"/><text x="555" y="220" text-anchor="middle" class="label">ZeRO-2</text><text x="470" y="265" class="small">保留：参数</text><text x="470" y="300" class="small">切分：优化器状态、梯度</text><text x="470" y="350" class="small">主要通信：Reduce-Scatter</text>
<rect x="780" y="180" width="250" height="220" class="box" fill="#ecfccb" stroke="#65a30d"/><text x="905" y="220" text-anchor="middle" class="label">ZeRO-3</text><text x="820" y="265" class="small">切分：参数、梯度、状态</text><text x="820" y="300" class="small">计算前聚合当前参数</text><text x="820" y="350" class="small">主要通信：All-Gather</text>
<rect x="1130" y="225" width="270" height="130" class="box" fill="#fff1f2" stroke="#e11d48"/><text x="1265" y="270" text-anchor="middle" class="label">选择依据</text><text x="1265" y="305" text-anchor="middle" class="small">显存预算 ↔ 通信能力</text>
<path d="M330 290L430 290" class="flow"/><path d="M680 290L780 290" class="flow"/><path d="M1030 290L1130 290" class="flow"/>
</svg>

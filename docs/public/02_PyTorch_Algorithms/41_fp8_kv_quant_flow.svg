<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="100" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">FP8 and KV Cache Quantization</text>
  <text x="88" y="132" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">Inference pressure comes from more than weights: hidden states and KV cache also need lower-bandwidth representations.</text>
  <rect x="96" y="204" width="224" height="110" rx="20" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="156" y="244" fill="#1E3A8A" font-size="22" font-family="Arial, sans-serif" font-weight="700">Tensor</text>
  <text x="124" y="278" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">hidden state or KV block</text>
  <text x="124" y="300" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">arrives in floating point</text>
  <rect x="370" y="204" width="236" height="110" rx="20" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <text x="442" y="244" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">Scale</text>
  <text x="402" y="278" fill="#92400E" font-size="16" font-family="Arial, sans-serif">global for teaching FP8</text>
  <text x="402" y="300" fill="#92400E" font-size="16" font-family="Arial, sans-serif">grouped on KV last dimension</text>
  <rect x="656" y="204" width="226" height="110" rx="20" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="718" y="244" fill="#166534" font-size="22" font-family="Arial, sans-serif" font-weight="700">Quantize</text>
  <text x="686" y="278" fill="#166534" font-size="16" font-family="Arial, sans-serif">store low-precision value</text>
  <text x="686" y="300" fill="#166534" font-size="16" font-family="Arial, sans-serif">plus scale metadata</text>
  <rect x="932" y="204" width="214" height="110" rx="20" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <text x="992" y="244" fill="#9D174D" font-size="22" font-family="Arial, sans-serif" font-weight="700">Recover</text>
  <text x="960" y="278" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">dequantize before using</text>
  <text x="960" y="300" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">in attention or compute</text>
  <path d="M320 258H370" stroke="#374151" stroke-width="3"/>
  <path d="M606 258H656" stroke="#374151" stroke-width="3"/>
  <path d="M882 258H932" stroke="#374151" stroke-width="3"/>
  <path d="M355 250L370 258L355 266" fill="#374151"/>
  <path d="M641 250L656 258L641 266" fill="#374151"/>
  <path d="M917 250L932 258L917 266" fill="#374151"/>
  <rect x="96" y="382" width="1050" height="148" rx="22" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="126" y="422" fill="#111827" font-size="22" font-family="Arial, sans-serif" font-weight="700">Why grouped KV scales matter</text>
  <text x="126" y="456" fill="#374151" font-size="18" font-family="Arial, sans-serif">A single extreme value can widen the range of a whole hidden dimension. Grouped scales let nearby positions share a tighter range, which usually reduces average reconstruction error for long KV cache tensors.</text>
  <text x="126" y="488" fill="#374151" font-size="18" font-family="Arial, sans-serif">So the story is not "weights again", but "runtime state also needs a compressed representation with a practical recovery path".</text>
  <rect x="96" y="558" width="1050" height="68" rx="18" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
  <text x="126" y="590" fill="#075985" font-size="18" font-family="Arial, sans-serif">Page 41 should leave one boundary: weight quantization reduces model traffic, but KV cache quantization targets the growing runtime state of long-context inference.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d">
<title id="t">自动调优的候选评估</title><desc id="d">候选配置经过约束过滤和统一评分后进入下一轮。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><style>.h{font:700 26px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.s{font:500 15px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.l{font:700 18px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#111827}.b{font:500 14px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}.box{stroke-width:3;rx:16}.f{stroke:#475569;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1200" height="500" fill="#f8fafc"/><text x="50" y="55" class="h">自动调优：候选如何被筛选</text><text x="50" y="83" class="s">先排除违反约束的配置，再在可行候选中比较收益。</text>
<rect x="55" y="190" width="220" height="110" class="box" fill="#eff6ff" stroke="#3b82f6"/><text x="165" y="232" text-anchor="middle" class="l">候选配置</text><text x="165" y="263" text-anchor="middle" class="b">超参 · 预计成本</text>
<rect x="345" y="190" width="220" height="110" class="box" fill="#fff7ed" stroke="#f59e0b"/><text x="455" y="232" text-anchor="middle" class="l">约束过滤</text><text x="455" y="263" text-anchor="middle" class="b">显存 · 延迟 · 质量</text>
<rect x="635" y="115" width="220" height="100" class="box" fill="#ecfccb" stroke="#65a30d"/><text x="745" y="155" text-anchor="middle" class="l">可行配置</text><text x="745" y="185" text-anchor="middle" class="b">进入统一评分</text>
<rect x="635" y="260" width="220" height="100" class="box" fill="#fee2e2" stroke="#dc2626"/><text x="745" y="300" text-anchor="middle" class="l">淘汰配置</text><text x="745" y="330" text-anchor="middle" class="b">记录违反的约束</text>
<rect x="930" y="190" width="210" height="110" class="box" fill="#f5f3ff" stroke="#8b5cf6"/><text x="1035" y="232" text-anchor="middle" class="l">排序与推荐</text><text x="1035" y="263" text-anchor="middle" class="b">得分 · 下一轮候选</text>
<path d="M275 245H345M565 235L635 165M565 265L635 310M855 165L930 225" class="f"/>
</svg>

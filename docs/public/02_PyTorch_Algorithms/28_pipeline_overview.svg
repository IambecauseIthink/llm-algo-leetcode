<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 560" role="img" aria-labelledby="title desc">
<title id="title">流水线并行与微批次总览</title><desc id="desc">模型层被切成多个 stage，micro-batch 依次流过各 stage 并形成前向和反向流水。</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#ecfeff"/></linearGradient><style>
.title{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:28px;font-weight:700;fill:#0f172a}.sub{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:15px;font-weight:500;fill:#475569}.label{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:18px;font-weight:700;fill:#111827}.small{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:13px;font-weight:500;fill:#334155}.box{stroke-width:3;rx:16;ry:16}.flow{stroke:#475569;stroke-width:4;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
<rect width="1500" height="560" fill="url(#bg)"/><text x="60" y="54" class="title">Pipeline Parallelism：把层切成 stage，让 micro-batch 流动</text><text x="60" y="82" class="sub">每个 stage 只保存部分模型层；调度目标是减少等待空档并维持计算流水</text>
<rect x="80" y="215" width="190" height="100" class="box" fill="#fff7ed" stroke="#f59e0b"/><text x="175" y="255" text-anchor="middle" class="label">大 Batch</text><text x="175" y="285" text-anchor="middle" class="small">切成 micro-batch</text>
<rect x="370" y="140" width="190" height="100" class="box" fill="#eff6ff" stroke="#3b82f6"/><text x="465" y="180" text-anchor="middle" class="label">Stage 1</text><text x="465" y="210" text-anchor="middle" class="small">前段模型层</text>
<rect x="370" y="330" width="190" height="100" class="box" fill="#eff6ff" stroke="#3b82f6"/><text x="465" y="370" text-anchor="middle" class="label">Stage 1</text><text x="465" y="400" text-anchor="middle" class="small">反向梯度</text>
<rect x="690" y="140" width="190" height="100" class="box" fill="#ecfccb" stroke="#65a30d"/><text x="785" y="180" text-anchor="middle" class="label">Stage 2</text><text x="785" y="210" text-anchor="middle" class="small">中段模型层</text>
<rect x="1010" y="140" width="190" height="100" class="box" fill="#f5f3ff" stroke="#8b5cf6"/><text x="1105" y="180" text-anchor="middle" class="label">Stage 3</text><text x="1105" y="210" text-anchor="middle" class="small">后段模型层</text>
<rect x="1260" y="215" width="180" height="100" class="box" fill="#fff1f2" stroke="#e11d48"/><text x="1350" y="255" text-anchor="middle" class="label">输出与梯度</text><text x="1350" y="285" text-anchor="middle" class="small">继续训练闭环</text>
<path d="M270 265C320 210 330 190 370 190" class="flow"/><path d="M560 190L690 190" class="flow"/><path d="M880 190L1010 190" class="flow"/><path d="M1200 190C1240 210 1240 250 1260 250" class="flow"/><path d="M1010 240C900 350 700 380 560 380" class="flow"/>
</svg>

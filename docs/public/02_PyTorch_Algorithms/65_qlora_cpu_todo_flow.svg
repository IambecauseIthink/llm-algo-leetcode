<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">QLoRA 的预算选型矩阵</title><desc id="desc">把显存预算、吞吐下限和质量下限转成候选配置的筛选和选型动作。</desc>
  <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#2e1065}.title{font-size:25px;font-weight:700}.h{font-size:18px;font-weight:700}.b{font-size:15px;fill:#5b21b6}.head{font-size:16px;font-weight:700;fill:#fff}.cell{fill:#fff;stroke:#ddd6fe;stroke-width:1.5}.focus{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.ok{fill:#ecfdf5;stroke:#34d399;stroke-width:2}.warn{fill:#fffbeb;stroke:#f59e0b;stroke-width:2}</style>
  <rect width="1120" height="520" fill="#faf7ff"/><text x="560" y="42" text-anchor="middle" class="title">QLoRA 选型：先筛可行，再比较代价</text>
  <rect x="70" y="82" width="980" height="48" fill="#7c3aed" rx="10"/><text x="180" y="113" text-anchor="middle" class="head">输入约束</text><text x="390" y="113" text-anchor="middle" class="head">候选方案</text><text x="610" y="113" text-anchor="middle" class="head">筛选条件</text><text x="825" y="113" text-anchor="middle" class="head">证据</text><text x="980" y="113" text-anchor="middle" class="head">动作</text>
  <rect x="70" y="130" width="220" height="100" class="focus"/><text x="180" y="168" text-anchor="middle" class="h">预算约束</text><text x="180" y="198" text-anchor="middle" class="b">显存上限</text><text x="180" y="220" text-anchor="middle" class="b">吞吐下限 · 质量下限</text>
  <rect x="290" y="130" width="220" height="100" class="cell"/><text x="400" y="168" text-anchor="middle" class="h">全参数 / LoRA</text><text x="400" y="198" text-anchor="middle" class="b">QLoRA / 不同 NF4</text><text x="400" y="220" text-anchor="middle" class="b">固定 workload</text>
  <rect x="510" y="130" width="220" height="100" class="cell"/><text x="620" y="168" text-anchor="middle" class="h">能否装下</text><text x="620" y="198" text-anchor="middle" class="b">是否达到速度门槛</text><text x="620" y="220" text-anchor="middle" class="b">质量是否可接受</text>
  <rect x="730" y="130" width="190" height="100" class="cell"/><text x="825" y="168" text-anchor="middle" class="h">CPU 账本</text><text x="825" y="198" text-anchor="middle" class="b">GPU 显存 / 速度</text><text x="825" y="220" text-anchor="middle" class="b">任务质量</text>
  <rect x="920" y="130" width="130" height="100" class="ok"/><text x="985" y="178" text-anchor="middle" class="h">保留</text><text x="985" y="207" text-anchor="middle" class="b">候选</text>
  <rect x="70" y="285" width="300" height="110" class="ok"/><text x="220" y="323" text-anchor="middle" class="h">可行域</text><text x="220" y="355" text-anchor="middle" class="b">满足显存、吞吐和质量门槛</text><text x="220" y="380" text-anchor="middle" class="b">进入 GPU 复核</text>
  <rect x="410" y="285" width="300" height="110" class="warn"/><text x="560" y="323" text-anchor="middle" class="h">敏感预算</text><text x="560" y="355" text-anchor="middle" class="b">稍微改变上限就改变最优方案</text><text x="560" y="380" text-anchor="middle" class="b">需要补测或调参</text>
  <rect x="750" y="285" width="300" height="110" class="cell"/><text x="900" y="323" text-anchor="middle" class="h">不可行</text><text x="900" y="355" text-anchor="middle" class="b">OOM、速度不足或质量不达标</text><text x="900" y="380" text-anchor="middle" class="b">拒绝当前方案</text>
  <text x="560" y="450" text-anchor="middle" class="h">CPU 负责预算筛选；真实量化加载、kernel 和收益需要 GPU 验证</text>
</svg>

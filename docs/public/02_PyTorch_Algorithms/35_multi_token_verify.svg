<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="100" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">多 Token 解码验证循环</text>
  <text x="88" y="132" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">收益来自连续接受，而不是无条件地产生更多 token。</text>
  <rect x="100" y="208" width="210" height="104" rx="20" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="160" y="246" fill="#1E3A8A" font-size="22" font-family="Arial, sans-serif" font-weight="700">提议</text>
  <text x="128" y="278" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">草稿 token：t1 t2 t3 t4</text>
  <text x="128" y="300" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">截取到指定长度</text>
  <rect x="370" y="208" width="210" height="104" rx="20" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <text x="432" y="246" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">验证</text>
  <text x="404" y="278" fill="#92400E" font-size="16" font-family="Arial, sans-serif">目标模型检查</text>
  <text x="404" y="300" fill="#92400E" font-size="16" font-family="Arial, sans-serif">按从左到右逐个处理</text>
  <rect x="640" y="208" width="226" height="104" rx="20" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="698" y="246" fill="#166534" font-size="22" font-family="Arial, sans-serif" font-weight="700">接受前缀</text>
  <text x="670" y="278" fill="#166534" font-size="16" font-family="Arial, sans-serif">t1、t2 通过验证</text>
  <text x="670" y="300" fill="#166534" font-size="16" font-family="Arial, sans-serif">一次推进多个 token</text>
  <rect x="926" y="208" width="220" height="104" rx="20" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <text x="988" y="246" fill="#9D174D" font-size="22" font-family="Arial, sans-serif" font-weight="700">回退</text>
  <text x="956" y="278" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">首次拒绝处停止</text>
  <text x="956" y="300" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">剩余后缀回到保守路径</text>
  <path d="M310 260H370" stroke="#374151" stroke-width="3"/>
  <path d="M580 260H640" stroke="#374151" stroke-width="3"/>
  <path d="M866 260H926" stroke="#374151" stroke-width="3"/>
  <path d="M355 252L370 260L355 268" fill="#374151"/>
  <path d="M625 252L640 260L625 268" fill="#374151"/>
  <path d="M911 252L926 260L911 268" fill="#374151"/>
  <rect x="100" y="378" width="1046" height="154" rx="22" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="132" y="420" fill="#111827" font-size="22" font-family="Arial, sans-serif" font-weight="700">是否值得采用，看什么</text>
  <text x="132" y="454" fill="#374151" font-size="18" font-family="Arial, sans-serif">提议越长，只有在接受前缀通常也较长时才有收益；否则会增加验证成本并频繁回退。</text>
  <text x="132" y="486" fill="#374151" font-size="18" font-family="Arial, sans-serif">核心权衡是提议激进程度与回退频率，而不是“提议 token 越多越好”。</text>
  <rect x="100" y="558" width="1046" height="68" rx="18" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
  <text x="132" y="590" fill="#075985" font-size="18" font-family="Arial, sans-serif">阅读主线：批量提议 → 顺序验证 → 首次拒绝即停 → 只保留已接受前缀。</text>
</svg>

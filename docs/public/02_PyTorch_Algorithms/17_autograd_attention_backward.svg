<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Attention 前向状态与反向梯度链</title>
  <desc id="desc">Attention 先由 Q、K、V 计算 S、P 和 O；反向从 dO 分成 dV 和 dP 两条支路，再经过 Softmax 和缩放点积得到 dQ、dK。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#eff6ff"/></linearGradient>
    <style>
      .title { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 30px; font-weight: 700; fill: #0f172a; }
      .sub { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 16px; font-weight: 500; fill: #475569; }
      .group { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 19px; font-weight: 700; fill: #334155; }
      .label { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .small { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 14px; font-weight: 500; fill: #334155; }
      .box { stroke-width: 3; rx: 18; ry: 18; }
      .forward { stroke: #2563eb; stroke-width: 4; fill: none; }
      .forward-head { fill: #2563eb; }
      .backward { stroke: #dc2626; stroke-width: 4; stroke-dasharray: 9 7; fill: none; marker-end: url(#red); }
      .backward-horizontal { stroke: #dc2626; stroke-width: 4; stroke-dasharray: 9 7; fill: none; }
      .backward-head { fill: #dc2626; }
      .state { stroke: #65a30d; stroke-width: 3; stroke-dasharray: 8 6; fill: #f7fee7; }
      .state-line { stroke: #65a30d; stroke-width: 3; stroke-dasharray: 8 6; fill: none; marker-end: url(#green); }
      .legend { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 14px; font-weight: 500; fill: #475569; }
    </style>
    <marker id="blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#2563eb"/></marker>
    <marker id="red" viewBox="0 0 20 18" refX="18" refY="9" markerWidth="20" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L20 9 L0 18 Z" fill="#dc2626"/></marker>
    <marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#65a30d"/></marker>
  </defs>
  <rect width="1600" height="760" fill="url(#bg)"/>
  <text x="60" y="58" class="title">Attention Autograd：前向建立状态，反向沿依赖回传</text>
  <text x="60" y="88" class="sub">先看 Q、K、V 如何形成 O，再看 dO 如何分支并回到输入；保存状态由旁路表示</text>

  <text x="80" y="138" class="group">前向：建立中间结果</text>
  <rect x="80" y="165" width="190" height="86" class="box" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="175" y="201" text-anchor="middle" class="label">输入投影</text><text x="175" y="227" text-anchor="middle" class="small">Q、K、V</text>
  <rect x="350" y="165" width="190" height="86" class="box" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="445" y="201" text-anchor="middle" class="label">打分矩阵</text><text x="445" y="227" text-anchor="middle" class="small">S = QKᵀ / √d</text>
  <rect x="620" y="165" width="190" height="86" class="box" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="715" y="201" text-anchor="middle" class="label">概率矩阵</text><text x="715" y="227" text-anchor="middle" class="small">P = Softmax(S)</text>
  <rect x="890" y="165" width="190" height="86" class="box" fill="#ecfccb" stroke="#65a30d"/>
  <text x="985" y="201" text-anchor="middle" class="label">Attention 输出</text><text x="985" y="227" text-anchor="middle" class="small">O = PV</text>
  <rect x="1160" y="165" width="190" height="86" class="box" fill="#f1f5f9" stroke="#64748b"/>
  <text x="1255" y="201" text-anchor="middle" class="label">损失函数</text><text x="1255" y="227" text-anchor="middle" class="small">产生上游梯度 dO</text>
  <path d="M270 208H350M540 208H620M810 208H890M1080 208H1160" class="forward"/>
  <path d="M330 199L350 208L330 217Z M600 199L620 208L600 217Z M870 199L890 208L870 217Z M1140 199L1160 208L1140 217Z" class="forward-head"/>

  <rect x="390" y="285" width="360" height="72" rx="16" class="state"/>
  <text x="570" y="314" text-anchor="middle" class="label">反向可读取的前向状态</text>
  <text x="570" y="339" text-anchor="middle" class="small">Q、K、V、P</text>
  <path d="M175 251C245 275 315 321 390 321" class="state-line"/>
  <path d="M715 251V285" class="state-line"/>

  <text x="80" y="420" class="group">反向：沿计算依赖回传</text>
  <rect x="80" y="460" width="190" height="86" class="box" fill="#fff1f2" stroke="#e11d48"/>
  <text x="175" y="496" text-anchor="middle" class="label">dO</text><text x="175" y="522" text-anchor="middle" class="small">反向计算起点</text>
  <rect x="370" y="390" width="190" height="86" class="box" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="465" y="426" text-anchor="middle" class="label">dV</text><text x="465" y="452" text-anchor="middle" class="small">直接来自 O = PV</text>
  <rect x="370" y="530" width="190" height="86" class="box" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="465" y="566" text-anchor="middle" class="label">dP</text><text x="465" y="592" text-anchor="middle" class="small">继续穿过 Softmax</text>
  <rect x="680" y="530" width="190" height="86" class="box" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="775" y="566" text-anchor="middle" class="label">dS</text><text x="775" y="592" text-anchor="middle" class="small">Softmax 的梯度</text>
  <rect x="990" y="530" width="230" height="86" class="box" fill="#ecfccb" stroke="#65a30d"/>
  <text x="1105" y="566" text-anchor="middle" class="label">dQ、dK</text><text x="1105" y="592" text-anchor="middle" class="small">回到 Q、K</text>
  <path d="M270 486C315 470 325 438 370 438" class="backward"/>
  <path d="M270 520C315 540 325 573 370 573" class="backward"/>
  <path d="M560 573H680" class="backward-horizontal"/>
  <path d="M660 564L680 573L660 582Z" class="backward-head"/>
  <path d="M870 573H990" class="backward"/>

  <line x1="80" y1="680" x2="125" y2="680" stroke="#2563eb" stroke-width="4"/>
  <text x="138" y="685" class="legend">蓝色实线：前向数值流</text>
  <line x1="390" y1="680" x2="435" y2="680" stroke="#dc2626" stroke-width="4" stroke-dasharray="9 7"/>
  <text x="448" y="685" class="legend">红色虚线箭头：反向梯度流</text>
  <line x1="790" y1="680" x2="835" y2="680" stroke="#65a30d" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="848" y="685" class="legend">绿色虚线：前向状态保存关系</text>
</svg>

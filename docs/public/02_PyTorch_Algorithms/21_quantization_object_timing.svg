<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
<title id="title">量化：改变表示，重新分配成本</title>
<desc id="desc">从量化对象到数值映射，再到资源收益和部署执行路径的概念关系。</desc>
<defs>
  <marker id="arrow21" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker>
  <style>
    text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}
    .title{font-size:28px;font-weight:700}.group{font-size:18px;font-weight:700}.head{font-size:20px;font-weight:700}.body{font-size:15px}.small{font-size:13px}
    .panel{stroke:#94a3b8;stroke-width:2;rx:16}.item{stroke:#cbd5e1;stroke-width:1.5;rx:10}.flow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow21)}
  </style>
</defs>
<rect width="1280" height="620" fill="#f8fafc"/>
<text x="640" y="46" text-anchor="middle" class="title">量化：改变表示，重新分配成本</text>
<text x="640" y="75" text-anchor="middle" class="small">先确定被改变的状态，再判断收益落在容量、带宽、计算还是质量</text>

<rect x="45" y="110" width="270" height="345" fill="#e0f2fe" class="panel"/>
<text x="180" y="145" text-anchor="middle" class="group">量化对象</text>
<rect x="75" y="170" width="210" height="64" fill="#fff" class="item"/>
<text x="180" y="198" text-anchor="middle" class="head">权重</text>
<text x="180" y="220" text-anchor="middle" class="small">模型文件与装载显存</text>
<rect x="75" y="250" width="210" height="64" fill="#fff" class="item"/>
<text x="180" y="278" text-anchor="middle" class="head">激活</text>
<text x="180" y="300" text-anchor="middle" class="small">训练或运行时张量</text>
<rect x="75" y="330" width="210" height="64" fill="#fff" class="item"/>
<text x="180" y="358" text-anchor="middle" class="head">KV Cache</text>
<text x="180" y="380" text-anchor="middle" class="small">请求执行中的状态</text>
<text x="180" y="430" text-anchor="middle" class="small">对象不同，验证指标也不同</text>

<rect x="355" y="110" width="290" height="345" fill="#dcfce7" class="panel"/>
<text x="500" y="145" text-anchor="middle" class="group">数值映射</text>
<rect x="385" y="170" width="230" height="66" fill="#fff" class="item"/>
<text x="500" y="198" text-anchor="middle" class="head">scale / zero point</text>
<text x="500" y="221" text-anchor="middle" class="small">浮点值映射到低比特范围</text>
<rect x="385" y="252" width="230" height="66" fill="#fff" class="item"/>
<text x="500" y="280" text-anchor="middle" class="head">分组 / 通道粒度</text>
<text x="500" y="303" text-anchor="middle" class="small">粒度影响误差与元数据</text>
<rect x="385" y="334" width="230" height="66" fill="#fff" class="item"/>
<text x="500" y="362" text-anchor="middle" class="head">校准或训练</text>
<text x="500" y="385" text-anchor="middle" class="small">PTQ、QAT 与运行时路径</text>
<text x="500" y="430" text-anchor="middle" class="small">位宽只是映射的一部分</text>

<rect x="685" y="110" width="260" height="345" fill="#fef3c7" class="panel"/>
<text x="815" y="145" text-anchor="middle" class="group">成本变化</text>
<rect x="715" y="175" width="200" height="62" fill="#fff" class="item"/>
<text x="815" y="211" text-anchor="middle" class="body">容量与带宽</text>
<rect x="715" y="252" width="200" height="62" fill="#fff" class="item"/>
<text x="815" y="288" text-anchor="middle" class="body">误差与稳定性</text>
<rect x="715" y="329" width="200" height="62" fill="#fff" class="item"/>
<text x="815" y="365" text-anchor="middle" class="body">kernel 与吞吐</text>
<text x="815" y="430" text-anchor="middle" class="small">权重变小不等于整机同比变快</text>

<rect x="985" y="110" width="250" height="345" fill="#fce7f3" class="panel"/>
<text x="1110" y="145" text-anchor="middle" class="group">执行与交付</text>
<rect x="1015" y="175" width="190" height="66" fill="#fff" class="item"/>
<text x="1110" y="203" text-anchor="middle" class="head">部署前产物</text>
<text x="1110" y="226" text-anchor="middle" class="small">GPTQ / AWQ / GGUF</text>
<rect x="1015" y="257" width="190" height="66" fill="#fff" class="item"/>
<text x="1110" y="285" text-anchor="middle" class="head">运行时路径</text>
<text x="1110" y="308" text-anchor="middle" class="small">FP8 / KV Cache 量化</text>
<rect x="1015" y="339" width="190" height="66" fill="#fff" class="item"/>
<text x="1110" y="367" text-anchor="middle" class="head">backend 兼容</text>
<text x="1110" y="390" text-anchor="middle" class="small">格式、kernel、质量</text>
<text x="1110" y="430" text-anchor="middle" class="small">最终要回到真实 workload</text>

<path d="M315 282H350" class="flow"/><text x="333" y="268" text-anchor="middle" class="small">选择对象</text>
<path d="M645 282H680" class="flow"/><text x="663" y="268" text-anchor="middle" class="small">映射</text>
<path d="M945 282H980" class="flow"/><text x="963" y="268" text-anchor="middle" class="small">兑现</text>
<text x="640" y="485" text-anchor="middle" class="group">量化判断线索</text>
<path d="M235 545H275" class="flow"/><path d="M485 545H525" class="flow"/><path d="M735 545H775" class="flow"/><path d="M985 545H1025" class="flow"/>
<rect x="30" y="505" width="205" height="78" fill="#eff6ff" class="item"/>
<text x="132" y="532" text-anchor="middle" class="body">先问改变什么</text><text x="132" y="556" text-anchor="middle" class="small">权重、激活或缓存</text>
<rect x="280" y="505" width="205" height="78" fill="#f0fdf4" class="item"/>
<text x="382" y="532" text-anchor="middle" class="body">再问如何映射</text><text x="382" y="556" text-anchor="middle" class="small">粒度、校准与位宽</text>
<rect x="530" y="505" width="205" height="78" fill="#fefce8" class="item"/>
<text x="632" y="532" text-anchor="middle" class="body">然后看代价</text><text x="632" y="556" text-anchor="middle" class="small">容量、误差与吞吐</text>
<rect x="780" y="505" width="205" height="78" fill="#fff1f2" class="item"/>
<text x="882" y="532" text-anchor="middle" class="body">最后看能否运行</text><text x="882" y="556" text-anchor="middle" class="small">artifact 与 backend</text>
<rect x="1030" y="505" width="220" height="78" fill="#f8fafc" class="item" stroke-dasharray="6 4"/>
<text x="1140" y="532" text-anchor="middle" class="body">真实 workload</text><text x="1140" y="556" text-anchor="middle" class="small">质量与性能共同验收</text>
</svg>

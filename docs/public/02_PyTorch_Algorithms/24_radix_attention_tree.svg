<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 540" role="img" aria-labelledby="title desc">
  <title id="title">RadixAttention 前缀树</title>
  <desc id="desc">展示共享前缀如何在基数树中保存一次，以及新请求如何进行最长前缀匹配。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 30px "Inter", "Noto Sans SC", sans-serif; fill: #0f172a; }
      .sub { font: 500 16px "Inter", "Noto Sans SC", sans-serif; fill: #475569; }
      .label { font: 700 18px "Inter", "Noto Sans SC", sans-serif; fill: #111827; }
      .small { font: 500 14px "Inter", "Noto Sans SC", sans-serif; fill: #334155; }
      .box { fill: #ffffff; stroke-width: 3; rx: 16; ry: 16; }
      .node { fill: #ffffff; stroke-width: 3; rx: 14; ry: 14; }
      .arrow { stroke: #475569; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .share { stroke: #16a34a; stroke-width: 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1660" height="740" fill="url(#bg)"/>
  <text x="64" y="66" class="title">RadixAttention：多个请求共享一棵前缀树</text>
  <text x="64" y="96" class="sub">公共前缀只保存一次，新请求沿最长前缀命中路径复用 KV Cache。</text>

  <rect x="90" y="150" width="1470" height="96" class="box" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="120" y="186" class="label">新请求到达</text>
  <text x="120" y="220" class="small">与已缓存路径匹配，复用最长公共前缀。</text>

  <rect x="160" y="320" width="130" height="62" class="node" fill="#ecfccb" stroke="#65a30d"/>
  <text x="225" y="358" text-anchor="middle" class="label">根节点</text>

  <path d="M 225 382 L 225 470" class="share"/>
  <path d="M 225 470 L 420 470" class="share"/>
  <path d="M 420 470 L 620 470" class="share"/>

  <rect x="330" y="430" width="180" height="70" class="node" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="420" y="466" text-anchor="middle" class="label">共享前缀</text>
  <text x="420" y="490" text-anchor="middle" class="small">只保存一次</text>

  <rect x="550" y="430" width="180" height="70" class="node" fill="#ecfeff" stroke="#0891b2"/>
  <text x="640" y="466" text-anchor="middle" class="label">分支 A</text>
  <text x="640" y="490" text-anchor="middle" class="small">请求 A</text>

  <rect x="780" y="430" width="180" height="70" class="node" fill="#ecfeff" stroke="#0891b2"/>
  <text x="870" y="466" text-anchor="middle" class="label">分支 B</text>
  <text x="870" y="490" text-anchor="middle" class="small">请求 B</text>

  <rect x="1000" y="320" width="500" height="180" class="box" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1030" y="358" class="label">复用流程</text>
  <text x="1030" y="392" class="small">1. 将 prompt 与缓存路径比较</text>
  <text x="1030" y="422" class="small">2. 复用命中的前缀 KV</text>
  <text x="1030" y="452" class="small">3. 只计算未命中的后缀</text>

</svg>

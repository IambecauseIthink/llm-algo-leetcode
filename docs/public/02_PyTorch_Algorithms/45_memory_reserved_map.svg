  <text x="492" y="292" fill="#92400E" font-size="17" font-family="Arial, sans-serif">that is not already explained by</text>
  <text x="492" y="322" fill="#92400E" font-size="17" font-family="Arial, sans-serif">offload, tiering, or tuning loops</text>

  <text x="146" y="438" fill="#111827" font-size="22" font-family="Arial, sans-serif" font-weight="700">What this reserved page should already communicate</text>
  <text x="146" y="472" fill="#374151" font-size="18" font-family="Arial, sans-serif">1. Which memory bottleneck class is still missing from the route.</text>
  <text x="146" y="500" fill="#374151" font-size="18" font-family="Arial, sans-serif">2. Why that class cannot just be merged into 42-44.</text>
  <text x="146" y="528" fill="#374151" font-size="18" font-family="Arial, sans-serif">3. Where a reader should go now if the future page is not written yet.</text>

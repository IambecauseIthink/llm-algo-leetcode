<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Embedding 从 token id 连接到上下文表示</title><desc id="desc">展示文本、token id、Embedding 查表、位置处理和 Attention 输入之间的关系。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>
.title{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:27px;font-weight:700;fill:#0f172a}.sub{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:15px;fill:#475569}.head{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:18px;font-weight:700;fill:#111827}.body{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:14px;fill:#334155}.small{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:13px;fill:#475569}.box{stroke-width:2.5;rx:15}.line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}
</style></defs><rect width="1200" height="430" fill="#f8fafc"/><text x="55" y="52" class="title">Embedding：把离散 token 变成连续表示</text><text x="55" y="82" class="sub">模型先查表得到向量，再把位置关系加入 Query / Key 的计算链路。</text>
<rect x="55" y="135" width="190" height="125" fill="#dbeafe" class="box" stroke="#3b82f6"/><text x="150" y="177" text-anchor="middle" class="head">文本</text><text x="150" y="210" text-anchor="middle" class="body">离散符号</text><text x="150" y="237" text-anchor="middle" class="small">先经过分词</text>
<rect x="285" y="135" width="190" height="125" fill="#e0f2fe" class="box" stroke="#0284c7"/><text x="380" y="177" text-anchor="middle" class="head">Token ID</text><text x="380" y="210" text-anchor="middle" class="body">词表中的编号</text><text x="380" y="237" text-anchor="middle" class="small">整数索引</text>
<rect x="515" y="135" width="190" height="125" fill="#dcfce7" class="box" stroke="#16a34a"/><text x="610" y="177" text-anchor="middle" class="head">Embedding 查表</text><text x="610" y="210" text-anchor="middle" class="body">取出对应行向量</text><text x="610" y="237" text-anchor="middle" class="small">得到 hidden state</text>
<rect x="745" y="135" width="190" height="125" fill="#fef3c7" class="box" stroke="#d97706"/><text x="840" y="177" text-anchor="middle" class="head">位置关系</text><text x="840" y="210" text-anchor="middle" class="body">RoPE 作用于 Q / K</text><text x="840" y="237" text-anchor="middle" class="small">保留顺序信息</text>
<rect x="975" y="135" width="170" height="125" fill="#ede9fe" class="box" stroke="#7c3aed"/><text x="1060" y="177" text-anchor="middle" class="head">Attention</text><text x="1060" y="210" text-anchor="middle" class="body">读取上下文</text><text x="1060" y="237" text-anchor="middle" class="small">进入模型层</text>
<path d="M245 197H275" class="line"/><path d="M475 197H505" class="line"/><path d="M705 197H735" class="line"/><path d="M935 197H965" class="line"/>
</svg>

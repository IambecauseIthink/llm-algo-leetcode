<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d">
<title id="t">NCCL 通信分析总览</title><desc id="d">从并行工作负载进入通信事件，再结合时间线判断通信是否阻塞计算。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><style>.h{font:700 26px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.s{font:500 15px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.l{font:700 18px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#111827}.b{font:500 14px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}.box{stroke-width:3;rx:16}.f{stroke:#475569;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1200" height="500" fill="#f8fafc"/><text x="50" y="55" class="h">NCCL 通信分析：从事件到瓶颈</text><text x="50" y="83" class="s">不只看 GPU 利用率，还要把 collective、rank 等待和计算重叠放到同一时间线上。</text>
<rect x="55" y="190" width="220" height="110" class="box" fill="#eff6ff" stroke="#3b82f6"/><text x="165" y="232" text-anchor="middle" class="l">并行工作负载</text><text x="165" y="263" text-anchor="middle" class="b">训练 / 推理 · 多 rank</text>
<rect x="345" y="190" width="220" height="110" class="box" fill="#fef3c7" stroke="#d97706"/><text x="455" y="232" text-anchor="middle" class="l">通信事件</text><text x="455" y="263" text-anchor="middle" class="b">all-reduce · all-to-all</text>
<rect x="635" y="190" width="220" height="110" class="box" fill="#ecfccb" stroke="#65a30d"/><text x="745" y="232" text-anchor="middle" class="l">时间线证据</text><text x="745" y="263" text-anchor="middle" class="b">耗时 · 带宽 · rank 等待</text>
<rect x="930" y="190" width="210" height="110" class="box" fill="#f5f3ff" stroke="#8b5cf6"/><text x="1035" y="232" text-anchor="middle" class="l">瓶颈判断</text><text x="1035" y="263" text-anchor="middle" class="b">通信阻塞还是可重叠</text>
<path d="M275 245H345M565 245H635M855 245H930" class="f"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <rect width="1000" height="300" fill="#faf7ff"/>
  <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#2e1065} .box{fill:#fff;stroke:#7c3aed;stroke-width:2;rx:14} .arrow{stroke:#6d28d9;stroke-width:3;marker-end:url(#m)}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#6d28d9"/></marker></defs>
  <text x="500" y="38" text-anchor="middle" font-size="24" font-weight="700">QLoRA 的预算选型</text>
  <rect class="box" x="35" y="105" width="190" height="100"/><text x="130" y="145" text-anchor="middle" font-size="20">设定预算</text><text x="130" y="177" text-anchor="middle" font-size="16">显存、吞吐、质量</text>
  <rect class="box" x="270" y="105" width="190" height="100"/><text x="365" y="145" text-anchor="middle" font-size="20">拆分账本</text><text x="365" y="177" text-anchor="middle" font-size="16">权重、梯度、激活</text>
  <rect class="box" x="505" y="105" width="190" height="100"/><text x="600" y="145" text-anchor="middle" font-size="20">比较候选</text><text x="600" y="177" text-anchor="middle" font-size="16">LoRA 与 QLoRA</text>
  <rect class="box" x="740" y="105" width="190" height="100"/><text x="835" y="145" text-anchor="middle" font-size="20">形成选择</text><text x="835" y="177" text-anchor="middle" font-size="16">accept / tune / reject</text>
  <path class="arrow" d="M225 155 H265"/><path class="arrow" d="M460 155 H500"/><path class="arrow" d="M695 155 H735"/>
  <text x="500" y="255" text-anchor="middle" font-size="16" fill="#5b21b6">CPU 先筛选预算方案；GPU 再验证真实加载、显存、速度和质量</text>
</svg>

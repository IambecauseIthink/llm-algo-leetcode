<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="430" viewBox="0 0 1500 430">
  <defs>
    <style>.title{font:700 28px sans-serif;fill:#17324d}.h{font:700 19px sans-serif;fill:#17324d}.t{font:16px sans-serif;fill:#35526b}.s{font:15px sans-serif;fill:#526b7d}.line{stroke:#3978a8;stroke-width:3;fill:none;marker-end:url(#a)}.dash{stroke:#8b6bb1;stroke-width:2.5;stroke-dasharray:9 7;fill:none;marker-end:url(#p)}.b{fill:#e8f3fb;stroke:#3978a8;stroke-width:2}.g{fill:#eaf7ef;stroke:#4c9870;stroke-width:2}.o{fill:#fff1df;stroke:#c78335;stroke-width:2}.p{fill:#f1eafa;stroke:#8b6bb1;stroke-width:2}</style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3978a8"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8b6bb1"/></marker>
  </defs>
  <rect width="1500" height="430" rx="24" fill="#f8fbfd"/>
  <text x="750" y="48" text-anchor="middle" class="title">GPU/backend serving benchmark：从环境到证据</text>
  <rect x="45" y="135" width="200" height="105" rx="18" class="b"/><text x="145" y="173" text-anchor="middle" class="h">环境预检</text><text x="145" y="205" text-anchor="middle" class="t">GPU、CUDA、backend</text><text x="145" y="228" text-anchor="middle" class="t">模型与端口</text>
  <rect x="315" y="135" width="200" height="105" rx="18" class="p"/><text x="415" y="173" text-anchor="middle" class="h">固定 workload</text><text x="415" y="205" text-anchor="middle" class="t">请求流、dtype</text><text x="415" y="228" text-anchor="middle" class="t">并发、cache policy</text>
  <rect x="585" y="135" width="180" height="105" rx="18" class="g"/><text x="675" y="173" text-anchor="middle" class="h">G0</text><text x="675" y="205" text-anchor="middle" class="t">serving baseline</text><text x="675" y="228" text-anchor="middle" class="t">共同参照</text>
  <rect x="835" y="135" width="180" height="105" rx="18" class="g"/><text x="925" y="173" text-anchor="middle" class="h">G1</text><text x="925" y="205" text-anchor="middle" class="t">负载扫描</text><text x="925" y="228" text-anchor="middle" class="t">并发 / 到达率</text>
  <rect x="1085" y="135" width="180" height="105" rx="18" class="o"/><text x="1175" y="173" text-anchor="middle" class="h">G2</text><text x="1175" y="205" text-anchor="middle" class="t">策略对照</text><text x="1175" y="228" text-anchor="middle" class="t">单变量变化</text>
  <rect x="1330" y="135" width="125" height="105" rx="18" class="b"/><text x="1392" y="173" text-anchor="middle" class="h">JSON</text><text x="1392" y="205" text-anchor="middle" class="t">指标</text><text x="1392" y="228" text-anchor="middle" class="t">决策</text>
  <path d="M245 187H315M515 187H585M765 187H835M1015 187H1085M1265 187H1330" class="line"/>
  <path d="M1175 240C1175 330 925 350 675 240" class="dash"/>
  <text x="850" y="350" class="s">G2 与 G0 使用同一 workload；G1 只说明负载敏感性</text>
  <text x="750" y="395" text-anchor="middle" class="s">实线：实验执行流程　　虚线：基线回看与对照约束</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Activation Offload 生命周期</title>
  <desc id="desc">激活在 GPU 上产生后被搬到 CPU，反向前再搬回 GPU，搬运和同步决定收益是否值得。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#ecfdf5"/></linearGradient>
    <style>
      .title { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 30px; font-weight: 700; fill: #0f172a; }
      .sub { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 16px; font-weight: 500; fill: #475569; }
      .label { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .small { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 14px; font-weight: 500; fill: #334155; }
      .box { stroke-width: 3; rx: 18; ry: 18; }
      .flow { stroke: #475569; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .transfer { stroke: #0891b2; stroke-width: 4; stroke-dasharray: 10 7; fill: none; marker-end: url(#cyan); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker>
    <marker id="cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0891b2"/></marker>
  </defs>
  <rect width="1600" height="700" fill="url(#bg)"/>
  <text x="60" y="60" class="title">Activation Offload：用带宽换 GPU 显存</text>
  <text x="60" y="90" class="sub">激活跨过 GPU–Host 边界暂存；真正的收益取决于释放了多少显存，以及搬运是否拖慢反向</text>
  <rect x="90" y="230" width="250" height="110" class="box" fill="#eff6ff" stroke="#3b82f6"/><text x="215" y="275" text-anchor="middle" class="label">GPU 前向</text><text x="215" y="305" text-anchor="middle" class="small">产生激活 A</text>
  <rect x="500" y="230" width="250" height="110" class="box" fill="#ecfeff" stroke="#0891b2"/><text x="625" y="275" text-anchor="middle" class="label">CPU / Host 暂存</text><text x="625" y="305" text-anchor="middle" class="small">释放 GPU 驻留空间</text>
  <rect x="910" y="230" width="250" height="110" class="box" fill="#ecfccb" stroke="#65a30d"/><text x="1035" y="275" text-anchor="middle" class="label">反向前取回</text><text x="1035" y="305" text-anchor="middle" class="small">恢复激活 A</text>
  <rect x="1320" y="230" width="220" height="110" class="box" fill="#fff1f2" stroke="#e11d48"/><text x="1430" y="275" text-anchor="middle" class="label">反向计算</text><text x="1430" y="305" text-anchor="middle" class="small">继续求梯度</text>
  <path d="M340 285 L500 285" class="transfer"/><path d="M750 285 L910 285" class="transfer"/><path d="M1160 285 L1320 285" class="flow"/>
  <text x="400" y="250" class="small" fill="#0e7490">搬出</text><text x="800" y="250" class="small" fill="#0e7490">搬回</text>
  <text x="110" y="500" class="small">需要观察：激活大小、PCIe / NVLink 带宽、同步等待、峰值显存和 step time。</text>
  <text x="110" y="540" class="small">适用判断：当激活显存是瓶颈且传输代价可接受时，offload 才可能优于重算。</text>
</svg>

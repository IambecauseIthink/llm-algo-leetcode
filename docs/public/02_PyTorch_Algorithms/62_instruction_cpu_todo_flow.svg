<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">指令微调项目的数据准入决策</title><desc id="desc">把指令样本从结构检查、监督范围、样例抽检和报告结论逐步推进到训练准入。</desc>
  <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#431407}.title{font-size:25px;font-weight:700}.h{font-size:18px;font-weight:700}.b{font-size:15px;fill:#7c2d12}.box{fill:#fff;stroke:#ea580c;stroke-width:2;rx:16}.arrow{stroke:#9a3412;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#9a3412"/></marker></defs>
  <rect width="1120" height="500" fill="#fffaf5"/><text x="560" y="42" text-anchor="middle" class="title">指令数据：从样本审计到训练准入</text>
  <path class="arrow" d="M215 220 H280 M465 220 H530 M715 220 H780"/>
  <rect x="45" y="150" width="170" height="145" class="box"/><text x="130" y="190" text-anchor="middle" class="h">结构</text><text x="130" y="222" text-anchor="middle" class="b">instruction / input</text><text x="130" y="248" text-anchor="middle" class="b">output / messages</text><text x="130" y="275" text-anchor="middle" class="b">字段是否完整</text>
  <rect x="280" y="150" width="185" height="145" class="box"/><text x="372" y="190" text-anchor="middle" class="h">监督范围</text><text x="372" y="222" text-anchor="middle" class="b">prompt 与 response</text><text x="372" y="248" text-anchor="middle" class="b">空回答与过长样本</text><text x="372" y="275" text-anchor="middle" class="b">是否能正确训练</text>
  <rect x="530" y="150" width="185" height="145" class="box"/><text x="622" y="190" text-anchor="middle" class="h">样例抽检</text><text x="622" y="222" text-anchor="middle" class="b">格式、任务、答案</text><text x="622" y="248" text-anchor="middle" class="b">重复与异常比例</text><text x="622" y="275" text-anchor="middle" class="b">代表性样例</text>
  <rect x="780" y="150" width="295" height="145" class="box" fill="#ffedd5"/><text x="927" y="190" text-anchor="middle" class="h">报告与动作</text><text x="927" y="222" text-anchor="middle" class="b">准入：交给 SFT 训练</text><text x="927" y="248" text-anchor="middle" class="b">修复：返回数据工程</text><text x="927" y="275" text-anchor="middle" class="b">拒绝：记录原因</text>
  <text x="560" y="380" text-anchor="middle" class="h">CPU 阶段验证的是数据和格式逻辑</text><text x="560" y="414" text-anchor="middle" class="b">模型质量、训练速度和显存收益需要在后续训练项目中验证</text>
</svg>

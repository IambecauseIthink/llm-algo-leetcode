<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">DPO 训练总览</title><desc id="d">DPO 使用 chosen 与 rejected 回复的策略和参考模型 log probability 构造偏好损失。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><style>.h{font:700 26px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.s{font:500 15px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.l{font:700 18px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#111827}.b{font:500 14px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}.box{stroke-width:3;rx:16}.f{stroke:#475569;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="500" fill="#f8fafc"/><text x="50" y="55" class="h">DPO：偏好对如何变成一个 loss</text><text x="50" y="83" class="s">比较 chosen 与 rejected 在策略和参考模型下的相对概率，再更新策略。</text><rect x="55" y="190" width="220" height="110" class="box" fill="#eff6ff" stroke="#3b82f6"/><text x="165" y="232" text-anchor="middle" class="l">偏好数据</text><text x="165" y="263" text-anchor="middle" class="b">prompt · chosen · rejected</text><rect x="345" y="115" width="220" height="100" class="box" fill="#ecfccb" stroke="#65a30d"/><text x="455" y="155" text-anchor="middle" class="l">策略 logprob</text><text x="455" y="185" text-anchor="middle" class="b">policy 对两条回答评分</text><rect x="345" y="260" width="220" height="100" class="box" fill="#fef3c7" stroke="#d97706"/><text x="455" y="300" text-anchor="middle" class="l">参考 logprob</text><text x="455" y="330" text-anchor="middle" class="b">reference 提供锚点</text><rect x="635" y="190" width="220" height="110" class="box" fill="#fff1f2" stroke="#e11d48"/><text x="745" y="232" text-anchor="middle" class="l">隐式奖励差</text><text x="745" y="263" text-anchor="middle" class="b">chosen 与 rejected 对比</text><rect x="930" y="190" width="210" height="110" class="box" fill="#f5f3ff" stroke="#8b5cf6"/><text x="1035" y="232" text-anchor="middle" class="l">DPO loss</text><text x="1035" y="263" text-anchor="middle" class="b">logsigmoid 更新策略</text><path d="M275 235L345 165M275 265L345 310M565 165L635 225M565 310L635 275M855 245H930" class="f"/></svg>

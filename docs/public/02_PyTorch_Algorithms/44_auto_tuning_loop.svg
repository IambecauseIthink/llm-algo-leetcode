<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="100" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">Auto Tuning Framework</text>
  <text x="88" y="132" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">Turn many candidate knobs into a constrained search, one scoring rule, and a rollback-safe recommendation.</text>
  <rect x="98" y="208" width="210" height="108" rx="20" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="160" y="246" fill="#1E3A8A" font-size="22" font-family="Arial, sans-serif" font-weight="700">Goal</text>
  <text x="126" y="278" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">latency, throughput,</text>
  <text x="126" y="300" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">memory, accuracy bounds</text>
  <rect x="362" y="208" width="214" height="108" rx="20" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <text x="416" y="246" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">Search</text>
  <text x="388" y="278" fill="#92400E" font-size="16" font-family="Arial, sans-serif">batch, kernel, cache,</text>
  <text x="388" y="300" fill="#92400E" font-size="16" font-family="Arial, sans-serif">parallelism candidates</text>
  <rect x="630" y="208" width="214" height="108" rx="20" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="688" y="246" fill="#166534" font-size="22" font-family="Arial, sans-serif" font-weight="700">Measure</text>
  <text x="656" y="278" fill="#166534" font-size="16" font-family="Arial, sans-serif">compare under one</text>
  <text x="656" y="300" fill="#166534" font-size="16" font-family="Arial, sans-serif">stable benchmark protocol</text>
  <rect x="898" y="208" width="248" height="108" rx="20" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <text x="962" y="246" fill="#9D174D" font-size="22" font-family="Arial, sans-serif" font-weight="700">Decide</text>
  <text x="930" y="278" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">accept best candidate,</text>
  <text x="930" y="300" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">keep rollback path</text>
  <path d="M308 262H362" stroke="#374151" stroke-width="3"/>
  <path d="M576 262H630" stroke="#374151" stroke-width="3"/>
  <path d="M844 262H898" stroke="#374151" stroke-width="3"/>
  <path d="M347 254L362 262L347 270" fill="#374151"/>
  <path d="M615 254L630 262L615 270" fill="#374151"/>
  <path d="M883 254L898 262L883 270" fill="#374151"/>
  <rect x="98" y="390" width="1048" height="148" rx="22" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="128" y="430" fill="#111827" font-size="22" font-family="Arial, sans-serif" font-weight="700">What this page should teach</text>
  <text x="128" y="464" fill="#374151" font-size="18" font-family="Arial, sans-serif">A tuning loop is not a random sweep. It first filters by constraints, then compares only feasible candidates under one stable benchmark protocol.</text>
  <text x="128" y="496" fill="#374151" font-size="18" font-family="Arial, sans-serif">Without that structure, many measurements create noise instead of a ranked recommendation you can keep or roll back.</text>
  <rect x="98" y="566" width="1048" height="60" rx="18" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
  <text x="128" y="598" fill="#075985" font-size="18" font-family="Arial, sans-serif">A useful tuner answers one process question: which feasible configuration deserves the next serious validation run.</text>
</svg>

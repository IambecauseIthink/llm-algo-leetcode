<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
<title id="t">梯度累积训练路径总览</title><desc id="d">有效 batch 被拆成多个 micro-batch，单次计算降低 activation 峰值，梯度在参数上累积，最后执行一次 optimizer step。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><style>
.h{font:700 28px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.s{font:500 15px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.l{font:700 18px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#111827}.b{font:500 14px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}.box{stroke-width:3;rx:16}.f{stroke:#475569;stroke-width:4;fill:none;marker-end:url(#a)}
</style></defs>
<rect width="1200" height="560" fill="#f8fafc"/>
<text x="50" y="52" class="h">梯度累积：从逻辑 batch 到显存与更新节奏</text>
<text x="50" y="82" class="s">上层看一次更新如何推进，下层看 micro-batch、长期状态和有效 batch 分别改变什么。</text>
<rect x="45" y="170" width="210" height="120" class="box" fill="#eff6ff" stroke="#3b82f6"/><text x="150" y="215" text-anchor="middle" class="l">逻辑 batch</text><text x="150" y="250" text-anchor="middle" class="b">一次更新看到的样本总量</text>
<path d="M255 230H320" class="f"/>
<rect x="320" y="170" width="210" height="120" class="box" fill="#fef3c7" stroke="#d97706"/><text x="425" y="215" text-anchor="middle" class="l">拆成 micro-batch</text><text x="425" y="250" text-anchor="middle" class="b">每次只处理一部分样本</text>
<path d="M530 230H595" class="f"/>
<rect x="595" y="170" width="210" height="120" class="box" fill="#ecfccb" stroke="#65a30d"/><text x="700" y="215" text-anchor="middle" class="l">多次 backward</text><text x="700" y="250" text-anchor="middle" class="b">梯度保留并逐步累积</text>
<path d="M805 230H870" class="f"/>
<rect x="870" y="170" width="270" height="120" class="box" fill="#f5f3ff" stroke="#8b5cf6"/><text x="1005" y="215" text-anchor="middle" class="l">一次参数更新</text><text x="1005" y="250" text-anchor="middle" class="b">完成一次有效 batch 的更新</text>
<rect x="215" y="365" width="250" height="105" class="box" fill="#e0f2fe" stroke="#0284c7"/><text x="340" y="408" text-anchor="middle" class="l">单步显存峰值</text><text x="340" y="443" text-anchor="middle" class="b">主要随 micro-batch 的 activation 变化</text>
<rect x="515" y="365" width="250" height="105" class="box" fill="#fef3c7" stroke="#d97706"/><text x="640" y="408" text-anchor="middle" class="l">长期驻留状态</text><text x="640" y="443" text-anchor="middle" class="b">参数、梯度、optimizer state 仍需保留</text>
<rect x="815" y="365" width="250" height="105" class="box" fill="#dcfce7" stroke="#16a34a"/><text x="940" y="408" text-anchor="middle" class="l">更新口径</text><text x="940" y="443" text-anchor="middle" class="b">梯度尺度与更新时机决定可比性</text>
<path d="M425 290V365" class="f"/><path d="M700 290V365" class="f"/><path d="M1005 290V365" class="f"/>
<text x="600" y="520" text-anchor="middle" class="s">主链说明训练如何推进；下方说明显存峰值、长期状态和更新口径的对应关系。</text>
</svg>

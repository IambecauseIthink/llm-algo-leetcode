<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="100" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">SFT Data Engineering Flow</text>
  <text x="88" y="132" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">Good SFT data engineering is the path from raw samples to stable `input_ids / attention_mask / labels`, not just a cleaning script.</text>
  <rect x="92" y="210" width="184" height="94" rx="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="144" y="246" fill="#1E3A8A" font-size="22" font-family="Arial, sans-serif" font-weight="700">Raw Data</text>
  <text x="118" y="276" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">prompt, response,</text>
  <text x="118" y="298" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">metadata, noise</text>
  <rect x="324" y="210" width="194" height="94" rx="18" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <text x="372" y="246" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">Cleaning</text>
  <text x="352" y="276" fill="#92400E" font-size="16" font-family="Arial, sans-serif">dedup, empty check,</text>
  <text x="352" y="298" fill="#92400E" font-size="16" font-family="Arial, sans-serif">field normalization</text>
  <rect x="566" y="210" width="214" height="94" rx="18" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="614" y="246" fill="#166534" font-size="22" font-family="Arial, sans-serif" font-weight="700">Template &amp; Split</text>
  <text x="596" y="276" fill="#166534" font-size="16" font-family="Arial, sans-serif">prompt/response boundary,</text>
  <text x="596" y="298" fill="#166534" font-size="16" font-family="Arial, sans-serif">packing and truncation rule</text>
  <rect x="828" y="210" width="194" height="94" rx="18" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <text x="866" y="246" fill="#9D174D" font-size="22" font-family="Arial, sans-serif" font-weight="700">Audit</text>
  <text x="856" y="276" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">length dist, anomalies,</text>
  <text x="856" y="298" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">sample inspection</text>
  <rect x="1070" y="210" width="110" height="94" rx="18" fill="#E9D5FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="1088" y="246" fill="#5B21B6" font-size="22" font-family="Arial, sans-serif" font-weight="700">Train</text>
  <text x="1086" y="276" fill="#5B21B6" font-size="16" font-family="Arial, sans-serif">stable</text>
  <text x="1086" y="298" fill="#5B21B6" font-size="16" font-family="Arial, sans-serif">inputs</text>
  <path d="M276 257H324" stroke="#374151" stroke-width="3"/>
  <path d="M518 257H566" stroke="#374151" stroke-width="3"/>
  <path d="M780 257H828" stroke="#374151" stroke-width="3"/>
  <path d="M1022 257H1070" stroke="#374151" stroke-width="3"/>
  <path d="M309 249L324 257L309 265" fill="#374151"/>
  <path d="M551 249L566 257L551 265" fill="#374151"/>
  <path d="M813 249L828 257L813 265" fill="#374151"/>
  <path d="M1055 249L1070 257L1055 265" fill="#374151"/>
  <rect x="108" y="380" width="1052" height="124" rx="22" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="136" y="420" fill="#111827" font-size="22" font-family="Arial, sans-serif" font-weight="700">What the audit must prove</text>
  <text x="136" y="454" fill="#374151" font-size="18" font-family="Arial, sans-serif">the sample boundary is correct, supervision falls only where intended, lengths are believable, and anomalies are visible before hyperparameter tuning starts.</text>
  <text x="136" y="484" fill="#374151" font-size="18" font-family="Arial, sans-serif">If the audit is weak, training quality comparisons will usually be noise hiding as optimization.</text>
  <rect x="108" y="546" width="1052" height="78" rx="18" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="136" y="580" fill="#1E3A8A" font-size="18" font-family="Arial, sans-serif">Page 32 uses this flow to make one rule explicit: data engineering is complete only when the transformed samples can be trusted by the training loop.</text>
</svg>

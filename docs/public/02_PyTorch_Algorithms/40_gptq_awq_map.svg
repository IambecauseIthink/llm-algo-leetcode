<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#F7F4EC"/>
  <rect x="56" y="48" width="1168" height="624" rx="28" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
  <text x="88" y="100" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">GPTQ and AWQ Weight Quantization</text>
  <text x="88" y="132" fill="#4B5563" font-size="18" font-family="Arial, sans-serif">Both are post-training weight quantizers, but they protect accuracy through different signals.</text>
  <rect x="102" y="204" width="236" height="110" rx="20" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="174" y="244" fill="#1E3A8A" font-size="22" font-family="Arial, sans-serif" font-weight="700">Calibration</text>
  <text x="128" y="278" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">sample activations expose</text>
  <text x="128" y="300" fill="#1E3A8A" font-size="16" font-family="Arial, sans-serif">which weights are sensitive</text>
  <rect x="390" y="204" width="238" height="110" rx="20" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <text x="468" y="244" fill="#92400E" font-size="22" font-family="Arial, sans-serif" font-weight="700">GPTQ</text>
  <text x="420" y="278" fill="#92400E" font-size="16" font-family="Arial, sans-serif">optimize reconstruction error</text>
  <text x="420" y="300" fill="#92400E" font-size="16" font-family="Arial, sans-serif">after grouped quantization</text>
  <rect x="680" y="204" width="238" height="110" rx="20" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="756" y="244" fill="#166534" font-size="22" font-family="Arial, sans-serif" font-weight="700">AWQ</text>
  <text x="706" y="278" fill="#166534" font-size="16" font-family="Arial, sans-serif">protect activation-sensitive</text>
  <text x="706" y="300" fill="#166534" font-size="16" font-family="Arial, sans-serif">channels before quantization</text>
  <rect x="970" y="204" width="176" height="110" rx="20" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <text x="1018" y="244" fill="#9D174D" font-size="22" font-family="Arial, sans-serif" font-weight="700">Deploy</text>
  <text x="994" y="278" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">lower weight traffic</text>
  <text x="994" y="300" fill="#9D174D" font-size="16" font-family="Arial, sans-serif">with bounded error</text>
  <path d="M338 258H390" stroke="#374151" stroke-width="3"/>
  <path d="M628 258H680" stroke="#374151" stroke-width="3"/>
  <path d="M918 258H970" stroke="#374151" stroke-width="3"/>
  <path d="M375 250L390 258L375 266" fill="#374151"/>
  <path d="M665 250L680 258L665 266" fill="#374151"/>
  <path d="M955 250L970 258L955 266" fill="#374151"/>
  <rect x="102" y="380" width="1044" height="146" rx="22" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="132" y="420" fill="#111827" font-size="22" font-family="Arial, sans-serif" font-weight="700">How to read the difference</text>
  <text x="132" y="454" fill="#374151" font-size="18" font-family="Arial, sans-serif">GPTQ asks how to keep layer output reconstruction error small after low-bit compression. AWQ asks which channels should be treated more carefully because activation statistics amplify their error.</text>
  <text x="132" y="486" fill="#374151" font-size="18" font-family="Arial, sans-serif">So the shared chain is calibration, grouping, quantization, dequantization, and error check; the difference is what signal decides "sensitive".</text>
  <rect x="102" y="558" width="1044" height="68" rx="18" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
  <text x="132" y="590" fill="#075985" font-size="18" font-family="Arial, sans-serif">Page 40 should leave one judgment: low-bit weight quantization is not just fewer bits, but a decision about which errors matter most.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d">
<title id="t">MoE 专家并行总览</title><desc id="d">token 经路由分发到专家设备，完成计算后再合并，并同时观察负载与通信。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><style>.h{font:700 26px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.s{font:500 15px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.l{font:700 18px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#111827}.b{font:500 14px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}.box{stroke-width:3;rx:16}.f{stroke:#475569;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1200" height="500" fill="#f8fafc"/><text x="50" y="55" class="h">MoE 专家并行：路由、计算与通信</text><text x="50" y="83" class="s">稀疏激活降低单 token 计算量，但 token 必须被送到对应专家设备。</text>
<rect x="55" y="190" width="220" height="110" class="box" fill="#eff6ff" stroke="#3b82f6"/><text x="165" y="232" text-anchor="middle" class="l">Token 与路由</text><text x="165" y="263" text-anchor="middle" class="b">top-k 专家选择</text>
<rect x="345" y="190" width="220" height="110" class="box" fill="#fef3c7" stroke="#d97706"/><text x="455" y="232" text-anchor="middle" class="l">Dispatch</text><text x="455" y="263" text-anchor="middle" class="b">发送到专家设备</text>
<rect x="635" y="190" width="220" height="110" class="box" fill="#ecfccb" stroke="#65a30d"/><text x="745" y="232" text-anchor="middle" class="l">专家计算</text><text x="745" y="263" text-anchor="middle" class="b">负载 · capacity · overflow</text>
<rect x="930" y="190" width="210" height="110" class="box" fill="#f5f3ff" stroke="#8b5cf6"/><text x="1035" y="232" text-anchor="middle" class="l">Combine</text><text x="1035" y="263" text-anchor="middle" class="b">回收结果并继续</text>
<path d="M275 245H345M565 245H635M855 245H930" class="f"/>
</svg>

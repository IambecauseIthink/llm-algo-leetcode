<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 560" role="img" aria-labelledby="title desc">
<title id="title">投机解码的接受与修正路径</title><desc id="desc">草稿模型提出 token，目标模型逐个验证；接受、拒绝修正和全部接受 bonus token 是三种结果。</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#fff7ed"/></linearGradient><style>
.title{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:28px;font-weight:700;fill:#0f172a}.sub{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:15px;font-weight:500;fill:#475569}.label{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:18px;font-weight:700;fill:#111827}.small{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:13px;font-weight:500;fill:#334155}.box{stroke-width:3;rx:16;ry:16}.flow{stroke:#475569;stroke-width:4;fill:none;marker-end:url(#arrow)}.branch{stroke:#dc2626;stroke-width:3.5;fill:none;marker-end:url(#red)}</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dc2626"/></marker></defs>
<rect width="1500" height="560" fill="url(#bg)"/><text x="60" y="54" class="title">Speculative Decoding：验证结果决定下一步</text><text x="60" y="82" class="sub">草稿模型负责提出候选，目标模型负责验证；拒绝时必须走 residual correction</text>
<rect x="70" y="220" width="220" height="100" class="box" fill="#fff7ed" stroke="#f59e0b"/><text x="180" y="260" text-anchor="middle" class="label">草稿模型</text><text x="180" y="290" text-anchor="middle" class="small">提出 K 个 token</text>
<rect x="390" y="220" width="230" height="100" class="box" fill="#eff6ff" stroke="#3b82f6"/><text x="505" y="260" text-anchor="middle" class="label">目标模型</text><text x="505" y="290" text-anchor="middle" class="small">计算 p，逐位置验证</text>
<rect x="720" y="220" width="220" height="100" class="box" fill="#f5f3ff" stroke="#8b5cf6"/><text x="830" y="260" text-anchor="middle" class="label">接受判断</text><text x="830" y="290" text-anchor="middle" class="small">比较 p(x) 与 q(x)</text>
<rect x="1060" y="120" width="260" height="100" class="box" fill="#ecfccb" stroke="#65a30d"/><text x="1190" y="160" text-anchor="middle" class="label">接受</text><text x="1190" y="190" text-anchor="middle" class="small">继续检查下一个位置</text>
<rect x="1060" y="270" width="260" height="100" class="box" fill="#fff1f2" stroke="#e11d48"/><text x="1190" y="310" text-anchor="middle" class="label">拒绝</text><text x="1190" y="340" text-anchor="middle" class="small">从 residual 分布修正</text>
<rect x="1060" y="420" width="260" height="80" class="box" fill="#ffffff" stroke="#cbd5e1"/><text x="1190" y="454" text-anchor="middle" class="label">全部接受</text><text x="1190" y="480" text-anchor="middle" class="small">采样 bonus token</text>
<path d="M290 270L390 270" class="flow"/><path d="M620 270L720 270" class="flow"/><path d="M940 250C990 210 1010 170 1060 170" class="flow"/><path d="M940 280L1060 320" class="branch"/><path d="M940 300C990 400 1020 460 1060 460" class="flow"/>
</svg>

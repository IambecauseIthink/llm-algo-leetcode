<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300">
  <rect width="1100" height="300" fill="#f7fdf9"/>
  <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#052e16} .box{fill:#fff;stroke:#16a34a;stroke-width:2;rx:14} .arrow{stroke:#166534;stroke-width:3;marker-end:url(#m)}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#166534"/></marker></defs>
  <text x="550" y="38" text-anchor="middle" font-size="24" font-weight="700">LoRA 变体的单变量实验</text>
  <rect class="box" x="30" y="105" width="190" height="100"/><text x="125" y="145" text-anchor="middle" font-size="20">选一个变量</text><text x="125" y="177" text-anchor="middle" font-size="16">rank / alpha / dropout</text>
  <rect class="box" x="260" y="105" width="190" height="100"/><text x="355" y="145" text-anchor="middle" font-size="20">固定条件</text><text x="355" y="177" text-anchor="middle" font-size="16">模型、数据、步数、seed</text>
  <rect class="box" x="490" y="105" width="190" height="100"/><text x="585" y="145" text-anchor="middle" font-size="20">运行对照</text><text x="585" y="177" text-anchor="middle" font-size="16">baseline 与候选</text>
  <rect class="box" x="720" y="105" width="150" height="100"/><text x="795" y="145" text-anchor="middle" font-size="20">看指标</text><text x="795" y="177" text-anchor="middle" font-size="16">质量、显存、速度</text>
  <rect class="box" x="910" y="105" width="160" height="100"/><text x="990" y="145" text-anchor="middle" font-size="20">做决策</text><text x="990" y="177" text-anchor="middle" font-size="16">接受或调整</text>
  <path class="arrow" d="M220 155 H255"/><path class="arrow" d="M450 155 H485"/><path class="arrow" d="M680 155 H715"/><path class="arrow" d="M870 155 H905"/>
  <text x="550" y="255" text-anchor="middle" font-size="16" fill="#166534">CPU 练习比较逻辑；GPU 对照才支持真实性能结论</text>
</svg>

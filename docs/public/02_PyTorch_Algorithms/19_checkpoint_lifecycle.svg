<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 650" role="img" aria-labelledby="title desc">
  <title id="title">Checkpoint 区段的前向与反向生命周期</title>
  <desc id="desc">前向经过一个 checkpoint 区段并保存边界状态，反向读取边界后重算区段内部，再继续求梯度。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient>
    <style>
      .title { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 28px; font-weight: 700; fill: #0f172a; }
      .sub { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 15px; font-weight: 500; fill: #475569; }
      .lane { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 18px; font-weight: 700; fill: #334155; }
      .label { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 17px; font-weight: 700; fill: #111827; }
      .small { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 500; fill: #334155; }
      .box { stroke-width: 3; rx: 16; ry: 16; }
      .forward { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#grayArrow); }
      .backward { stroke: #8b5cf6; stroke-width: 3; stroke-dasharray: 9 7; fill: none; marker-end: url(#purpleArrow); }
      .handoff { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5 6; fill: none; marker-end: url(#grayArrow); }
    </style>
    <marker id="grayArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
    <marker id="purpleArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8b5cf6"/></marker>
  </defs>
  <rect width="1500" height="650" fill="url(#bg)"/>
  <text x="60" y="52" class="title">Checkpoint：保存边界，反向时重算区段内部</text>
  <text x="60" y="80" class="sub">前向和反向不是同一条直线：反向先恢复边界状态，再重建需要的中间结果</text>

  <text x="90" y="145" class="lane">前向：建立边界</text>
  <rect x="90" y="175" width="210" height="82" class="box" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="195" y="211" text-anchor="middle" class="label">输入状态</text>
  <text x="195" y="237" text-anchor="middle" class="small">区段起点</text>
  <rect x="430" y="175" width="270" height="82" class="box" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="565" y="211" text-anchor="middle" class="label">区段前向</text>
  <text x="565" y="237" text-anchor="middle" class="small">连续执行多个 Block</text>
  <rect x="830" y="175" width="250" height="82" class="box" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="955" y="211" text-anchor="middle" class="label">保存边界状态</text>
  <text x="955" y="237" text-anchor="middle" class="small">内部激活不长期保存</text>
  <path d="M300 216 L430 216" class="forward"/>
  <path d="M700 216 L830 216" class="forward"/>

  <text x="90" y="365" class="lane">反向：恢复并求梯度</text>
  <rect x="830" y="395" width="250" height="82" class="box" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="955" y="431" text-anchor="middle" class="label">读取边界状态</text>
  <text x="955" y="457" text-anchor="middle" class="small">作为重算输入</text>
  <rect x="430" y="395" width="270" height="82" class="box" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="565" y="431" text-anchor="middle" class="label">重算区段内部</text>
  <text x="565" y="457" text-anchor="middle" class="small">恢复反向所需激活</text>
  <rect x="90" y="395" width="250" height="82" class="box" fill="#ecfccb" stroke="#65a30d"/>
  <text x="215" y="431" text-anchor="middle" class="label">继续反向求梯度</text>
  <text x="215" y="457" text-anchor="middle" class="small">与普通反向衔接</text>
  <path d="M830 436 L700 436" class="backward"/>
  <path d="M430 436 L340 436" class="backward"/>
  <path d="M955 257 L955 395" class="handoff"/>
  <text x="980" y="335" class="small">反向需要时读取</text>
</svg>

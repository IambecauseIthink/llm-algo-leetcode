<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="520" viewBox="0 0 1160 520" role="img" aria-labelledby="title desc">
  <title id="title">SFT 数据质量的准入决策</title><desc id="desc">根据字段完整性、监督范围、重复长度和任务样例检查，把数据分为准入、修复或拒绝。</desc>
  <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.title{font-size:25px;font-weight:700}.h{font-size:18px;font-weight:700}.b{font-size:15px;fill:#334155}.head{font-size:16px;font-weight:700;fill:#fff}.cell{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.ok{fill:#ecfdf5;stroke:#34d399;stroke-width:2}.fix{fill:#fffbeb;stroke:#f59e0b;stroke-width:2}.bad{fill:#fff1f2;stroke:#fb7185;stroke-width:2}</style>
  <rect width="1160" height="520" fill="#f8fafc"/><text x="580" y="42" text-anchor="middle" class="title">SFT 数据质量：检查结果如何变成准入动作</text>
  <rect x="70" y="82" width="1020" height="48" fill="#475569" rx="10"/><text x="205" y="113" text-anchor="middle" class="head">检查项</text><text x="455" y="113" text-anchor="middle" class="head">观察内容</text><text x="720" y="113" text-anchor="middle" class="head">典型问题</text><text x="995" y="113" text-anchor="middle" class="head">动作</text>
  <rect x="70" y="130" width="270" height="82" class="cell"/><text x="205" y="164" text-anchor="middle" class="h">字段与格式</text><text x="205" y="190" text-anchor="middle" class="b">instruction / response</text>
  <rect x="340" y="130" width="230" height="82" class="cell"/><text x="455" y="164" text-anchor="middle" class="h">结构完整性</text><text x="455" y="190" text-anchor="middle" class="b">字段、类型、空值</text>
  <rect x="570" y="130" width="255" height="82" class="cell"/><text x="697" y="164" text-anchor="middle" class="h">缺字段 / 空回答</text><text x="697" y="190" text-anchor="middle" class="b">模板不一致</text>
  <rect x="825" y="130" width="265" height="82" class="fix"/><text x="957" y="177" text-anchor="middle" class="h">修复后复查</text>
  <rect x="70" y="212" width="270" height="82" class="cell"/><text x="205" y="246" text-anchor="middle" class="h">监督范围</text><text x="205" y="272" text-anchor="middle" class="b">prompt / response / mask</text>
  <rect x="340" y="212" width="230" height="82" class="cell"/><text x="455" y="246" text-anchor="middle" class="h">可训练性</text><text x="455" y="272" text-anchor="middle" class="b">是否留下监督 token</text>
  <rect x="570" y="212" width="255" height="82" class="cell"/><text x="697" y="246" text-anchor="middle" class="h">空监督 / 过长</text><text x="697" y="272" text-anchor="middle" class="b">截断后无目标</text>
  <rect x="825" y="212" width="265" height="82" class="bad"/><text x="957" y="259" text-anchor="middle" class="h">返回数据工程</text>
  <rect x="70" y="294" width="270" height="82" class="cell"/><text x="205" y="328" text-anchor="middle" class="h">重复与样例</text><text x="205" y="354" text-anchor="middle" class="b">重复率、任务覆盖</text>
  <rect x="340" y="294" width="230" height="82" class="cell"/><text x="455" y="328" text-anchor="middle" class="h">代表性</text><text x="455" y="354" text-anchor="middle" class="b">抽样检查回答</text>
  <rect x="570" y="294" width="255" height="82" class="cell"/><text x="697" y="328" text-anchor="middle" class="h">重复过高 / 任务偏斜</text><text x="697" y="354" text-anchor="middle" class="b">样例质量不稳定</text>
  <rect x="825" y="294" width="265" height="82" class="ok"/><text x="957" y="341" text-anchor="middle" class="h">准入 SFT 项目</text>
  <text x="580" y="440" text-anchor="middle" class="h">CPU 阶段输出的是数据准入证据；模型效果仍需后续训练和评测验证</text>
</svg>
